name: CI
on:
  push:
    # Every workspace package `pnpm test` covers must be listed, or a change in
    # one package can break another's test with no CI run to catch it — and the
    # fix (touching only the unlisted package) never re-runs CI either. That is
    # exactly how `mcp/**` hiding four config ops left main red for three days
    # on a `skills-eval/**` assertion.
    paths: ["openapi/**", "mcp/**", "cli/**", "skills-contract/**", "skills-eval/**", "package.json", "pnpm-workspace.yaml", "pnpm-lock.yaml", "turbo.json", ".github/workflows/ci.yml"]
  pull_request:
    # Every workspace package `pnpm test` covers must be listed, or a change in
    # one package can break another's test with no CI run to catch it — and the
    # fix (touching only the unlisted package) never re-runs CI either. That is
    # exactly how `mcp/**` hiding four config ops left main red for three days
    # on a `skills-eval/**` assertion.
    paths: ["openapi/**", "mcp/**", "cli/**", "skills-contract/**", "skills-eval/**", "package.json", "pnpm-workspace.yaml", "pnpm-lock.yaml", "turbo.json", ".github/workflows/ci.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm type-check
      - run: pnpm test
