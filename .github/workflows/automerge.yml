name: Auto-merge

# Squash-merges an open PR once EVERY workflow run on its head commit has
# finished green — but only PRs opened by the owner's account, from a branch in
# this repo, not a draft, and without the `no-automerge` label.
#
# Why workflow_run and not native auto-merge + a required-checks ruleset:
# several workflows here are path-filtered on push and direct pushes to main
# are the norm, so a ruleset would either block those pushes or wait forever on
# a check that never reports. Instead this fires whenever any PR workflow
# below completes; earlier completions see runs still pending and exit, the
# last one merges.
#
# workflow_run executes this file from main with a write token. It never checks
# out PR code — it only reads the API — so a PR cannot change what it does.
# Keep `workflows:` in sync with every workflow that has a `pull_request`
# trigger (names must match each file's `name:` exactly).
#
# A merge made with GITHUB_TOKEN fires no `push` workflows, so the publish-*
# workflows never saw an auto-merged release (openapi 3.8.0 / mcp 2.14.0 /
# cli 2.23.0 sat unpublished). workflow_dispatch is exempt from that rule, so
# after merging this dispatches them on main. Each publishes only a version
# npm doesn't have yet, so a dispatch with nothing to ship is a no-op.

on:
  workflow_run:
    workflows:
      - CI
      - Contract Tests
      - Skills Contract
      - "install · Claude Code"
      - "install · Codex"
      - "install · GitHub Copilot CLI"
      - "install · Tier-2 agents (skills)"
    types: [completed]

permissions: {}

concurrency:
  group: automerge-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  merge:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
      checks: read
      statuses: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      SHA: ${{ github.event.workflow_run.head_sha }}
      OWNER_LOGIN: vshaveyko
    steps:
      - name: Merge when every run on the head commit is green
        run: |
          set -euo pipefail

          pr=$(gh api "repos/$REPO/commits/$SHA/pulls" \
            --jq "[.[] | select(.state == \"open\" and .head.sha == \"$SHA\")][0]" 2>/dev/null || true)
          if [ -z "$pr" ] || [ "$pr" = "null" ]; then
            echo "No open PR has $SHA as its head — nothing to merge."; exit 0
          fi
          number=$(jq -r .number <<<"$pr")
          author=$(jq -r .user.login <<<"$pr")
          head_repo=$(jq -r .head.repo.full_name <<<"$pr")
          draft=$(jq -r .draft <<<"$pr")
          held=$(jq -r '[.labels[].name] | index("no-automerge") != null' <<<"$pr")

          [ "$author" = "$OWNER_LOGIN" ] || { echo "#$number by $author — owner PRs only."; exit 0; }
          [ "$head_repo" = "$REPO" ] || { echo "#$number is from a fork — skipped."; exit 0; }
          [ "$draft" = "false" ] || { echo "#$number is a draft — skipped."; exit 0; }
          [ "$held" = "false" ] || { echo "#$number carries no-automerge — skipped."; exit 0; }

          # Every Actions workflow run on this exact commit must be finished
          # and passing. A run still queued or in progress means a later
          # completion will re-enter here, so just exit.
          runs=$(gh api --paginate "repos/$REPO/actions/runs?head_sha=$SHA&per_page=100" \
            --jq '.workflow_runs[] | select(.event == "pull_request") | "\(.status) \(.conclusion) \(.name)"')
          echo "$runs"
          if grep -qv '^completed ' <<<"$runs"; then
            echo "Runs still pending — a later completion will merge."; exit 0
          fi
          if grep -vqE '^completed (success|skipped|neutral) ' <<<"$runs"; then
            echo "A run did not pass — not merging #$number."; exit 0
          fi

          # Checks from other apps and legacy commit statuses count too.
          bad_checks=$(gh api --paginate "repos/$REPO/commits/$SHA/check-runs?per_page=100" \
            --jq '.check_runs[] | select(.app.slug != "github-actions")
                  | select(.status != "completed" or ((.conclusion // "") | IN("success","skipped","neutral") | not))
                  | .name')
          bad_statuses=$(gh api "repos/$REPO/commits/$SHA/status" --jq '.statuses[] | select(.state != "success") | .context')
          if [ -n "$bad_checks$bad_statuses" ]; then
            echo "Not green yet: $bad_checks $bad_statuses"; exit 0
          fi

          echo "All green — merging #$number."
          gh pr merge "$number" --repo "$REPO" --squash --match-head-commit "$SHA"

          for wf in publish-openapi.yml publish-mcp.yml publish-cli.yml; do
            gh workflow run "$wf" --repo "$REPO" --ref main
          done
