# Keep a Shipeasy ops bug in sync with each workflow's health on `main` — we
# dogfood our own queue for our own CI, instead of relying on someone noticing
# a red run.
#
# ONE item per workflow, for its whole red period:
#   - first failure          → file a bug
#   - re-run / next failure  → comment the new run onto the SAME item, never a
#                              second bug
#   - first green run        → comment the fix and flip it to `resolved`
#
# Workflow names below must match each workflow's `name:` EXACTLY — GitHub
# silently never triggers on a name that doesn't exist.
name: Report CI failure

on:
  workflow_run:
    workflows:
      - CI
      - Contract Tests
      - Publish cli
      - Publish mcp
      - Publish openapi
      - Skills Contract
      - prod-probe
      - install · Claude Code
      - install · Codex
      - install · GitHub Copilot CLI
      - install · Tier-2 agents (skills)
    types: [completed]

concurrency:
  # Serialized: two reporters running at once could both miss the other's item
  # and file a duplicate, which is the one thing this workflow exists to avoid.
  group: report-ci-failure
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  report:
    # `cancelled` and `skipped` say nothing about health — only a real verdict
    # opens or closes an item.
    if: >
      github.event.workflow_run.head_branch == 'main' &&
      contains(fromJSON('["failure","timed_out","success"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    env:
      # A CLI session token + the project it's bound to (`shipeasy login`'s env
      # equivalent). The project id is the one committed in the parent repo's
      # `.shipeasy` — not a secret, so only the token has to be configured.
      SHIPEASY_CLI_TOKEN: ${{ secrets.SHIPEASY_CLI_TOKEN }}
      SHIPEASY_PROJECT_ID: ${{ secrets.SHIPEASY_PROJECT_ID || 'e976b15e-3ccc-44d3-821d-87f06d5a0e43' }}
      GH_TOKEN: ${{ github.token }}
      WF_NAME: ${{ github.event.workflow_run.name }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      CONCLUSION: ${{ github.event.workflow_run.conclusion }}
    steps:
      - name: Check the reporter is configured
        run: |
          if [ -z "$SHIPEASY_CLI_TOKEN" ]; then
            echo "::warning::SHIPEASY_CLI_TOKEN is not set — cannot sync the CI item. Add the secret to enable this."
          fi

      - name: Install the Shipeasy CLI
        if: env.SHIPEASY_CLI_TOKEN != ''
        run: npm install -g @shipeasy/cli@latest

      - name: Open, update, or close this workflow's item
        if: env.SHIPEASY_CLI_TOKEN != ''
        run: |
          set -euo pipefail

          TITLE="CI failed: ${WF_NAME}"

          # The item this workflow already owns, if any. Two queries because
          # `status=all` deliberately EXCLUDES `pending_approval` — an item
          # parked there is still tracking this workflow, and missing it would
          # file the duplicate this whole workflow exists to prevent.
          find_handle() {
            { shipeasy ops list --type bug --status all --limit 500
              shipeasy ops list --type bug --status pending_approval --limit 500
            } | jq -rs --arg t "$TITLE" '
                  [ .[] | (if type == "array" then . else .data end) ] | add
                  | map(select(.title == $t and (.status | IN("resolved","wont_fix") | not)))
                  | first | .number // empty'
          }
          HANDLE=$(find_handle)

          if [ "$CONCLUSION" = "success" ]; then
            if [ -z "$HANDLE" ]; then
              echo "Green, and nothing open for ${WF_NAME} — nothing to do"
              exit 0
            fi
            echo "Green again — resolving #${HANDLE}"
            shipeasy ops comments create "$HANDLE" --body \
              "$(printf 'Green again on %s\nRun: %s\nCommit: %s\n\nAuto-resolved by the CI reporter\n' \
                 "$WF_NAME" "$RUN_URL" "$HEAD_SHA")"
            shipeasy ops update "$HANDLE" --status resolved
            exit 0
          fi

          # Failing job → failing step, so the item says what broke, not just
          # that something did.
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs" --paginate \
            --jq '.jobs[] | select(.conclusion=="failure") |
                  "- \(.name): \([.steps[]? | select(.conclusion=="failure") | .name] | join(", "))"' \
            > failed.txt || true
          [ -s failed.txt ] || echo "- (no per-job detail available)" > failed.txt

          BODY=$(printf 'Workflow: %s\nRun: %s\nCommit: %s\n\nFailed:\n%s\n' \
            "$WF_NAME" "$RUN_URL" "$HEAD_SHA" "$(cat failed.txt)")

          if [ -n "$HANDLE" ]; then
            echo "Already tracked as #${HANDLE} — commenting this run onto it"
            shipeasy ops comments create "$HANDLE" --body "$BODY"
          else
            shipeasy ops bug "$TITLE" \
              --steps-to-reproduce "Push to main, or re-run: ${RUN_URL}" \
              --actual-result "$BODY" \
              --expected-result "The ${WF_NAME} workflow passes on main" \
              --priority high \
              --tags '["ci","ci-failure"]' \
              --page-url "$RUN_URL"
          fi
