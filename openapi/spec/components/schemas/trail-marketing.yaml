TrailMarketingAssetKind:
  type: string
  enum:
    - email
    - post
    - ad
  description: What the asset is. `email` is sent through the platform's mail queue; `post` and `ad` are handed off to a person who posts or launches them and records the URL. Set by the channel, never chosen.
TrailMarketingAssetChannel:
  type: string
  enum:
    - blog
    - email
    - social
    - ads
    - landing
    - community
    - press
  description: The plan channel the asset belongs to. `email` makes an email asset, `ads` an ad, every other channel a post. `in_app` and `other` stay tracked items and have no asset.
TrailMarketingAssetState:
  type: string
  enum:
    - draft
    - in_review
    - changes_requested
    - approved
    - scheduled
    - delivering
    - delivered
    - failed
    - cancelled
  description: Where the asset is in its lifecycle — `draft → in_review → approved → scheduled → delivering → delivered`, with the side exits `changes_requested` (back to `draft` on the next edit), `failed` and `cancelled`.
TrailMarketingAudience:
  type: object
  description: Who an email asset goes to. Project members (everyone, or only some roles) and/or contact lists that carry a consent attestation. Every recipient is checked against the project's suppression list, and the send is bounded by the plan's daily marketing email cap.
  properties:
    members:
      anyOf:
        - type: string
          enum:
            - all
        - type: array
          minItems: 1
          items:
            type: string
            enum:
              - owner
              - admin
              - editor
              - viewer
        - type: "null"
      description: "`all` for every active member, a list of roles for only those, or `null` for no members."
    lists:
      type: array
      maxItems: 20
      items:
        type: string
        minLength: 1
        maxLength: 64
      description: Contact list ids (`MarketingList.id`). Each must be attested and not archived.
  additionalProperties: false
TrailMarketingAssetContent:
  type: object
  description: |-
    The asset's content, typed by kind:
    - `email` — `subject`, `html` and/or `text`.
    - `post` — `body`, optional `media` URLs and a `target` (the Slack channel, the subreddit, the account).
    - `ad` — `variants` (each a `headline`, `body` and `cta`), `platform`, `budget`, and an optional `audience` description.
  properties:
    subject:
      type: string
      maxLength: 200
      description: Email subject line.
    html:
      type: string
      maxLength: 200000
      description: Email HTML body.
    text:
      type: string
      maxLength: 100000
      description: Email plain-text body.
    body:
      type: string
      maxLength: 40000
      description: The post's text.
    media:
      type: array
      maxItems: 10
      items:
        type: string
        format: uri
        maxLength: 2000
      description: Image or video URLs attached to the post.
    target:
      type: string
      maxLength: 200
      description: Where the post goes — a Slack channel, a subreddit, an account name.
    variants:
      type: array
      minItems: 1
      maxItems: 10
      items:
        type: object
        properties:
          headline:
            type: string
            maxLength: 200
          body:
            type: string
            maxLength: 2000
          cta:
            type: string
            maxLength: 100
        required:
          - headline
        additionalProperties: false
      description: The ad's copy variants.
    platform:
      type: string
      maxLength: 100
      description: The ad platform (Google, Meta, LinkedIn, …).
    budget:
      type: string
      maxLength: 100
      description: The ad's budget, as the person launching it will read it (`$500 over 2 weeks`).
    audience:
      type: string
      maxLength: 2000
      description: The ad's targeting, described.
  additionalProperties: false
TrailMarketingAsset:
  type: object
  description: One email, post or ad on a trail — drafted, approved by a person, then delivered with evidence. Every link in the body carries the trail's UTM tags once approved.
  properties:
    id:
      type: string
      description: The asset's id (a uuid). Also its `utm_content`.
    trailId:
      type: string
      description: The trail's id.
    itemId:
      anyOf:
        - type: string
        - type: "null"
      description: "The `workKind: marketing` queue item the asset belongs to, or `null`."
    kind:
      $ref: "#/TrailMarketingAssetKind"
    channel:
      $ref: "#/TrailMarketingAssetChannel"
    timing:
      type: string
      description: When the asset may go out — `before_release`, `at_release`, `at_full_rollout`, `after_goal`, or a milestone's name.
    state:
      $ref: "#/TrailMarketingAssetState"
    content:
      $ref: "#/TrailMarketingAssetContent"
    audience:
      anyOf:
        - $ref: "#/TrailMarketingAudience"
        - type: "null"
      description: Who an email goes to; `null` for posts and ads.
    approvedBy:
      anyOf:
        - type: string
        - type: "null"
      description: The person who approved it, or `null` while it has no live approval. Never an agent, key or autopilot.
    approvedAt:
      anyOf:
        - type: string
          format: date-time
        - type: "null"
      description: When it was approved.
    deliveredAt:
      anyOf:
        - type: string
          format: date-time
        - type: "null"
      description: When delivery started (email) or was recorded (hand-off).
    sentCount:
      type: integer
      minimum: 0
      description: Email recipients the message went to.
    suppressedCount:
      type: integer
      minimum: 0
      description: Email recipients skipped because they are on the suppression list.
    failedCount:
      type: integer
      minimum: 0
      description: Email recipients the send failed for.
    postUrl:
      anyOf:
        - type: string
        - type: "null"
      description: The live post's URL, recorded when a person marks a post delivered.
    campaignUrl:
      anyOf:
        - type: string
        - type: "null"
      description: The ad campaign's URL, recorded when a person marks an ad launched.
    launchedBudget:
      anyOf:
        - type: string
        - type: "null"
      description: The budget a person actually set on the ad campaign, recorded with *Mark as launched*. It can differ from the planned `content.budget`.
    deliverable:
      type: object
      description: Whether the timing gate would let the asset go out now.
      properties:
        ok:
          type: boolean
        reason:
          anyOf:
            - type: string
            - type: "null"
          description: Why not, when `ok` is false.
      required:
        - ok
        - reason
      additionalProperties: false
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
  required:
    - id
    - trailId
    - itemId
    - kind
    - channel
    - timing
    - state
    - content
    - audience
    - approvedBy
    - approvedAt
    - deliveredAt
    - sentCount
    - suppressedCount
    - failedCount
    - postUrl
    - campaignUrl
    - launchedBudget
    - deliverable
    - createdAt
    - updatedAt
  additionalProperties: false
ListTrailMarketingAssetsResponse:
  type: object
  description: A trail's marketing assets, oldest first.
  properties:
    data:
      type: array
      items:
        $ref: "#/TrailMarketingAsset"
  required:
    - data
  additionalProperties: false
CreateTrailMarketingAssetRequest:
  type: object
  description: Body for `POST /api/admin/trails/{handle}/marketing`. Creates a draft.
  properties:
    channel:
      $ref: "#/TrailMarketingAssetChannel"
    itemId:
      anyOf:
        - type: string
          minLength: 1
          maxLength: 64
        - type: "null"
      description: The trail's marketing item this asset belongs to — its number or id. Omitted, the asset belongs to the trail only.
    timing:
      type: string
      minLength: 1
      maxLength: 120
      description: When it may go out — `before_release` (the default), `at_release`, `at_full_rollout`, `after_goal`, or a milestone's name.
    content:
      $ref: "#/TrailMarketingAssetContent"
    audience:
      anyOf:
        - $ref: "#/TrailMarketingAudience"
        - type: "null"
      description: Email only — who it goes to.
  required:
    - channel
    - content
  additionalProperties: false
UpdateTrailMarketingAssetRequest:
  type: object
  description: Body for `PATCH /api/admin/trails/{handle}/marketing/{assetId}`. Any edit to an approved or scheduled asset drops its approval and sends it back to review.
  properties:
    timing:
      type: string
      minLength: 1
      maxLength: 120
      description: When it may go out.
    content:
      $ref: "#/TrailMarketingAssetContent"
    audience:
      anyOf:
        - $ref: "#/TrailMarketingAudience"
        - type: "null"
      description: Email only — who it goes to.
  additionalProperties: false
RequestTrailMarketingChangesRequest:
  type: object
  description: Body for `POST /api/admin/trails/{handle}/marketing/{assetId}/request-changes`.
  properties:
    reason:
      type: string
      minLength: 1
      maxLength: 2000
      description: What needs to change, posted on the trail's timeline.
  additionalProperties: false
MarkTrailMarketingDeliveredRequest:
  type: object
  description: Body for `POST /api/admin/trails/{handle}/marketing/{assetId}/delivered`. A post needs its `postUrl`, an ad its `campaignUrl` and the `budget` actually set.
  properties:
    postUrl:
      type: string
      format: uri
      maxLength: 2000
      description: The live post's URL.
    campaignUrl:
      type: string
      format: uri
      maxLength: 2000
      description: The ad campaign's URL.
    budget:
      type: string
      minLength: 1
      maxLength: 100
      description: 'The budget actually set on the launched campaign, as the platform shows it (e.g. `$500 total` or `$40/day`). Required for an ad.'
  additionalProperties: false
TrailMarketingPreview:
  type: object
  description: What an asset will look like when it goes out, with its UTM-tagged links, and for an email who it reaches after the suppression list and the daily cap.
  properties:
    asset:
      $ref: "#/TrailMarketingAsset"
    subject:
      anyOf:
        - type: string
        - type: "null"
      description: Email subject.
    html:
      anyOf:
        - type: string
        - type: "null"
      description: Email HTML with every link tagged.
    text:
      anyOf:
        - type: string
        - type: "null"
      description: Email text, or the post's body, with every link tagged.
    links:
      type: array
      items:
        type: string
      description: Every tagged link in the asset, in order.
    recipients:
      anyOf:
        - type: object
          properties:
            audience:
              type: integer
              minimum: 0
              description: Unique addresses the audience names.
            suppressed:
              type: integer
              minimum: 0
              description: Of those, on the suppression list.
            remainingToday:
              type: integer
              minimum: 0
              description: Marketing emails the project may still send today (UTC).
            cap:
              type: integer
              minimum: 0
              description: The project's daily marketing email cap.
            willSend:
              type: integer
              minimum: 0
              description: Recipients a send now would reach — the audience minus suppressions, bounded by what is left today.
          required:
            - audience
            - suppressed
            - remainingToday
            - cap
            - willSend
          additionalProperties: false
        - type: "null"
      description: Email only — the recipient count. `null` for posts and ads.
  required:
    - asset
    - subject
    - html
    - text
    - links
    - recipients
  additionalProperties: false
MarketingList:
  type: object
  description: An uploaded or pasted contact list. Selectable as an email audience only while it carries a consent attestation and is not archived.
  properties:
    id:
      type: string
      description: The list's id (a uuid).
    name:
      type: string
      description: The list's name.
    contactCount:
      type: integer
      minimum: 0
      description: Addresses on the list.
    attestedBy:
      anyOf:
        - type: string
        - type: "null"
      description: Who attested that every address on the list consented to marketing email.
    attestedAt:
      anyOf:
        - type: string
          format: date-time
        - type: "null"
      description: When they attested it.
    attestationText:
      anyOf:
        - type: string
        - type: "null"
      description: The statement they attested to.
    archivedAt:
      anyOf:
        - type: string
          format: date-time
        - type: "null"
      description: When the list was archived, or `null`.
    createdAt:
      type: string
      format: date-time
  required:
    - id
    - name
    - contactCount
    - attestedBy
    - attestedAt
    - attestationText
    - archivedAt
    - createdAt
  additionalProperties: false
ListMarketingListsResponse:
  type: object
  description: The project's contact lists, newest first.
  properties:
    data:
      type: array
      items:
        $ref: "#/MarketingList"
  required:
    - data
  additionalProperties: false
CreateMarketingListRequest:
  type: object
  description: Body for `POST /api/admin/marketing-lists`. Pass the addresses as `csv` (a CSV with an `email` column, or one address per line) or as `contacts`. The consent attestation is required.
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 120
      pattern: ^\S(.*\S)?$
      description: The list's name.
    csv:
      type: string
      minLength: 1
      maxLength: 2000000
      description: A CSV upload or a pasted block of addresses.
    contacts:
      type: array
      minItems: 1
      maxItems: 10000
      items:
        type: object
        properties:
          email:
            type: string
            minLength: 3
            maxLength: 320
          name:
            anyOf:
              - type: string
                maxLength: 200
              - type: "null"
        required:
          - email
        additionalProperties: false
      description: The addresses, already split.
    attestation:
      type: object
      description: The uploader's statement that every address consented to marketing email from this project.
      properties:
        statement:
          type: string
          minLength: 20
          maxLength: 2000
          description: The statement, as the uploader read it.
        accepted:
          type: boolean
          enum:
            - true
          description: Must be `true`.
      required:
        - statement
        - accepted
      additionalProperties: false
  required:
    - name
    - attestation
  additionalProperties: false
CreateMarketingListResponse:
  type: object
  description: The new list, and what the upload skipped.
  properties:
    list:
      $ref: "#/MarketingList"
    invalid:
      type: array
      items:
        type: object
        properties:
          line:
            type: integer
            minimum: 1
          value:
            type: string
        required:
          - line
          - value
        additionalProperties: false
      description: Lines that held no valid address.
    duplicates:
      type: integer
      minimum: 0
      description: Addresses that appeared more than once and were kept once.
  required:
    - list
    - invalid
    - duplicates
  additionalProperties: false
