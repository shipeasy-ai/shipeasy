        - copilot
        - jules
      description: The agent type asking — pass your own type when you are a coding agent. Omitted, the question is attributed to the caller's identity.
  required:
    - question
  additionalProperties: false
  description: "Body for `POST /api/admin/ops/{handle}/qa-questions`."
AnswerOpsQaQuestionRequest:
  type: object
  properties:
    answer:
      type: string
      minLength: 1
      maxLength: 10000
      description: QA's answer (markdown).
    agent:
      type: string
      enum:
        - jarvis
        - claude
        - cursor
        - copilot
        - jules
      description: The agent type answering — pass your own type when you are QA automation. Omitted, the answer is attributed to the caller's identity.
  required:
    - answer
  additionalProperties: false
  description: "Body for `POST /api/admin/ops/{handle}/qa-questions/{questionId}/answer`."
ListOpsQaQuestionsResponse:
  type: array
  items:
    $ref: "#/OpsQaQuestion"
  description: Response for `GET /api/admin/ops/{handle}/qa-questions` — the item's QA questions, newest first (max 100).
NotificationFeedItem:
  type: object
  properties:
    id:
      type: string
      description: Notification id (pass to the mark-read `POST` to mark just this one).
    event:
      type: string
      description: The notification's event key (e.g. `ops.attention`, `feedback.completed`, `comment.mention`).
    title:
      type: string
      description: One-line headline.
    body:
      type: string
      description: "Notification body. For `ops.attention` escalations: line 1 = summary, following lines = numbered unblock steps."
    href:
      anyOf:
        - type: string
        - type: "null"
      description: Dashboard-relative deep link to the related item, or `null`.
    createdAt:
      type: string
      description: ISO-8601 creation timestamp.
    read:
      type: boolean
      description: Whether the notification has been marked read.
  required:
    - id
    - event
    - title
    - body
    - href
    - createdAt
    - read
  additionalProperties: false
  description: One in-app notification as the bell feed renders it.
ListNotificationFeedResponse:
  type: object
  properties:
    notifications:
      type: array
      items:
        $ref: "#/NotificationFeedItem"
      description: The feed, newest first (max 30). Project-wide broadcasts plus notifications addressed to the caller; events muted for the in-app channel are omitted.
    unread:
      type: integer
      description: Count of the caller's unread (visible, unmuted) notifications.
  required:
    - notifications
    - unread
  additionalProperties: false
  description: Response for `GET /api/admin/notifications/feed` — the bell feed plus its unread badge count.
MarkNotificationsReadRequest:
  type: object
  properties:
    id:
      type: string
      description: Mark just this notification read. Omit to mark the caller's whole feed read.
  additionalProperties: false
  description: "Body for `POST /api/admin/notifications/feed`. An empty body (`{}`) marks ALL of the caller's notifications read."
OpsRoutingRuleType:
  type: string
  enum:
    - error
    - alert
    - bug
    - feature_request
  description: A ticket type a tag rule can also fire on. Error and alert tickets carry no tags, so a rule that should catch them matches on type.
OpsRoutingRule:
  type: object
  description: >-
    One tag automation rule. A rule fires on a newly filed queue item that
    carries ANY of its `tags` (or whose `type` is in `types`) and applies its
    actions — assign a person, hand the item to a connected coding agent
    (which launches a run), set a status or priority, and subscribe emails.
    Rules are evaluated in order; each action is optional but a rule needs at
    least one.
  properties:
    tags:
      type: array
      items:
        type: string
        minLength: 1
        maxLength: 64
      maxItems: 20
      description: Tag names the rule matches (case-insensitive). Tags are created on first use.
    types:
      type: array
      items:
        $ref: "#/OpsRoutingRuleType"
      maxItems: 4
      description: Ticket types the rule also fires on. A rule needs at least one tag or type.
    enabled:
      type: boolean
      description: Whether the rule is live. Defaults to `true` on create.
    user:
      anyOf:
        - type: string
          minLength: 1
          maxLength: 128
        - type: "null"
      description: Person to assign — a user id. `null` leaves the owner alone.
    connector:
      anyOf:
        - type: string
          minLength: 1
          maxLength: 128
        - type: "null"
      description: Connected coding agent to hand the item to — a connector id from `ops agents list`. Launches a run when the rule fires.
    agentPrompt:
      anyOf:
        - type: string
          maxLength: 4000
        - type: "null"
      description: Steering prompt for the launched agent. Only kept alongside a `connector`.
    status:
      anyOf:
        - $ref: "#/OpsItemStatus"
        - type: "null"
      description: Status to set on a matching item.
    priority:
      $ref: "#/OpsItemPriorityOrNull"
    subscribers:
      type: array
      items:
        type: string
        format: email
      maxItems: 20
      description: Emails notified about matching items.
    skipApproval:
      type: boolean
      description: A public-intake ticket this rule matches skips `pending_approval` and runs the rule on filing, instead of waiting for a human to approve it.
    triage:
      type: boolean
      description: While a matching public-intake ticket waits in `pending_approval`, the rule's agent safety-triages it and tags it from the central triage set. Needs a `connector`; always `false` alongside `skipApproval`.
    triageAgent:
      anyOf:
        - type: string
        - type: "null"
      description: Who does the triage — `null` means the rule's own `connector`, `jarvis` (Enterprise), or a connector id. Only meaningful with `triage`.
    triageAutoApprove:
      type: boolean
      description: With `triage`, approve the ticket automatically when the agent tags it safe and nothing else. Off means a human still approves.
  required:
    - tags
    - types
    - enabled
    - user
    - connector
    - agentPrompt
    - status
    - priority
    - subscribers
    - skipApproval
    - triage
    - triageAgent
    - triageAutoApprove
  additionalProperties: false
ListOpsRoutingRulesResponse:
  type: array
  items:
    $ref: "#/OpsRoutingRule"
CreateOpsRoutingRuleRequest:
  type: object
  description: >-
    Appends one tag automation rule after the existing ones; the existing rules
    are untouched. Needs at least one of `tags` / `types` and at least one
    action (`user`, `connector`, `status`, `priority` or `subscribers`).
  properties:
    tags:
      type: array
      items:
        type: string
        minLength: 1
        maxLength: 64
      maxItems: 20
      description: Tag names the rule matches (case-insensitive). Tags are created on first use.
    types:
      type: array
      items:
        $ref: "#/OpsRoutingRuleType"
      maxItems: 4
      description: Ticket types the rule also fires on.
    enabled:
      type: boolean
      description: Whether the rule is live. Defaults to `true`.
    user:
      type: string
      minLength: 1
      maxLength: 128
      description: Person to assign — a user id.
    connector:
      type: string
      minLength: 1
      maxLength: 128
      description: Connected coding agent to hand the item to — a connector id from `ops agents list`.
    agentPrompt:
      type: string
      maxLength: 4000
      description: Steering prompt for the launched agent. Only kept alongside a `connector`.
    status:
      $ref: "#/OpsItemStatus"
    priority:
      $ref: "#/OpsItemPriority"
    subscribers:
      type: array
      items:
        type: string
        format: email
      maxItems: 20
      description: Emails notified about matching items.
    skipApproval:
      type: boolean
      description: Let a matching public-intake ticket skip `pending_approval`. Defaults to `false`.
  additionalProperties: false
OpsMemoryKind:
  type: string
  enum:
    - shipped
    - declined
    - decision
    - qa
  description: >-
    What a project-memory entry records. `shipped` — an item that reached
    `ready_for_qa`/`resolved`: what was asked, what the run found, the files it
    touched, the PR. `declined` — an item closed `wont_fix`: the request and
    why it was turned down. `decision` — an answered structured question: what
    the team picked. `qa` — a QA note or an answered QA question: what "fixed"
    turned out to mean, or what QA found failing.
OpsMemoryEntry:
  type: object
  properties:
    id:
      type: string
      description: Memory entry id.
    kind:
      $ref: "#/OpsMemoryKind"
    title:
      type: string
      description: One-line headline of the fact.
    body:
      type: string
      description: Compact markdown — the fact itself, capped so a read stays token-light. `ops get` on the item has the full record.
    paths:
      type: array
      items:
        type: string
      description: Repo-relative files the item's runs inspected or changed.
    prUrl:
      anyOf:
        - type: string
        - type: "null"
      description: The pull request that shipped it, when one was linked.
    item:
      $ref: "#/OpsItemRef"
    occurredAt:
      type: string
      description: ISO-8601 time the fact happened (shipped, answered, noted).
    score:
      type: number
      description: Relevance to the query (higher is closer). `0` when the read had no query — entries are then newest first.
  required:
    - id
    - kind
    - title
    - body
    - paths
    - prUrl
    - item
    - occurredAt
    - score
  additionalProperties: false
  description: One fact the project learned from a shipped (or declined) ticket.
ListOpsMemoryResponse:
  type: object
  properties:
    entries:
      type: array
      items:
        $ref: "#/OpsMemoryEntry"
      description: Matching entries, most relevant first.
    terms:
      type: array
      items:
        type: string
      description: The search terms the query was reduced to (stop-words and short words dropped). Empty when no `q` or `item` was given.
  required:
    - entries
    - terms
  additionalProperties: false
  description: Response for `GET /api/admin/ops/memory`.
TrailAgentValueType:
  type: string
  enum:
    - score
    - boolean
  description: "How a review agent's value reads — a `score` from 0 to 100, or a `boolean` signal submitted as 1 (yes) or 0 (no)."
TrailAgentPolarity:
  type: string
  enum:
    - higher_is_better
    - lower_is_better
  description: "Which direction is good. Confidence is `higher_is_better`; risk is `lower_is_better`. For a `boolean` agent, `lower_is_better` means a 1 (yes, an issue was found) fails."
TrailAgentTrigger:
  type: string
  enum:
    - push
    - manual
  description: "When a review agent runs — on every `push` to a trail's linked pull request, or only when a review is requested (`manual`)."
TrailEvalStatus:
  type: string
  enum:
    - pending
    - complete
    - failed
  description: "Where one eval stands — `pending` (its agent was launched and has not submitted), `complete`, or `failed` (the launch did not go through)."
TrailEvalVerdict:
  type: string
  enum:
    - pass
    - warn
    - fail
  description: "An eval's value against its agent's threshold — `pass` (green), `warn` (orange: passing, but within 10 points of the threshold), `fail` (red)."
TrailFindingSeverity:
  type: string
  enum:
    - high
    - medium
    - low
  description: How much a finding matters. The Agent review gate blocks on open findings at or above its configured severity.
TrailFindingStatus:
  type: string
  enum:
    - open
    - resolved
    - dismissed
  description: "A finding stays `open` until it is `resolved` (fixed) or `dismissed` (not a problem). A finding raised on an earlier push is reported `stale` but stays open until somebody decides."
TrailPhase:
  type: string
  enum:
    - planning
    - building
    - reviewing
    - ready
    - releasing
    - shipped
    - closed
  description: "Where a trail is, derived from its changes and its release resources — `planning` (no change and no open run), `building` (no change yet, a run is working), `reviewing` (a change is open and not every open change can merge), `ready` (every open change can merge), `releasing` (merged, and a flag, experiment or other release resource has not settled), `shipped` (merged and every release resource settled), `closed` (closed with nothing merged). The detail read recomputes it live; the list reads a snapshot."
TrailGateKey:
  type: string
  enum:
    - up_to_date
    - human_review
    - agent_review
    - evals
    - checks
    - discovered
    - ships_dark
    - rollback
    - measured
    - guarded
    - copy
    - plan
  description: "A merge gate — `plan` (every release resource the approved plan lists exists on the trail), `up_to_date` (the branch is current with its base), `human_review` (enough approvals), `agent_review` (no open findings at or above the severity, and no push agent still reviewing), `evals` (every blocking review agent passes on the latest push), `checks` (CI checks pass), `discovered` (no item discovered on the trail is open at or above the configured priority), and the release gates `ships_dark` (every flag the trail ships behind is off in prod), `rollback` (a feature has a rollback kill switch), `measured` (a feature has an experiment or metric), `guarded` (every measured resource has a guard alert rule) and `copy` (every copy key exists in every published locale)."
TrailGateStatus:
  type: string
  enum:
    - pass
    - pending
    - fail
  description: How a gate reads on a change right now.
TrailGateToggle:
  type: object
  properties:
    enabled:
      type: boolean
      description: Whether the gate is evaluated at all.
    blocking:
      type: boolean
      description: Whether a failing gate blocks the merge (a non-blocking gate only reports).
  required:
    - enabled
    - blocking
  additionalProperties: false
TrailGates:
  type: object
  description: A project's merge and release gates for trails. Every project starts on the defaults shown in the example; the release gates, `discovered` and the per-repo overrides are all off until turned on. Send the whole object — fields you omit take their defaults.
  properties:
    upToDate:
      $ref: "#/TrailGateToggle"
    humanReview:
      type: object
      properties:
        enabled:
          type: boolean
        blocking:
          type: boolean
        minApprovals:
          type: integer
          minimum: 1
          maximum: 10
          description: Approvals a change needs.
        resetOnPush:
          type: boolean
          description: Whether a new push clears earlier approvals, so the latest code is what gets approved.
        authorCanApprove:
          type: boolean
          default: false
          description: Whether the trail's owner, and whoever started its runs, count as approvers. Off by default, so the author of a change is never its own reviewer.
      required:
        - enabled
        - blocking
        - minApprovals
        - resetOnPush
      additionalProperties: false
    agentReview:
      type: object
      properties:
        enabled:
          type: boolean
        blocking:
          type: boolean
        severity:
          $ref: "#/TrailFindingSeverity"
      required:
        - enabled
        - blocking
        - severity
      additionalProperties: false
    evals:
      $ref: "#/TrailGateToggle"
    checks:
      type: object
      properties:
        enabled:
          type: boolean
        blocking:
          type: boolean
        required:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 200
          maxItems: 50
          description: Check names that must pass. Empty means every reported check.
      required:
        - enabled
        - blocking
        - required
      additionalProperties: false
    discovered:
      type: object
      description: "Passes when no item discovered on the trail is open at or above `priority`. Off by default; turn it on to say \"a high bug found while building this blocks shipping it\"."
      properties:
        enabled:
          type: boolean
          default: false
        blocking:
          type: boolean
          default: false
        priority:
          $ref: "#/OpsItemPriority"
      required:
        - enabled
        - blocking
        - priority
      additionalProperties: false
    shipsDark:
      type: object
      description: Release gate. Passes when every flag the trail ships behind exists and is not at 100% in prod, so new code merges off. Off by default.
      properties:
        enabled:
          type: boolean
          default: false
          description: Whether the gate is evaluated at all.
        blocking:
          type: boolean
          default: false
          description: Whether a failing gate blocks the merge (a non-blocking gate only reports).
      required:
        - enabled
        - blocking
      additionalProperties: false
      default:
        enabled: false
        blocking: false
    rollback:
      type: object
      description: Release gate. For a `feature` trail, passes when a rollback kill switch exists. Off by default.
      properties:
        enabled:
          type: boolean
          default: false
          description: Whether the gate is evaluated at all.
        blocking:
          type: boolean
          default: false
          description: Whether a failing gate blocks the merge (a non-blocking gate only reports).
      required:
        - enabled
        - blocking
      additionalProperties: false
      default:
        enabled: false
        blocking: false
    measured:
      type: object
      description: Release gate. For a `feature` trail, passes when a measuring experiment or metric exists. Off by default.
      properties:
        enabled:
          type: boolean
          default: false
          description: Whether the gate is evaluated at all.
        blocking:
          type: boolean
          default: false
          description: Whether a failing gate blocks the merge (a non-blocking gate only reports).
      required:
        - enabled
        - blocking
      additionalProperties: false
      default:
        enabled: false
        blocking: false
    guarded:
      type: object
      description: Release gate. Passes when every measured resource has at least one guarding alert rule. Off by default.
      properties:
        enabled:
          type: boolean
          default: false
          description: Whether the gate is evaluated at all.
        blocking:
          type: boolean
          default: false
          description: Whether a failing gate blocks the merge (a non-blocking gate only reports).
      required:
        - enabled
        - blocking
      additionalProperties: false
      default:
        enabled: false
        blocking: false
    copy:
      type: object
      description: Release gate. Passes when every copy i18n key exists in every published locale of its profile. Off by default.
      properties:
        enabled:
          type: boolean
          default: false
          description: Whether the gate is evaluated at all.
        blocking:
          type: boolean
          default: false
          description: Whether a failing gate blocks the merge (a non-blocking gate only reports).
      required:
        - enabled
        - blocking
      additionalProperties: false
      default:
        enabled: false
        blocking: false
    plan:
      type: object
      description: Gate. Passes when every release resource the trail's approved plan lists exists on the trail (a flag, kill switch or experiment the person chose while the plan was made). Reads `pending` while a drafted plan waits for approval, and is left out when the trail has no plan. On by default; it blocks the merge only while `requirePlan` is on.
      properties:
        enabled:
          type: boolean
          default: true
          description: Whether the gate is evaluated at all.
        blocking:
          type: boolean
          default: true
          description: Whether a failing gate blocks the merge. Ignored while `requirePlan` is off, when the gate only reports.
      required:
        - enabled
        - blocking
      additionalProperties: false
      default:
        enabled: true
        blocking: true
    requirePlan:
      type: boolean
      default: true
      description: Whether starting an agent on a trail with no approved plan fires a read-only plan run first. The plan run asks the person how the trail should ship and anything else that is open, and the build run follows the plan they approve. Off, starting an agent builds directly and creates no flag, kill switch or experiment on its own.
    fixRounds:
      type: integer
      minimum: 0
      maximum: 10
      default: 3
      description: How many times the server re-fires the coding agent with a fix prompt after a change's evals or findings fail. After the cap the trail reads `reviewing`, needs a person. `0` turns the loop off.
    attributionWindowHours:
      type: integer
      minimum: 1
      maximum: 720
      default: 72
      description: How long after a trail merged an error or alert ticket may be attributed to it. Trails merged inside the window are offered to the investigating agent as candidates.
    rollout:
      $ref: "#/TrailRollout"
    repos:
      type: object
      maxProperties: 100
      additionalProperties:
        $ref: "#/TrailRepoOverride"
      description: Per-repo overrides keyed by `owner/repo`. An override replaces the project's `checks.required` for changes in that repo; every other gate stays project-wide.
  required:
    - upToDate
    - humanReview
    - agentReview
    - evals
    - checks
  additionalProperties: false
TrailRepoOverride:
  type: object
  description: A repo's partial override of the project's trail gates.
  properties:
    checks:
      type: object
      properties:
        required:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 200
          maxItems: 50
          description: Check names that must pass in this repo. Empty means every reported check.
      required:
        - required
      additionalProperties: false
  additionalProperties: false
TrailAgent:
  type: object
  description: A review agent — an eval that scores every push to a trail's changes, run by one of the project's coding-agent triggers.
  properties:
    id:
      type: string
      description: Agent id.
    key:
      type: string
      description: The slug its evals are submitted under (`risk`, `security`, …).
    name:
      type: string
    description:
      anyOf:
        - type: string
        - type: "null"
    instructions:
      type: string
      description: What the agent reviews and how it scores — the prompt its review run receives.
    valueType:
      $ref: "#/TrailAgentValueType"
    polarity:
      $ref: "#/TrailAgentPolarity"
    threshold:
      type: integer
      description: The passing bound — a `higher_is_better` score passes at or above it, a `lower_is_better` one at or below it. Ignored for `boolean` agents.
    blocking:
      type: boolean
      description: Whether a failing eval blocks the merge (through the Evals gate).
    trigger:
      $ref: "#/TrailAgentTrigger"
    connectorId:
      anyOf:
        - type: string
        - type: "null"
      description: The coding-agent trigger that runs it, or `null` for the project's first connected trigger.
    preset:
      anyOf:
        - type: string
        - type: "null"
      description: The preset it was added from.
    enabled:
      type: boolean
    createdAt:
      type: string
    updatedAt:
      type: string
  required:
    - id
    - key
    - name
    - description
    - instructions
    - valueType
    - polarity
    - threshold
    - blocking
    - trigger
    - connectorId
    - preset
    - enabled
    - createdAt
    - updatedAt
TrailAgentPreset:
  type: object
  description: A ready-made review agent a project can add in one call.
  properties:
    preset:
      type: string
    key:
      type: string
    name:
      type: string
    description:
      type: string
    valueType:
      $ref: "#/TrailAgentValueType"
    polarity:
      $ref: "#/TrailAgentPolarity"
    threshold:
      type: integer
    blocking:
      type: boolean
  required:
    - preset
    - key
    - name
    - description
    - valueType
    - polarity
    - threshold
    - blocking
ListTrailAgentsResponse:
  type: object
  properties:
    agents:
      type: array
      items:
        $ref: "#/TrailAgent"
      description: The project's review agents (archived ones excluded).
    presets:
      type: array
      items:
        $ref: "#/TrailAgentPreset"
      description: Presets that can be added with `create --preset <preset>`.
  required:
    - agents
    - presets
CreateTrailAgentRequest:
  type: object
  description: "Add a review agent. Pass `preset` to add a ready-made one (every other field then overrides the preset), or `key`, `name` and `instructions` for a custom agent."
  properties:
    preset:
      type: string
      maxLength: 64
      description: A preset id from `ops review-agents list` (e.g. `code-review`, `security`, `risk`, `confidence`, `slop`).
    key:
      type: string
      pattern: "^[a-z0-9][a-z0-9-]{0,47}$"
      description: Slug the agent's evals are submitted under — lowercase letters, digits and dashes.
    name:
      type: string
      minLength: 1
      maxLength: 80
    description:
      type: string
      maxLength: 500
    instructions:
      type: string
      minLength: 1
      maxLength: 8000
      description: What to review and how to score it.
    valueType:
      $ref: "#/TrailAgentValueType"
    polarity:
      $ref: "#/TrailAgentPolarity"
    threshold:
      type: integer
      minimum: 0
      maximum: 100
    blocking:
      type: boolean
    trigger:
      $ref: "#/TrailAgentTrigger"
    connectorId:
      type: string
      minLength: 1
      maxLength: 128
      description: The coding-agent trigger that runs it — a connector id from `ops agents list`. Omitted, the project's first connected trigger runs it.
    enabled:
      type: boolean
  additionalProperties: false
UpdateTrailAgentRequest:
  type: object
  description: Change a review agent. Only the fields sent change; its `key` is fixed.
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 80
    description:
      anyOf:
        - type: string
          maxLength: 500
        - type: "null"
    instructions:
      type: string
      minLength: 1
      maxLength: 8000
    valueType:
      $ref: "#/TrailAgentValueType"
    polarity:
      $ref: "#/TrailAgentPolarity"
    threshold:
      type: integer
      minimum: 0
      maximum: 100
    blocking:
      type: boolean
    trigger:
      $ref: "#/TrailAgentTrigger"
    connectorId:
      anyOf:
        - type: string
          minLength: 1
          maxLength: 128
        - type: "null"
    enabled:
      type: boolean
  additionalProperties: false
TrailEval:
  type: object
  description: One review agent's result on one push.
  properties:
    id:
      type: string
    agentKey:
      type: string
    headSha:
      type: string
      description: The push it scored.
    status:
      $ref: "#/TrailEvalStatus"
    value:
      anyOf:
        - type: number
        - type: "null"
      description: 0–100 for a score, 1/0 for a boolean; `null` until submitted.
    verdict:
      anyOf:
        - $ref: "#/TrailEvalVerdict"
        - type: "null"
    rationale:
      anyOf:
        - type: string
        - type: "null"
    reviewer:
      anyOf:
        - type: string
        - type: "null"
      description: The agent type that submitted it, or the submitting person's email.
    sessionUrl:
      anyOf:
        - type: string
        - type: "null"
      description: Deep link to the review session, when the provider gave one.
    error:
      anyOf:
        - type: string
        - type: "null"
      description: Why the launch failed (`failed` only).
    createdAt:
      type: string
    completedAt:
      anyOf:
        - type: string
        - type: "null"
  required:
    - id
    - agentKey
    - headSha
    - status
    - value
    - verdict
    - rationale
    - reviewer
    - sessionUrl
    - error
    - createdAt
    - completedAt
TrailEvalSeries:
  type: object
  description: One review agent on one change — its result on the latest push next to its last five earlier ones, so you can see whether the loop has stabilised.
  properties:
    agentKey:
      type: string
    name:
      type: string
    valueType:
      $ref: "#/TrailAgentValueType"
    polarity:
      $ref: "#/TrailAgentPolarity"
    threshold:
      type: integer
    blocking:
      type: boolean
    current:
      anyOf:
        - $ref: "#/TrailEval"
        - type: "null"
      description: Its eval on the latest push, or `null` when it has not run there.
    history:
      type: array
      items:
        $ref: "#/TrailEval"
      description: Its evals on earlier pushes, newest first (at most 5).
  required:
    - agentKey
    - name
    - valueType
    - polarity
    - threshold
    - blocking
    - current
    - history
TrailFinding:
  type: object
  description: One issue flagged on a change.
  properties:
    id:
      type: string
    agentKey:
      anyOf:
        - type: string
        - type: "null"
      description: The review agent that raised it.
    headSha:
      type: string
      description: The push it was raised on.
    severity:
      $ref: "#/TrailFindingSeverity"
    title:
      type: string
    body:
      anyOf:
        - type: string
        - type: "null"
    path:
      anyOf:
        - type: string
        - type: "null"
    line:
      anyOf:
        - type: integer
        - type: "null"
    suggestion:
      anyOf:
        - type: string
        - type: "null"
      description: Suggested replacement for the flagged lines.
    status:
      $ref: "#/TrailFindingStatus"
    stale:
      type: boolean
      description: True when the change has been pushed to since the finding was raised. Stale findings stay open until resolved or dismissed.
    statusReason:
      anyOf:
        - type: string
        - type: "null"
    statusBy:
      anyOf:
        - type: string
        - type: "null"
    promotedItem:
      anyOf:
        - $ref: "#/OpsItemRef"
        - type: "null"
      description: The queue item this finding was promoted into (the finding is then dismissed as `moved to #N`), or `null`.
    createdAt:
      type: string
    updatedAt:
      type: string
  required:
    - id
    - agentKey
    - headSha
    - severity
    - title
    - body
    - path
    - line
    - suggestion
    - status
    - stale
    - statusReason
    - statusBy
    - promotedItem
    - createdAt
    - updatedAt
TrailPush:
  type: object
  properties:
    id:
      type: string
    headSha:
      type: string
    baseSha:
      anyOf:
        - type: string
        - type: "null"
    headRef:
      anyOf:
        - type: string
        - type: "null"
    baseRef:
      anyOf:
        - type: string
        - type: "null"
    actor:
      anyOf:
        - type: string
        - type: "null"
      description: GitHub login that pushed.
    source:
      type: string
      enum:
        - webhook
        - link
        - observed
      description: How the push was learned about — the GitHub webhook, linking the PR, or reading the PR's head.
    createdAt:
      type: string
  required:
    - id
    - headSha
    - baseSha
    - headRef
    - baseRef
    - actor
    - source
    - createdAt
TrailApproval:
  type: object
  properties:
    id:
      type: string
    actorEmail:
      type: string
    body:
      anyOf:
        - type: string
        - type: "null"
    headSha:
      type: string
      description: The push that was approved.
    current:
      type: boolean
      description: True when it approved the latest push.
    createdAt:
      type: string
  required:
    - id
    - actorEmail
    - body
    - headSha
    - current
    - createdAt
TrailCheckRun:
  type: object
  properties:
    name:
      type: string
    status:
      type: string
      enum:
        - success
        - pending
        - failure
        - neutral
    url:
      anyOf:
        - type: string
        - type: "null"
  required:
    - name
    - status
    - url
TrailGate:
  type: object
  properties:
    key:
      $ref: "#/TrailGateKey"
    label:
      type: string
    status:
      $ref: "#/TrailGateStatus"
    blocking:
      type: boolean
    detail:
      type: string
      description: One line on what the gate saw, e.g. `1 of 1 approvals`.
  required:
    - key
    - label
    - status
    - blocking
    - detail
TrailChange:
  type: object
  description: One pull request worked under a trail, with everything needed to decide whether it can merge.
  properties:
    id:
      type: string
      description: The change's id.
    item:
      anyOf:
        - $ref: "#/OpsItemRef"
        - type: "null"
      description: The queue item whose run opened this change, or `null` when a trail run (or a person) did.
    mergedAt:
      anyOf:
        - type: string
        - type: "null"
      description: ISO-8601 time the pull request merged, or `null` while it has not.
    mergeSha:
      anyOf:
        - type: string
        - type: "null"
      description: The merge commit, or `null` while the change has not merged.
    changedFiles:
      anyOf:
        - type: array
          items:
            type: string
        - type: "null"
      description: Paths the change touched, captured at merge for post-merge attribution. `null` unless the change has merged and the read asked for `files`.
    prUrl:
      type: string
    prNumber:
      type: integer
    repo:
      anyOf:
        - type: string
        - type: "null"
      description: "`owner/repo`."
    title:
      anyOf:
        - type: string
        - type: "null"
    state:
      type: string
      enum:
        - open
        - draft
        - merged
        - closed
        - unknown
      description: The PR's state; `unknown` when GitHub could not be read.
    headRef:
      anyOf:
        - type: string
        - type: "null"
    baseRef:
      anyOf:
        - type: string
        - type: "null"
    headSha:
      anyOf:
        - type: string
        - type: "null"
      description: The latest push — what evals, findings and approvals are measured against.
    mergeable:
      type: boolean
      description: True when every blocking gate passes and the PR is open.
    gates:
      type: array
      items:
        $ref: "#/TrailGate"
    checks:
      type: array
      items:
        $ref: "#/TrailCheckRun"
    evals:
      type: array
      items:
        $ref: "#/TrailEvalSeries"
    findings:
      type: array
      items:
        $ref: "#/TrailFinding"
      description: Every finding on the change — open ones first, worst first.
    approvals:
      type: array
      items:
        $ref: "#/TrailApproval"
    pushes:
      type: array
      items:
        $ref: "#/TrailPush"
      description: Pushes, newest first.
  required:
    - id
    - item
    - mergedAt
    - mergeSha
    - changedFiles
    - prUrl
    - prNumber
    - repo
    - title
    - state
    - headRef
    - baseRef
    - headSha
    - mergeable
    - gates
    - checks
    - evals
    - findings
    - approvals
    - pushes
NewTrailFinding:
  type: object
  properties:
    severity:
      $ref: "#/TrailFindingSeverity"
    title:
      type: string
      minLength: 1
      maxLength: 200
    body:
      type: string
      maxLength: 4000
    path:
      type: string
      maxLength: 500
    line:
      type: integer
      minimum: 1
    suggestion:
      type: string
      maxLength: 4000
  required:
    - severity
    - title
  additionalProperties: false
SubmitOpsTrailEvalRequest:
  type: object
  description: "One review agent's result on one push. Re-submitting for the same push replaces the earlier result and its findings."
  properties:
    agentKey:
      type: string
      minLength: 1
      maxLength: 48
      description: The review agent's key (from `ops review-agents list`).
    value:
      type: number
      minimum: 0
      maximum: 100
      description: 0–100 for a score agent; 1 (yes) or 0 (no) for a boolean one.
    rationale:
      type: string
      minLength: 1
      maxLength: 4000
      description: One or two sentences on the evidence behind the value.
    findings:
      type: array
      items:
        $ref: "#/NewTrailFinding"
      maxItems: 50
      description: Issues to fix, each with a severity, and a file and line when there is one.
    prUrl:
      type: string
      maxLength: 500
      description: The change reviewed. Omitted, the trail's primary change.
    headSha:
      type: string
      minLength: 7
      maxLength: 64
      description: The commit reviewed. Omitted, the change's latest push. A sha that is not the latest push is recorded against that push, as history.
    agent:
      type: string
      enum:
        - jarvis
        - claude
        - cursor
        - copilot
        - jules
      description: Your agent type, when you are the review agent.
    sessionId:
      type: string
      maxLength: 300
      description: Your session id, so the eval can deep-link to the review run.
    resources:
      type: array
      maxItems: 50
      items:
        $ref: "#/NewTrailResource"
      description: Product resources the reviewed diff uses (`getFlag("x")`, `getExperiment("y")`, `t("key")`). They are linked to the trail as detected. A key that does not exist yet becomes a finding.
  required:
    - agentKey
    - value
    - rationale
  additionalProperties: false
SubmitOpsTrailEvalResponse:
  type: object
  properties:
    eval:
      $ref: "#/TrailEval"
    findings:
      type: array
      items:
        $ref: "#/TrailFinding"
  required:
    - eval
    - findings
UpdateOpsTrailFindingRequest:
  type: object
  properties:
    status:
      $ref: "#/TrailFindingStatus"
    reason:
      type: string
      maxLength: 2000
      description: Why — the fixing commit, or why it is not a problem.
    agent:
      type: string
      enum:
        - jarvis
        - claude
        - cursor
        - copilot
        - jules
      description: Your agent type, when an agent is resolving the finding.
  required:
    - status
  additionalProperties: false
ApproveOpsTrailRequest:
  type: object
  properties:
    prUrl:
      type: string
      maxLength: 500
      description: The change to approve. Omitted, the trail's primary change.
    body:
      type: string
      maxLength: 4000
      description: An optional review note.
  additionalProperties: false
RequestOpsTrailReviewRequest:
  type: object
  properties:
    prUrl:
      type: string
      maxLength: 500
      description: The change to review. Omitted, the trail's primary change.
    agentKeys:
      type: array
      items:
        type: string
        minLength: 1
        maxLength: 48
      maxItems: 20
      description: Which review agents to run. Omitted, every enabled one.
  additionalProperties: false
RequestOpsTrailReviewResponse:
  type: object
  properties:
    prUrl:
      type: string
    headSha:
      type: string
    launched:
      type: array
      items:
        type: object
        properties:
          agentKey:
            type: string
          status:
            $ref: "#/TrailEvalStatus"
          error:
            anyOf:
              - type: string
              - type: "null"
        required:
          - agentKey
          - status
          - error
  required:
    - prUrl
    - headSha
    - launched
MergeOpsTrailRequest:
  type: object
  properties:
    prUrl:
      type: string
      maxLength: 500
      description: The change to merge. Omitted, the trail's primary change.
    method:
      type: string
      enum:
        - squash
        - merge
        - rebase
      description: GitHub merge method. Defaults to `squash`.
    bypass:
      type: boolean
      description: Merge although a blocking gate has not passed. Needs the bypass capability, and is recorded on the trail with `reason`.
    reason:
      type: string
      maxLength: 2000
      description: Why the gates were bypassed. Required with `bypass`.
  additionalProperties: false
MergeOpsTrailResponse:
  type: object
  properties:
    prUrl:
      type: string
    merged:
      type: boolean
    sha:
      anyOf:
        - type: string
        - type: "null"
      description: The merge commit.
    bypassed:
      type: array
      items:
        $ref: "#/TrailGateKey"
      description: Blocking gates that were not passing when it merged.
  required:
    - prUrl
    - merged
    - sha
    - bypassed
TrailStatus:
  type: string
  enum:
    - open
    - closed
  description: Whether a trail is still being worked. A trail closes by hand, or on its own once it is `shipped` with no high-priority discovered item open. `phase` carries the detail; `status` is the stored open/closed switch.
TrailType:
  type: string
  enum:
    - feature
    - bug
    - task
  description: What a trail is shipping. A `feature` trail is held to the rollback and measured release gates.
TrailDiscoveredSource:
  type: string
  enum:
    - origin
    - finding
    - agent
    - person
    - post_merge
    - cleanup
    - attached
  description: How an item came to be on a trail — `origin` (the item Ship this was pressed on), `finding` (a review finding promoted out of scope), `agent` (the coding agent filed it instead of fixing it in place), `person` (a reviewer filed it from the trail), `post_merge` (an error, alert or bug attributed to the trail after it merged), `cleanup` (follow-up the release created, e.g. remove a flag from code), `attached` (an existing item moved onto the trail).
TrailResourceKind:
  type: string
  enum:
    - gate
    - config
    - killswitch
    - experiment
    - metric
    - alert_rule
    - event
    - i18n_key
  description: The product entities a trail can ship or depend on. `gate` is a feature flag.
TrailResourceRole:
  type: string
  enum:
    - ships_behind
    - rollback
    - measures
    - guards
    - copy
    - touched
  description: What a resource is for on the trail — `ships_behind` (the flag the code ships behind), `rollback` (the kill switch that undoes it), `measures` (the experiment or metric that judges it), `guards` (an alert rule that watches it), `copy` (an i18n key it adds) or `touched` (anything else). The release gates and the release phase read these.
TrailResourceSource:
  type: string
  enum:
    - agent
    - detected
    - person
  description: How a resource got linked — `agent` (a write made in the trail's run context), `detected` (a review run saw the diff use it) or `person`.
TrailRunKind:
  type: string
  enum:
    - build
    - fix
    - plan
  description: "What a trail run was fired to do — `plan` (read-only: ask the person how the trail should ship and anything else that is open, then submit a plan), `build` (carry the approved plan to pull requests) or `fix` (act on failing evals and findings)."
TrailRunState:
  type: string
  enum:
    - launching
    - running
    - completed
    - failed
    - cancelled
  description: A trail run's lifecycle.
TrailAttributionConfidence:
  type: string
  enum:
    - high
    - medium
    - low
  description: How sure an attribution is. `high` and `medium` attach the item to the trail; `low` records a suspect for a person to confirm or reject.
TrailSuspectStatus:
  type: string
  enum:
    - pending
    - confirmed
    - rejected
  description: Where a suspected regression stands. Only `pending` suspects are listed on the trail.
TrailSummary:
  type: object
  description: A compact reference to a trail, as it appears on a queue item.
  properties:
    id:
      type: string
      description: The trail's id.
    number:
      type: integer
      description: Per-project trail number (the `12` in `T-12`).
    handle:
      type: string
      description: The trail's handle, `T-<number>`.
    title:
      type: string
    phase:
      $ref: "#/TrailPhase"
  required:
    - id
    - number
    - handle
    - title
    - phase
  additionalProperties: false
Trail:
  type: object
  description: "A trail — the unit of shipping: an intent, the changes worked under it, the items discovered on it and the product resources it ships. The phase and counts are a snapshot (see `snapshotAt`); the detail read recomputes them live."
  properties:
    id:
      type: string
      description: Stable opaque trail id (a uuid).
    number:
      type: integer
      description: Per-project trail number (the `12` in `T-12`).
    handle:
      type: string
      description: The trail's handle, `T-<number>`. Every trail endpoint accepts it or the id.
    title:
      type: string
      description: One-line statement of the intent.
    body:
      type: string
      description: The intent in markdown — the outcome and the acceptance criteria.
    type:
      $ref: "#/TrailType"
    priority:
      anyOf:
        - $ref: "#/OpsItemPriority"
        - type: "null"
      description: Triage priority, or `null` when not set.
    owner:
      $ref: "#/OpsItemOwner"
    status:
      $ref: "#/TrailStatus"
    closedReason:
      anyOf:
        - type: string
        - type: "null"
      description: Why the trail was closed, or `null` while it is open.
    phase:
      $ref: "#/TrailPhase"
    phaseReason:
      anyOf:
        - type: string
        - type: "null"
      description: One line on why the trail is in this phase, e.g. `2 of 3 changes can merge`, or `null`.
    origin:
      anyOf:
        - $ref: "#/OpsItemRef"
        - type: "null"
      description: The queue item Ship this was pressed on, or `null` for a trail created from scratch.
    repos:
      type: array
      items:
        type: string
      description: Repos (`owner/repo`) the trail may open changes in. Empty means no scope.
    changesOpen:
      type: integer
      description: Changes still open. Part of the snapshot.
    changesMergeable:
      type: integer
      description: Open changes whose merge gates all pass. Part of the snapshot.
    findingsOpenHigh:
      type: integer
      description: Open findings at `high` severity across the trail's changes. Part of the snapshot.
    itemsOpen:
      type: integer
      description: Discovered items still open. Part of the snapshot.
    resourcesCount:
      type: integer
      description: Product resources linked to the trail. Part of the snapshot.
    releasedPct:
      anyOf:
        - type: number
          minimum: 0
          maximum: 100
        - type: "null"
      description: The lowest prod rollout across the flags the trail ships behind, as a percent, or `null` when it ships behind none.
    mergedAt:
      anyOf:
        - type: string
        - type: "null"
      description: ISO-8601 time the first change merged, or `null`.
    shippedAt:
      anyOf:
        - type: string
        - type: "null"
      description: ISO-8601 time the trail reached `shipped`, or `null`.
    closedAt:
      anyOf:
        - type: string
        - type: "null"
      description: ISO-8601 time the trail was closed, or `null`.
    snapshotAt:
      anyOf:
        - type: string
        - type: "null"
      description: ISO-8601 time the snapshot columns (`phase`, the counts, `releasedPct`) were last rewritten. The list can lag the detail by one event; the detail read recomputes them live.
    createdAt:
      type: string
      description: ISO-8601 creation time.
    updatedAt:
      type: string
      description: ISO-8601 last-update time.
  required:
    - id
    - number
    - handle
    - title
    - body
    - type
    - priority
    - owner
    - status
    - closedReason
    - phase
    - phaseReason
    - origin
    - repos
    - changesOpen
    - changesMergeable
    - findingsOpenHigh
    - itemsOpen
    - resourcesCount
    - releasedPct
    - mergedAt
    - shippedAt
    - closedAt
    - snapshotAt
    - createdAt
    - updatedAt
  additionalProperties: false
TrailChangeRef:
  type: object
  description: A compact reference to one of a trail's changes.
  properties:
    id:
      type: string
      description: The change's id.
    prUrl:
      type: string
    prNumber:
      type: integer
    repo:
      anyOf:
        - type: string
        - type: "null"
      description: "`owner/repo`."
  required:
    - id
    - prUrl
    - prNumber
    - repo
  additionalProperties: false
TrailItem:
  type: object
  description: A queue item on a trail, with where it surfaced.
  properties:
    item:
      $ref: "#/OpsItemRef"
    priority:
      anyOf:
        - $ref: "#/OpsItemPriority"
        - type: "null"
      description: The item's triage priority, or `null`.
    discoveredSource:
      $ref: "#/TrailDiscoveredSource"
    discoveredSha:
      anyOf:
        - type: string
        - type: "null"
      description: The push the item surfaced on, or `null` when it did not surface on one.
    change:
      anyOf:
        - $ref: "#/TrailChangeRef"
        - type: "null"
      description: The change the item surfaced on, or `null`.
  required:
    - item
    - priority
    - discoveredSource
    - discoveredSha
    - change
  additionalProperties: false
TrailResourceState:
  type: object
  description: The resource's live state, read from the product when the trail is read. Only the fields that apply to the kind are set.
  properties:
    exists:
      type: boolean
      description: False when the entity could not be found (it was archived or never created).
    archived:
      type: boolean
      description: True when the entity is archived.
    settled:
      type: boolean
      description: Whether the resource no longer holds the trail in `releasing`. A flag settles at 100% in prod or when archived; a measuring experiment once it is stopped with a decision; every other role at merge.
    summary:
      anyOf:
        - type: string
        - type: "null"
      description: One line, e.g. `prod 25%`, `on`, `running`, `firing`.
    prodRolloutPct:
      anyOf:
        - type: number
          minimum: 0
          maximum: 100
        - type: "null"
      description: A flag's prod rollout, as a percent.
    status:
      anyOf:
        - type: string
        - type: "null"
      description: The entity's own status (an experiment's `running` or `stopped`, a kill switch's `on` or `off`, an alert's `firing` or `ok`).
    decision:
      anyOf:
        - type: string
        - type: "null"
      description: An experiment's decision once it has one.
  additionalProperties: {}
TrailResource:
  type: object
  description: A flag, config, kill switch, experiment, metric, alert rule, event or i18n key the trail ships or depends on. `state` is present on reads that load live state.
  properties:
    id:
      type: string
      description: The trail's link to the resource — what `trails resources remove` takes. Not the entity's own id.
    kind:
      $ref: "#/TrailResourceKind"
    resourceId:
      type: string
      description: The entity's own id.
    resourceKey:
      type: string
      description: The entity's key, kept for display after it is archived.
    role:
      $ref: "#/TrailResourceRole"
    source:
      $ref: "#/TrailResourceSource"
    state:
      $ref: "#/TrailResourceState"
    createdAt:
      type: string
      description: ISO-8601 time it was linked.
  required:
    - id
    - kind
    - resourceId
    - resourceKey
    - role
    - source
    - createdAt
  additionalProperties: false
NewTrailResource:
  type: object
  description: "A resource to link to a trail. When `role` is omitted it is guessed from the kind: a gate ships behind, a kill switch is the rollback, an experiment measures, an alert rule guards, an i18n key is copy, anything else is touched."
  properties:
    kind:
      $ref: "#/TrailResourceKind"
    resourceKey:
      type: string
      description: The entity's key (a gate or metric name, an experiment name, an i18n key). Resolved to the entity when it exists.
      minLength: 1
      maxLength: 256
    role:
      $ref: "#/TrailResourceRole"
  required:
    - kind
    - resourceKey
  additionalProperties: false
TrailRun:
  type: object
  description: A coding-agent session working the trail itself.
  properties:
    id:
      type: string
      description: The run's id.
    kind:
      $ref: "#/TrailRunKind"
    state:
      $ref: "#/TrailRunState"
    agent:
      anyOf:
        - type: string
        - type: "null"
      description: The coding agent that ran it (`claude`, `cursor`, `copilot`, `jules`, `jarvis`), or `null`.
    sessionUrl:
      anyOf:
        - type: string
        - type: "null"
      description: Link to the agent's session, or `null` when the provider has none.
    change:
      anyOf:
        - $ref: "#/TrailChangeRef"
        - type: "null"
      description: The change a `fix` run was fired for, or `null`.
    headSha:
      anyOf:
        - type: string
        - type: "null"
      description: The push a `fix` run was fired for, or `null`.
    summary:
      anyOf:
        - type: string
        - type: "null"
      description: What the run reported when it finished, or `null`.
    startedAt:
      type: string
      description: ISO-8601 start time.
    completedAt:
      anyOf:
        - type: string
        - type: "null"
      description: ISO-8601 finish time, or `null` while it runs.
    error:
      anyOf:
        - type: string
        - type: "null"
      description: Why the launch or the run failed, or `null`.
  required:
    - id
    - kind
    - state
    - agent
    - sessionUrl
    - change
    - headSha
    - summary
    - startedAt
    - completedAt
    - error
  additionalProperties: false
TrailSuspect:
  type: object
  description: "A low-confidence post-merge attribution: an error, alert or bug that may have been caused by the trail. A person confirms it onto the trail or rejects it."
  properties:
    id:
      type: string
      description: The suspect's id.
    item:
      $ref: "#/OpsItemRef"
    confidence:
      $ref: "#/TrailAttributionConfidence"
    evidence:
      type: string
      description: What the attributing agent saw — the frame, the resource or the metric that points at this trail.
    status:
      $ref: "#/TrailSuspectStatus"
    attributedBy:
      anyOf:
        - type: string
        - type: "null"
      description: The agent or person that recorded it, or `null`.
    createdAt:
      type: string
      description: ISO-8601 time it was recorded.
  required:
    - id
    - item
    - confidence
    - evidence
    - status
    - attributedBy
    - createdAt
  additionalProperties: false
TrailRolloutOnBreach:
  type: string
  enum:
    - pull_back
    - ask_first
    - ask_then_pull_back
  description: What to do when a guard trips during a step — `pull_back` (pull the flag back, investigate and suggest a fix, tell the owner; the default), `ask_first` (ask the owner, only notify), or `ask_then_pull_back` (ask, and pull back after `breachTimeoutMinutes` with no answer).
TrailRolloutAdvance:
  type: string
  enum:
    - auto
    - ask
  description: Whether a healthy step advances by itself (`auto`) or waits for the owner to say so (`ask`).
TrailRolloutAfterFix:
  type: string
  enum:
    - resume
    - ask
    - restart
  description: What happens when the fix merges — `resume` from the last healthy step, `ask` the owner first, or `restart` from the first step.
TrailRollout:
  type: object
  description: How the flag a trail ships behind is ramped after merge — the release controller's plan (see the design doc, the release controller). Part of the plan's release block; the project's defaults live in `trail-gates` `rollout`. The controller runs on the alerts cron, so a hold shorter than the cron interval rounds up to the next tick.
  properties:
    steps:
      type: array
      minItems: 1
      maxItems: 10
      items:
        type: number
        exclusiveMinimum: 0
        maximum: 100
      description: Percent steps, each above the one before, the last 100.
      example: [1, 5, 25, 50, 100]
    holdMinutes:
      type: integer
      minimum: 0
      maximum: 10080
      description: Minutes a step must stay healthy before the next one.
    minExposure:
      type: integer
      minimum: 0
      description: Evaluations a step must have served before it counts as healthy, so a quiet hour never passes as a green one. `0` = no floor.
    guards:
      type: object
      description: What is watched while a step holds. The trail's `guards` alert-rule resources are watched too.
      properties:
        alertRuleIds:
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 100
          description: Alert rules (ids) whose firing during a step is a breach.
        experimentGuardrails:
          type: boolean
          description: Whether a breached guardrail of the trail's measuring experiment is a breach.
        attributedErrors:
          type: boolean
          description: Whether a new error attributed to the trail at high confidence is a breach.
      required:
        - alertRuleIds
        - experimentGuardrails
        - attributedErrors
      additionalProperties: false
    policies:
      type: object
      description: The three decisions the plan asks the owner, each with the project default pre-selected.
      properties:
        onBreach:
          $ref: "#/TrailRolloutOnBreach"
        breachTimeoutMinutes:
          type: integer
          minimum: 1
          maximum: 1440
          description: With `ask_then_pull_back`, minutes the owner has before the controller pulls back.
        advance:
          $ref: "#/TrailRolloutAdvance"
        afterFix:
          $ref: "#/TrailRolloutAfterFix"
      required:
        - onBreach
        - breachTimeoutMinutes
        - advance
        - afterFix
      additionalProperties: false
  required:
    - steps
    - holdMinutes
    - minExposure
    - guards
    - policies
  additionalProperties: false
TrailRolloutState:
  type: string
  enum:
    - idle
    - running
    - paused
    - fixing
    - completed
  description: Where a trail's rollout is — `idle` (the controller has not taken it over), `running` (stepping the flag along the plan), `paused` (a person paused it, or it stepped aside or handed off), `fixing` (pulled back; waiting for the fix to merge) or `completed`.
TrailRolloutPending:
  type: object
  description: A question the controller asked the owner and is waiting on. Answer it with `ops questions answer`.
  properties:
    kind:
      type: string
      enum:
        - breach
        - advance
        - resume
      description: What it asks — what to do about a breach, whether to advance a healthy step, or how to resume after the fix.
    questionId:
      type: string
      description: The structured question's id.
    askedAt:
      type: string
      description: ISO-8601 time it was asked.
  required:
    - kind
    - questionId
    - askedAt
  additionalProperties: false
TrailRolloutView:
  type: object
  description: A trail's rollout as it stands — the plan's configuration and the controller's live state.
  properties:
    state:
      $ref: "#/TrailRolloutState"
    config:
      anyOf:
        - $ref: "#/TrailRollout"
        - type: "null"
      description: The rollout the plan carries, or `null` when the trail ships no flag or has no plan.
    step:
      type: integer
      description: Index into `config.steps` the flag is at; `-1` before the first step.
    stepPct:
      anyOf:
        - type: number
        - type: "null"
      description: The percent the current step puts the flag at, or `null` with no rollout.
    stepStartedAt:
      anyOf:
        - type: string
        - type: "null"
      description: ISO-8601 time the current step began.
    pausedReason:
      anyOf:
        - type: string
        - type: "null"
      description: Why the rollout is paused, or `null`.
    pending:
      anyOf:
        - $ref: "#/TrailRolloutPending"
        - type: "null"
      description: The question the controller is waiting on, or `null`.
  required:
    - state
    - config
    - step
    - stepPct
    - stepStartedAt
    - pausedReason
    - pending
  additionalProperties: false
TrailReleaseEventKind:
  type: string
  enum:
    - started
    - advanced
    - breach
    - pulled_back
    - asked
    - answered
    - investigating
    - fix_merged
    - resumed
    - restarted
    - paused
    - completed
  description: What happened on the release timeline.
TrailReleaseEvent:
  type: object
  description: One row of a trail's release timeline — something the controller, autopilot or a person did to its rollout.
  properties:
    id:
      type: string
      description: Event id (a uuid).
    kind:
      $ref: "#/TrailReleaseEventKind"
    step:
      type: integer
      description: The step the event is about; `-1` for none.
    fromPct:
      anyOf:
        - type: number
        - type: "null"
    toPct:
      anyOf:
        - type: number
        - type: "null"
    reason:
      anyOf:
        - type: string
        - type: "null"
      description: One line on why.
    evidence:
      anyOf:
        - type: object
          additionalProperties: true
        - type: "null"
      description: What the decision rested on — the guards that tripped, the question, the run.
    actor:
      type: string
      description: "`controller`, `autopilot`, or a person's email."
    createdAt:
      type: string
      description: ISO-8601 time.
  required:
    - id
    - kind
    - step
    - fromPct
    - toPct
    - reason
    - evidence
    - actor
    - createdAt
  additionalProperties: false
PauseTrailRolloutRequest:
  type: object
  description: Body for `POST /api/admin/trails/{handle}/rollout/pause`.
  properties:
    reason:
      type: string
      maxLength: 500
      description: Why — shown on the release timeline.
  additionalProperties: false
ResumeTrailRolloutRequest:
  type: object
  description: Body for `POST /api/admin/trails/{handle}/rollout/resume`. Resuming reconciles the rollout with the flag, wherever a person left it, and restarts the hold.
  properties:
    reason:
      type: string
      maxLength: 500
      description: Why — shown on the release timeline.
  additionalProperties: false
TrailRolloutResult:
  type: object
  description: The rollout after a pause or a resume.
  properties:
    rollout:
      $ref: "#/TrailRolloutView"
  required:
    - rollout
  additionalProperties: false
TrailPlanIntake:
  type: object
  description: What the creation dialog already decided — each field is a plan question answered in advance. The plan run asks only what is left out. Omitted entirely, the plan asks everything ("let the plan ask me").
  properties:
    requirePlan:
      type: boolean
      description: Plan before building, for this trail. Omitted, the project's setting.
    strategy:
      $ref: "#/TrailReleaseStrategy"
    flagKey:
      type: string
      minLength: 1
      maxLength: 200
      description: The flag's key, when the person named one.
    rollout:
      $ref: "#/TrailRollout"
  additionalProperties: false
TrailPlanStatus:
  type: string
  enum:
    - none
    - drafted
    - approved
  description: Where a trail's plan stands — `none` (no plan yet), `drafted` (an agent submitted it, or a person edited it, and it waits for approval) or `approved` (a person signed it off; the build run follows it).
TrailReleaseStrategy:
  type: string
  enum:
    - straight_to_main
    - flag
    - flag_experiment
    - kill_switch
    - flag_kill_switch
    - other
  description: "How the trail ships, as the person chose it while the plan was made — `straight_to_main` (no flag), `flag`, `flag_experiment` (a flag measured by an experiment), `kill_switch` (a kill switch only), `flag_kill_switch`, or `other` (a free-text answer that fits none of those)."
TrailPlanResourceKind:
  type: string
  enum:
    - gate
    - killswitch
    - experiment
  description: The release resources a plan may list — a feature flag (`gate`), a kill switch or an experiment.
TrailPlanResource:
  type: object
  description: One release resource the build run creates and links to the trail.
  properties:
    kind:
      $ref: "#/TrailPlanResourceKind"
    key:
      type: string
      minLength: 1
      maxLength: 200
      description: The key or name the build run creates it under, e.g. `checkout.v2`.
    role:
      $ref: "#/TrailResourceRole"
  required:
    - kind
    - key
  additionalProperties: false
TrailPlanRelease:
  type: object
  description: How the trail ships. The person answers this while the plan is made; the build run creates exactly the resources listed (none for `straight_to_main`), and the Plan gate checks they exist.
  properties:
    strategy:
      $ref: "#/TrailReleaseStrategy"
    reason:
      type: string
      maxLength: 2000
      description: One line on why this approach — risk, blast radius, reversibility.
    resources:
      type: array
      maxItems: 20
      items:
        $ref: "#/TrailPlanResource"
      description: The flags, kill switches and experiments to create. Empty for `straight_to_main`; the strategy fixes which kinds must be present (a flag for `flag`, a flag and an experiment for `flag_experiment`, and so on).
    rollout:
      $ref: "#/TrailRollout"
  required:
    - strategy
    - reason
    - resources
  additionalProperties: false
TrailPlan:
  type: object
  description: A trail's plan — what the build run follows. Made by a read-only plan run that asks the person how to ship, then approved by a person.
  properties:
    status:
      $ref: "#/TrailPlanStatus"
    plan:
      anyOf:
        - type: string
        - type: "null"
      description: The plan in markdown, or `null` before one exists.
    release:
      anyOf:
        - $ref: "#/TrailPlanRelease"
        - type: "null"
      description: How the trail ships and the resources to create, or `null` before a plan exists.
    approvedBy:
      anyOf:
        - type: string
        - type: "null"
      description: Email of the person who approved it, or `null`.
    approvedAt:
      anyOf:
        - type: string
        - type: "null"
      description: ISO-8601 time it was approved, or `null`.
    requirePlan:
      type: boolean
      description: Whether the project requires an approved plan before an agent builds (`trail-gates` `requirePlan`).
    nextRun:
      type: string
      enum:
        - plan
        - build
      description: The run `trails start` fires now — `plan` while the project requires a plan and none is approved, else `build`.
    openQuestions:
      type: integer
      minimum: 0
      description: Questions the plan run asked that still wait for an answer. Read them with `ops questions list <handle>`.
  required:
    - status
    - plan
    - release
    - approvedBy
    - approvedAt
    - requirePlan
    - nextRun
    - openQuestions
  additionalProperties: false
SubmitTrailPlanRequest:
  type: object
  description: Body for `POST /api/admin/trails/{handle}/plan` — a plan run submits what it worked out, after the person answered how the trail should ship.
  properties:
    plan:
      type: string
      minLength: 1
      maxLength: 20000
      description: The plan in markdown — the approach, the files and repos it touches, the order of the work, how each acceptance criterion is met, and the risks.
    release:
      $ref: "#/TrailPlanRelease"
  required:
    - plan
    - release
  additionalProperties: false
UpdateTrailPlanRequest:
  type: object
  description: Body for `PATCH /api/admin/trails/{handle}/plan` — a person edits the plan. Pass at least one field. Any edit puts the plan back to `drafted`, so it needs approving again.
  properties:
    plan:
      type: string
      minLength: 1
      maxLength: 20000
      description: The plan in markdown.
    release:
      $ref: "#/TrailPlanRelease"
  minProperties: 1
  additionalProperties: false
ApproveTrailPlanRequest:
  type: object
  description: Body for `POST /api/admin/trails/{handle}/plan/approve`.
  properties:
    startBuild:
      type: boolean
      default: false
      description: Also fire the build run once the plan is approved. Without it, approving only records the sign-off. When no coding agent is connected the request is refused with `409` before anything is approved.
    agent:
      type: string
      enum:
        - claude
        - cursor
        - copilot
        - jules
      description: Which coding agent builds, with `startBuild`. Omitted, the project's coding-agent trigger.
    connectorId:
      type: string
      description: A specific trigger connector to build with, with `startBuild`. Overrides `agent`.
  additionalProperties: false
ApproveTrailPlanResult:
  type: object
  description: The approved plan, and the build run when `startBuild` was set.
  properties:
    plan:
      $ref: "#/TrailPlan"
    run:
      anyOf:
        - $ref: "#/TrailRun"
        - type: "null"
      description: The build run that was started, or `null` when `startBuild` was not set.
  required:
    - plan
    - run
  additionalProperties: false
TrailPlanResult:
  type: object
  description: The plan as recorded.
  properties:
    plan:
      $ref: "#/TrailPlan"
  required:
    - plan
  additionalProperties: false
TrailDetail:
  type: object
  description: "A trail followed from intent to release: the trail itself plus its changes, discovered items, resources, runs, suspected regressions and the project's gates. Phase and counts are recomputed live on this read."
  properties:
    id:
      type: string
      description: Stable opaque trail id (a uuid).
    number:
      type: integer
      description: Per-project trail number (the `12` in `T-12`).
    handle:
      type: string
      description: The trail's handle, `T-<number>`. Every trail endpoint accepts it or the id.
    title:
      type: string
      description: One-line statement of the intent.
    body:
      type: string
      description: The intent in markdown — the outcome and the acceptance criteria.
    type:
      $ref: "#/TrailType"
    priority:
      anyOf:
        - $ref: "#/OpsItemPriority"
        - type: "null"
      description: Triage priority, or `null` when not set.
    owner:
      $ref: "#/OpsItemOwner"
    status:
      $ref: "#/TrailStatus"
    closedReason:
      anyOf:
        - type: string
        - type: "null"
      description: Why the trail was closed, or `null` while it is open.
    phase:
      $ref: "#/TrailPhase"
    phaseReason:
      anyOf:
        - type: string
        - type: "null"
      description: One line on why the trail is in this phase, e.g. `2 of 3 changes can merge`, or `null`.
    origin:
      anyOf:
        - $ref: "#/OpsItemRef"
        - type: "null"
      description: The queue item Ship this was pressed on, or `null` for a trail created from scratch.
    repos:
      type: array
      items:
        type: string
      description: Repos (`owner/repo`) the trail may open changes in. Empty means no scope.
    changesOpen:
      type: integer
      description: Changes still open. Part of the snapshot.
    changesMergeable:
      type: integer
      description: Open changes whose merge gates all pass. Part of the snapshot.
    findingsOpenHigh:
      type: integer
      description: Open findings at `high` severity across the trail's changes. Part of the snapshot.
    itemsOpen:
      type: integer
      description: Discovered items still open. Part of the snapshot.
    resourcesCount:
      type: integer
      description: Product resources linked to the trail. Part of the snapshot.
    releasedPct:
      anyOf:
        - type: number
          minimum: 0
          maximum: 100
        - type: "null"
      description: The lowest prod rollout across the flags the trail ships behind, as a percent, or `null` when it ships behind none.
    mergedAt:
      anyOf:
        - type: string
        - type: "null"
      description: ISO-8601 time the first change merged, or `null`.
    shippedAt:
      anyOf:
        - type: string
        - type: "null"
      description: ISO-8601 time the trail reached `shipped`, or `null`.
    closedAt:
      anyOf:
        - type: string
        - type: "null"
      description: ISO-8601 time the trail was closed, or `null`.
    snapshotAt:
      anyOf:
        - type: string
        - type: "null"
      description: ISO-8601 time the snapshot columns (`phase`, the counts, `releasedPct`) were last rewritten. The list can lag the detail by one event; the detail read recomputes them live.
    createdAt:
      type: string
      description: ISO-8601 creation time.
    updatedAt:
      type: string
      description: ISO-8601 last-update time.
    changes:
      type: array
      items:
        $ref: "#/TrailChange"
      description: Every change worked under the trail, with its gates, evals, findings, approvals and pushes. Gates are read live from GitHub, so a `state` of `unknown` means GitHub could not be read and the PR-backed gates read `pending`.
    items:
      type: array
      items:
        $ref: "#/TrailItem"
      description: Queue items discovered on the trail, with where each surfaced.
    resources:
      type: array
      items:
        $ref: "#/TrailResource"
      description: Product resources the trail ships or depends on, with their live state.
    runs:
      type: array
      items:
        $ref: "#/TrailRun"
      description: Runs working the trail itself, newest first.
    suspects:
      type: array
      items:
        $ref: "#/TrailSuspect"
      description: Pending low-confidence post-merge attributions awaiting a person.
    gates:
      $ref: "#/TrailGates"
    plan:
      $ref: "#/TrailPlan"
    rollout:
      $ref: "#/TrailRolloutView"
    releaseEvents:
      type: array
      items:
        $ref: "#/TrailReleaseEvent"
      description: The release timeline, newest first (the latest 100).
  required:
    - id
    - number
    - handle
    - title
    - body
    - type
    - priority
    - owner
    - status
    - closedReason
    - phase
    - phaseReason
    - origin
    - repos
    - changesOpen
    - changesMergeable
    - findingsOpenHigh
    - itemsOpen
    - resourcesCount
    - releasedPct
    - mergedAt
    - shippedAt
    - closedAt
    - snapshotAt
    - createdAt
    - updatedAt
    - changes
    - items
    - resources
    - runs
    - suspects
    - gates
    - plan
    - rollout
    - releaseEvents
  additionalProperties: false
ListTrailsResponse:
  type: object
  description: A page of trails, in the standard `{ data, next_cursor }` envelope.
  properties:
    data:
      type: array
      items:
        $ref: "#/Trail"
    next_cursor:
      anyOf:
        - type: string
        - type: "null"
      description: Opaque cursor for the next page, or `null` on the last.
    section_counts:
      type: object
      additionalProperties:
        type: integer
      description: Rows per section across the whole filtered result, when the sort groups rows (e.g. by phase). Only on `view=table`.
    grouped:
      type: boolean
      description: Whether the page is section-ordered, so the sections earn their headers. Only on `view=table`.
  required:
    - data
    - next_cursor
  additionalProperties: false
CreateTrailRequest:
  type: object
  description: Body for `POST /api/admin/trails`. A trail is created on purpose — from scratch, or from an item with `originItem`. Omitted, `type` follows the origin item (a bug is a `bug`, a feature request a `feature`) and is otherwise `task`.
  properties:
    title:
      type: string
      description: One-line statement of the intent.
      minLength: 1
      maxLength: 200
      pattern: ^\S(.*\S)?$
    body:
      type: string
      description: The intent in markdown — the outcome and the acceptance criteria.
      maxLength: 20000
      default: ""
    type:
      $ref: "#/TrailType"
    priority:
      anyOf:
        - $ref: "#/OpsItemPriority"
        - type: "null"
      description: Initial triage priority, or `null`.
    ownerId:
      anyOf:
        - type: string
        - type: "null"
      description: The `users.id` of the person to own the trail, or `null`.
    ownerConnectorId:
      anyOf:
        - type: string
        - type: "null"
      description: The agent connector to own the trail, or `null`.
    repos:
      type: array
      items:
        type: string
        minLength: 3
        maxLength: 200
      description: Repos (`owner/repo`) the trail may open changes in.
      maxItems: 20
      default: []
    originItem:
      type: string
      description: "Ship this: a queue item (number or id) to create the trail from. Its description seeds `body` when that is omitted, and it becomes the trail's first item with source `origin`."
      minLength: 1
      maxLength: 64
    intake:
      $ref: "#/TrailPlanIntake"
  required:
    - title
  additionalProperties: false
UpdateTrailRequest:
  type: object
  description: Body for `PATCH /api/admin/trails/{handle}`. Pass at least one field; omitted ones are left as they are.
  properties:
    title:
      type: string
      minLength: 1
      maxLength: 200
      pattern: ^\S(.*\S)?$
    body:
      type: string
      maxLength: 20000
    type:
      $ref: "#/TrailType"
    priority:
      anyOf:
        - $ref: "#/OpsItemPriority"
        - type: "null"
      description: Triage priority; `null` clears it.
    ownerId:
      anyOf:
        - type: string
        - type: "null"
      description: The `users.id` of the person owner; `null` unassigns.
    ownerConnectorId:
      anyOf:
        - type: string
        - type: "null"
      description: The agent connector owner; `null` unassigns.
    repos:
      type: array
      items:
        type: string
        minLength: 3
        maxLength: 200
      description: Replaces the trail's repo scope.
      maxItems: 20
  additionalProperties: false
CloseTrailRequest:
  type: object
  description: Body for `POST /api/admin/trails/{handle}/close`.
  properties:
    reason:
      type: string
      description: Why the trail is being closed, e.g. `abandoned` or `superseded by T-14`.
      maxLength: 2000
  additionalProperties: false
LinkTrailPrRequest:
  type: object
  description: Body for `POST /api/admin/trails/{handle}/changes`.
  properties:
    prUrl:
      type: string
      description: The pull request's URL.
      minLength: 1
      maxLength: 500
    item:
      type: string
      description: The queue item whose run opened the PR (number or id), when there is one. Omitted, the change belongs to the trail itself.
      minLength: 1
      maxLength: 64
  required:
    - prUrl
  additionalProperties: false
StartTrailRunRequest:
  type: object
  description: "Body for `POST /api/admin/trails/{handle}/runs`. Fires the project's coding-agent trigger with a trail prompt: the intent, the acceptance criteria, the linked resources and the open discovered items."
  properties:
    agent:
      type: string
      description: Which coding agent to fire — `claude`, `cursor`, `copilot` or `jules`. Omitted, the project's coding-agent trigger.
      enum:
        - claude
        - cursor
        - copilot
        - jules
    connectorId:
      type: string
      description: A specific trigger connector to fire. Overrides `agent`.
    kind:
      type: string
      enum:
        - plan
        - build
      description: "Which run to fire. Omitted, the server picks — `plan` while the project requires a plan (`trail-gates` `requirePlan`) and the trail has no approved one, else `build`. Asking for `build` before the plan is approved is refused with `409`, and so is asking for `plan` once one is approved: edit the plan to change it."
    prompt:
      type: string
      description: Extra instructions appended to the trail prompt.
      maxLength: 8000
  additionalProperties: false
PromoteTrailFindingRequest:
  type: object
  description: Body for `POST /api/admin/trails/{handle}/findings/{findingId}/promote`.
  properties:
    type:
      type: string
      enum:
        - bug
        - feature_request
      description: What to file the finding as. Defaults to `bug`.
    reason:
      type: string
      description: Why the finding is out of scope for this trail. Recorded on the finding.
      minLength: 1
      maxLength: 2000
    title:
      type: string
      description: A title for the new item. Defaults to the finding's title.
      minLength: 1
      maxLength: 200
  required:
    - reason
  additionalProperties: false
PromoteTrailFindingResponse:
  type: object
  description: "The item created from the finding (on the trail, source `finding`) and the finding, now dismissed as `moved to #N`."
  properties:
    item:
      $ref: "#/TrailItem"
    finding:
      $ref: "#/TrailFinding"
  required:
    - item
    - finding
  additionalProperties: false
ListTrailResourcesResponse:
  type: object
  description: The trail's resources, with their live state.
  properties:
    data:
      type: array
      items:
        $ref: "#/TrailResource"
  required:
    - data
  additionalProperties: false
AddTrailResourceRequest:
  type: object
  description: Body for `POST /api/admin/trails/{handle}/resources`. When `role` is omitted it is guessed from the kind. Linking the same entity again changes its role.
  properties:
    kind:
      $ref: "#/TrailResourceKind"
    resourceKey:
      type: string
      description: The entity's key (a gate or metric name, an experiment name, an i18n key). It must exist.
      minLength: 1
      maxLength: 256
    role:
      $ref: "#/TrailResourceRole"
  required:
    - kind
    - resourceKey
  additionalProperties: false
AddTrailItemRequest:
  type: object
  description: Body for `POST /api/admin/trails/{handle}/items`. The item is recorded with source `attached`.
  properties:
    item:
      type: string
      description: The queue item to put on the trail (number or id). An item is on at most one trail.
      minLength: 1
      maxLength: 64
  required:
    - item
  additionalProperties: false
AttributeTrailRequest:
  type: object
  description: Body for `POST /api/admin/trails/{handle}/attributions`.
  properties:
    item:
      type: string
      description: The error, alert or bug to attribute (number or id).
      minLength: 1
      maxLength: 64
    confidence:
      $ref: "#/TrailAttributionConfidence"
    evidence:
      type: string
      description: "Concrete evidence: a stack frame in a changed file, the failing call touching a resource of the trail, or a guard metric of the trail."
      minLength: 1
      maxLength: 4000
  required:
    - item
    - confidence
    - evidence
  additionalProperties: false
AttributeTrailResponse:
  type: object
  description: What an attribution did.
  properties:
    attached:
      type: boolean
      description: True when the item was put on the trail (`high` or `medium` confidence). False when only a suspect was recorded.
    item:
      anyOf:
        - $ref: "#/TrailItem"
        - type: "null"
      description: The item as it now sits on the trail, or `null` for a suspect.
    suspect:
      anyOf:
        - $ref: "#/TrailSuspect"
        - type: "null"
      description: The suspect recorded for a `low` confidence attribution, or `null`.
  required:
    - attached
    - item
    - suspect
  additionalProperties: false
TrailOkResponse:
  type: object
  description: Response for the trail detach endpoints.
  properties:
    ok:
      type: boolean
      const: true
      description: Always `true` — the link was removed.
  required:
    - ok
  additionalProperties: false
