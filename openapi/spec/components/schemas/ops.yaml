ListOpsItemsResponse:
  type: array
  items:
    type: object
    properties:
      id:
        type: string
        description: Stable opaque item id.
      number:
        anyOf:
          - type: number
          - type: "null"
        description: Per-project item number (the `#7` handle), or `null` if unnumbered.
      type:
        type: string
        enum:
          - bug
          - feature_request
          - error
          - alert
          - measure_plan
        description: "Queue item type. `bug` and `feature_request` are user-fileable; `error`, `alert`, and `measure_plan` tickets are auto-filed by the platform (a tracked production error, a metric-threshold alert, and an assistant-proposed measurement plan respectively)."
      title:
        type: string
        description: One-line item title.
      status:
        $ref: "#/OpsItemStatus"
      priority:
        anyOf:
          - $ref: "#/OpsItemPriority"
          - type: "null"
        description: Triage priority, or `null` if not yet set.
      sourceRef:
        description: Source reference for auto-filed tickets (e.g. an error fingerprint).
        anyOf:
          - type: string
          - type: "null"
      investigationState:
        anyOf:
          - $ref: "#/OpsInvestigationState"
          - type: "null"
        description: >-
          Where automation has taken this item in the investigation lifecycle
          (see `OpsInvestigationState`). Optional — absent/`null` on rows filed
          before the field existed; derive from `status`/`type` in that case.
      source:
        type: string
        enum:
          - team
          - system
        description: "How the item was filed: `team` (a human admin/teammate — bug/feature) or `system` (auto-filed — error/alert/measure_plan)."
      reporterEmail:
        anyOf:
          - type: string
          - type: "null"
        description: Reporter email (bug/feature), or `null`.
      stepsToReproduce:
        type: string
        description: Reproduction steps — populated for `bug`, empty string otherwise.
      actualResult:
        type: string
        description: What actually happened — `bug` only, empty string otherwise.
      expectedResult:
        type: string
        description: What was expected — `bug` only, empty string otherwise.
      description:
        type: string
        description: Feature description — populated for `feature_request`, empty string otherwise.
      useCase:
        type: string
        description: Feature use case — `feature_request` only, empty string otherwise.
      context:
        anyOf:
          - $ref: "#/OpsItemContext"
          - type: "null"
        description: "The RAW stored capture context on the row — NOT hydrated: list rows carry only what was captured at file time (e.g. `context.browser` for bug/feature, the trigger subset for auto-filed tickets). The live `error`/`alert` readings and `errorChart` are added only by the single-item read (`GET /api/admin/ops/{handle}`). `null` when nothing was captured."
      connectorData:
        anyOf:
          - $ref: "#/ConnectorData"
          - type: "null"
        description: "Per-connector linkage recorded for this item, keyed by connector provider. `null` if no connector has touched the item."
      notify:
        anyOf:
          - $ref: ./common.yaml#/NotificationTarget
          - type: "null"
        description: Per-item completion-notification target, or `null` (falls back to the project default).
      assigneeId:
        anyOf:
          - type: string
          - type: "null"
        description: The PERSON owner — a `users.id` (resolved into `owner.user`), or `null` when unassigned.
      assigneeConnectorId:
        anyOf:
          - type: string
          - type: "null"
        description: The AGENT owner when it is a connected trigger connector — a `connectors` row id (resolved into `owner.agent`), or `null`. Mutually exclusive with `assigneeAgent`.
      assigneeAgent:
        anyOf:
          - type: string
          - type: "null"
        description: The AGENT owner when it is a built-in hosted Shipeasy agent — currently only `jarvis` — or `null`. Mutually exclusive with `assigneeConnectorId`.
      owner:
        $ref: "#/OpsItemOwner"
      run:
        anyOf:
          - $ref: "#/OpsRun"
          - type: "null"
        description: The currently OPEN run on this item (someone acked it and is actively working — the cockpit's live working indicator), or `null` when nothing is in flight.
      lastRun:
        anyOf:
          - $ref: "#/OpsRun"
          - type: "null"
        description: The most recently COMPLETED run (the run result — final action, PR, duration), excluding superseded runs; `null` when no run has completed yet.
      createdAt:
        type: string
        description: ISO-8601 creation timestamp.
      updatedAt:
        type: string
        description: ISO-8601 last-update timestamp.
      closedAt:
        anyOf:
          - type: string
          - type: "null"
        description: ISO-8601 timestamp the item was closed (`resolved` or `wont_fix`), or `null` while it is open.
    required:
      - id
      - number
      - type
      - title
      - status
      - priority
      - source
      - owner
      - run
      - lastRun
      - createdAt
      - updatedAt
      - closedAt
    additionalProperties: {}
    description: One queue item — any type — plus its resolved `owner` and run state.
  description: A page of queue items, newest first.
GetOpsItemResponse:
  type: object
  properties:
    id:
      type: string
      description: Stable opaque item id.
    number:
      anyOf:
        - type: number
        - type: "null"
      description: Per-project item number (the `#7` handle), or `null` if unnumbered.
    type:
      type: string
      enum:
        - bug
        - feature_request
        - error
        - alert
        - measure_plan
      description: "Queue item type. `bug` and `feature_request` are user-fileable; `error`, `alert`, and `measure_plan` tickets are auto-filed by the platform (a tracked production error, a metric-threshold alert, and an assistant-proposed measurement plan respectively)."
    title:
      type: string
      description: One-line item title (all types).
    status:
      $ref: "#/OpsItemStatus"
    priority:
      anyOf:
        - $ref: "#/OpsItemPriority"
        - type: "null"
      description: Triage priority, or `null` if not yet set (all types).
    source:
      type: string
      enum:
        - team
        - system
      description: "How the item was filed: `team` (a human admin/teammate — bug/feature) or `system` (auto-filed — error/alert/measure_plan)."
    sourceRef:
      anyOf:
        - type: string
        - type: "null"
      description: "Stable key of the originating record for auto-filed tickets (error fingerprint, `<alert source>:<dedupeKey>`, or measurement-plan ref); `null` for human-filed bugs/features."
    investigationState:
      anyOf:
        - $ref: "#/OpsInvestigationState"
        - type: "null"
      description: >-
        Where automation has taken this item in the investigation lifecycle
        (see `OpsInvestigationState`). Written as a side-effect of the actions
        that already happen (link a PR, change status, an assistant reply);
        `null` on rows filed before the field existed — derive from
        `status`/`type` in that case.
    reporterEmail:
      anyOf:
        - type: string
        - type: "null"
      description: Reporter email (bug/feature), or `null`.
    stepsToReproduce:
      type: string
      description: Reproduction steps — populated for `bug`, empty string otherwise.
    actualResult:
      type: string
      description: What actually happened — `bug` only, empty string otherwise.
    expectedResult:
      type: string
      description: What was expected — `bug` only, empty string otherwise.
    description:
      type: string
      description: Feature description — populated for `feature_request`, empty string otherwise.
    useCase:
      type: string
      description: Feature use case — `feature_request` only, empty string otherwise.
    context:
      anyOf:
        - $ref: "#/OpsItemContext"
        - type: "null"
      description: "Type-specific capture context. For `bug`/`feature_request` it carries `browser` (the auto-collected page URL / user-agent / viewport). For auto-filed tickets it carries the hydrated `error`, `alert`, or `measurePlan` block. `null` only for legacy rows with nothing captured."
    attachments:
      type: array
      items:
        $ref: "#/OpsItemAttachment"
      description: "Files attached to the report — screenshots, recordings, logs. Populated for `bug`/`feature_request`; always an empty array for auto-filed `error`/`alert`/`measure_plan` tickets. Fetch each via its `fetchUrl` with the same admin/ops key (the download route is ops-key allow-listed)."
    related:
      $ref: "#/OpsItemRelated"
    blockedBy:
      type: array
      items:
        $ref: "#/OpsItemRef"
      description: Items that block this one. While any of them is not `resolved`/`wont_fix` the item is blocked — work its blockers first. Edit with `PATCH /api/admin/ops/{handle}/links`.
    blocking:
      type: array
      items:
        $ref: "#/OpsItemRef"
      description: Items this one blocks — closing it unblocks them.
    duplicateOf:
      anyOf:
        - $ref: "#/OpsItemRef"
        - type: "null"
      description: The canonical item this one duplicates, or `null`. Work happens on the canonical item.
    duplicates:
      type: array
      items:
        $ref: "#/OpsItemRef"
      description: Items marked as duplicates of this one — their reports add context to this item.
    qaQuestions:
      type: array
      items:
        $ref: "#/OpsQaQuestion"
      description: Questions put to QA on this item, newest first (max 100), each with QA's answer once given. List the project-wide backlog with `ops list --qa-questions open`; ask with `ops qa-questions ask`.
    group:
      anyOf:
        - $ref: "#/OpsItemGroup"
        - type: "null"
      description: "The link group this item belongs to — every item tied to it, directly or through a chain, by a blocked-by / blocking / duplicate-of link — or `null` when it has no links. Agent runs only work a group through its `master`; read the other members before starting, and close them together with `PATCH /api/admin/ops/{handle}/group`."
    linkedItems:
      type: array
      items:
        $ref: "#/OpsLinkedItem"
      description: "The full content of every OTHER member of the link group, master first. Present only when the request passes `include=linked`."
    connectorData:
      anyOf:
        - $ref: "#/ConnectorData"
        - type: "null"
      description: "Per-connector linkage recorded for this item, keyed by connector provider. Populated as connectors act on the item (e.g. GitHub opens an issue, Slack posts a message); more than one provider can be present at once. `null` if no connector has touched the item."
    notify:
      anyOf:
        - $ref: ./common.yaml#/NotificationTarget
        - type: "null"
      description: Per-item completion-notification target, or `null` (falls back to the project default).
    assigneeId:
      anyOf:
        - type: string
        - type: "null"
      description: The PERSON owner — a `users.id` (resolved into `owner.user`), or `null` when unassigned.
    assigneeConnectorId:
      anyOf:
        - type: string
        - type: "null"
      description: The AGENT owner when it is a connected trigger connector — a `connectors` row id (resolved into `owner.agent`), or `null`. Mutually exclusive with `assigneeAgent`.
    assigneeAgent:
      anyOf:
        - type: string
        - type: "null"
      description: The AGENT owner when it is a built-in hosted Shipeasy agent — currently only `jarvis` — or `null`. Mutually exclusive with `assigneeConnectorId`.
    owner:
      $ref: "#/OpsItemOwner"
    trail:
      anyOf:
        - $ref: "#/TrailSummary"
        - type: "null"
      description: The trail this item belongs to, or `null` when it is on none. An item is on at most one trail.
    discoveredSource:
      anyOf:
        - $ref: "#/TrailDiscoveredSource"
        - type: "null"
      description: How the item came to be on its trail (`origin`, `finding`, `agent`, `person`, `post_merge`, `cleanup`, `attached`), or `null` when it is on no trail.
    createdAt:
      type: string
      description: ISO-8601 creation timestamp.
    updatedAt:
      type: string
      description: ISO-8601 last-update timestamp.
  required:
    - id
    - number
    - type
    - title
    - status
    - priority
    - context
    - attachments
    - related
    - owner
    - createdAt
  additionalProperties: {}
  description: "One queue item, any of the five types. Shared fields apply to all; `stepsToReproduce`/`actualResult`/`expectedResult` are bug-specific, `description`/`useCase` feature-specific. The auto-collected browser fields (page URL, user-agent, viewport) live under `context.browser` for bug/feature. `context` also carries the hydrated per-type payload for auto-filed `error`/`alert`/`measure_plan` tickets, `attachments` lists any uploaded files, and `related` gives deep links to the underlying resources."
OpsItemOwner:
  type: object
  properties:
    user:
      anyOf:
        - type: object
          properties:
            id:
              type: string
              description: The `users.id` of the assigned person (what `assigneeId` stores).
            email:
              type: string
              description: The person's email.
            name:
              anyOf:
                - type: string
                - type: "null"
              description: The person's display name, or `null` when none is set.
          required:
            - id
            - email
            - name
          additionalProperties: false
          description: The resolved person owner.
        - type: "null"
      description: The PERSON half of the owner (resolved from `assigneeId`), or `null` when no person is assigned.
    agent:
      anyOf:
        - type: object
          properties:
            connectorId:
              anyOf:
                - type: string
                - type: "null"
              description: The `connectors` row id for a connector-backed agent; `null` for the built-in one.
            builtin:
              anyOf:
                - type: string
                  const: jarvis
                - type: "null"
              description: The built-in-agent key (`jarvis`) when this is the hosted Shipeasy agent; `null` for a connector-backed one.
            provider:
              type: string
              enum:
                - claude_trigger
                - cursor_trigger
                - copilot_trigger
                - jules_trigger
                - jarvis
              description: The trigger-connector provider backing this agent, or `jarvis` for the built-in hosted agent.
            name:
              type: string
              description: Display name — the connector's `name`, the provider default (e.g. "Claude"), or "Jarvis".
          required:
            - connectorId
            - builtin
            - provider
            - name
          additionalProperties: false
          description: The resolved agent owner. Exactly one of `connectorId` / `builtin` is set.
        - type: "null"
      description: The AGENT half of the owner (resolved from `assigneeConnectorId` / `assigneeAgent`), or `null` when no agent is assigned.
  required:
    - user
    - agent
  additionalProperties: false
  description: "The fully-resolved owner of a queue item — a person and/or an AI agent. The two halves are independent: an item may have a person, an agent, both, or neither (both `null`)."
OpsRun:
  type: object
  properties:
    id:
      type: string
      description: Run record id.
    agent:
      anyOf:
        - type: string
        - type: "null"
      description: "The AI agent type working the run (`jarvis` | `claude` | `cursor` | `copilot` | `jules`); `null` for a human ack."
    connectorId:
      anyOf:
        - type: string
        - type: "null"
      description: The trigger-connector row id backing the acking agent; `null` for a human ack or the built-in Jarvis agent.
    ackedBy:
      anyOf:
        - type: string
        - type: "null"
      description: Email of the human who acked; `null` for an AI ack.
    sessionId:
      anyOf:
        - type: string
        - type: "null"
      description: The agent-run session id recorded on the ack (dashboard deep-links to the run page), or `null`.
    sessionUrl:
      anyOf:
        - type: string
        - type: "null"
      description: "The run's session-page deep link, or `null`. DERIVED (never stored): rebuilt from `sessionId` + the run's trigger connector — Claude's routine id (`?trigger=`), Copilot's repo (`/tasks/`), Cursor/Jules from the id alone."
    startedAt:
      type: string
      description: ISO-8601 timestamp the run started (the ack time).
    completedAt:
      anyOf:
        - type: string
        - type: "null"
      description: ISO-8601 timestamp the run closed, or `null` while still open.
    completedAction:
      $ref: "#/OpsRunActionOrNull"
    prNumber:
      anyOf:
        - type: number
        - type: "null"
      description: The PR the run linked as its final action, or `null`.
    prUrl:
      anyOf:
        - type: string
        - type: "null"
      description: HTML URL of that PR, or `null`.
  required:
    - id
    - agent
    - connectorId
    - ackedBy
    - sessionId
    - sessionUrl
    - startedAt
    - completedAt
    - completedAction
    - prNumber
    - prUrl
  additionalProperties: false
  description: "One run on a queue item — who (person or AI agent) picked it up when, and, once closed, how it ended (final action + PR + session link). Opened by `POST /api/admin/ops/{handle}/ack`."
OpsItemContext:
  type: object
  properties:
    browser:
      $ref: "#/OpsBrowserContext"
    error:
      $ref: "#/OpsErrorContext"
    alert:
      $ref: "#/OpsAlertContext"
    measurePlan:
      $ref: "#/OpsMeasurePlanContext"
    errorChart:
      type: object
      properties:
        series:
          type: array
          items:
            type: object
            properties:
              t:
                type: number
                description: Bucket start — unix epoch **milliseconds**. Bucket width scales with the window (hourly up to ~5 days, coarser beyond).
              v:
                type: number
                description: Occurrence count in the bucket (sample-rate weighted).
            required:
              - t
              - v
            additionalProperties: {}
            description: One occurrence bucket.
          description: Occurrence buckets, oldest first. Buckets with no occurrences are omitted.
        domainFrom:
          type: number
          description: Chart domain start — unix epoch milliseconds (the window's start).
        domainTo:
          type: number
          description: Chart domain end — unix epoch milliseconds (the read time).
      required:
        - series
        - domainFrom
        - domainTo
      additionalProperties: {}
      description: "Occurrence timeline for an `error` ticket — buckets over the project's error auto-close window (Settings → Errors: `errorAutocloseDays`, 7 days when auto-close is off, capped at 30) from the sampled occurrences, hydrated at read time by the single-item read only. Plotting exactly the quiet window that auto-resolves the error is what makes an empty right-hand edge meaningful. ABSENT (not `null`) on non-error tickets, on list rows (raw context), and when no occurrence landed in the window."
  additionalProperties: {}
  description: "Per-type capture context on a queue item. Exactly one of `browser` (bug/feature), `error`, `alert`, or `measurePlan` is populated depending on `type`; other keys (e.g. the AI dedupe block on bugs) may also be present."
OpsBrowserContext:
  type: object
  properties:
    pageUrl:
      anyOf:
        - type: string
        - type: "null"
      description: URL of the page the report was filed from, or `null`.
    userAgent:
      anyOf:
        - type: string
        - type: "null"
      description: Reporter's user-agent string, or `null`.
    viewport:
      anyOf:
        - type: string
        - type: "null"
      description: "Reporter's viewport (e.g. `1280x720`), or `null`."
  additionalProperties: {}
  description: "Auto-collected browser environment for a `bug`/`feature_request`, captured at file time."
OpsErrorContext:
  type: object
  properties:
    id:
      type: string
      description: The tracked `errors` row id (fetch full detail via `related.error`).
    fingerprint:
      type: string
      description: Stable dedupe key of the tracked error.
    causedByFingerprint:
      anyOf:
        - type: string
        - type: "null"
      description: "Fingerprint of the upstream issue this error descends from (set when the same error was reported at an inner boundary first), or `null` for a root issue."
    errorType:
      anyOf:
        - type: string
        - type: "null"
      description: "Error class/name, e.g. `TypeError`, or `null` when the source didn't supply one."
    message:
      type: string
      description: The error message.
    subject:
      anyOf:
        - type: string
        - type: "null"
      description: "The `see()` consequence subject — the `causes_the(<subject>)` value. Grep the codebase for this to find the throw site. `null` if the error was never instrumented."
    outcome:
      anyOf:
        - type: string
        - type: "null"
      description: "The `see()` consequence outcome — the `.to(<outcome>)` value. `null` if uninstrumented."
    kind:
      anyOf:
        - type: string
        - type: "null"
      description: "`see()` error kind: `caught` | `uncaught` | `unhandled_rejection` | `network` | `violation`."
    side:
      anyOf:
        - type: string
        - type: "null"
      description: "Which SDK side reported it: `client` | `server`."
    env:
      anyOf:
        - type: string
        - type: "null"
      description: Published env the reporting SDK ran against (dev/staging/prod).
    count:
      type: number
      description: Folded occurrence count for this fingerprint.
    firstSeenAt:
      type: string
      description: ISO-8601 timestamp of the first occurrence.
    lastSeenAt:
      type: string
      description: ISO-8601 timestamp of the most recent occurrence.
    seenUrls:
      type: array
      items:
        type: string
      description: "Distinct, id-normalized routes this error has surfaced on (UUIDs/ids collapsed to `#`)."
    stackTail:
      anyOf:
        - type: string
        - type: "null"
      description: "The last 3 non-empty lines of the latest occurrence's stack — the innermost frames closest to where the throw bubbled out, baked in as an at-a-glance locator. `null` when the source supplied no stack. Fetch the full stack via `related.error`."
    sdkVersion:
      anyOf:
        - type: string
        - type: "null"
      description: "@shipeasy/sdk version of the latest occurrence, or `null`."
  required:
    - id
    - fingerprint
    - message
    - count
    - firstSeenAt
    - lastSeenAt
    - seenUrls
  additionalProperties: {}
  description: "Hydrated detail for an auto-filed `error` ticket, read from the tracked `errors` row at request time (so `count`/`lastSeenAt` reflect the latest state)."
OpsAlertContext:
  type: object
  properties:
    source:
      type: string
      enum:
        - metric_rule
        - killswitch_armed
        - experiment_srm
        - experiment_peek
        - guardrail
      description: What kind of condition opened this alert instance.
    dedupeKey:
      type: string
      description: Stable per-condition key; with `source` forms the ticket's `sourceRef`.
    detail:
      anyOf:
        - type: string
        - type: "null"
      description: The instance's one-line reading — the observed condition in words.
    ruleId:
      anyOf:
        - type: string
        - type: "null"
      description: Id of the alert rule that opened this instance, or `null` for a built-in condition.
    severity:
      type: string
      enum:
        - danger
        - warn
        - info
      description: "How loud the alert is. Severity belongs to the RULE and is carried by this ticket as `priority`; it is DERIVED from that on the hydrated single-item read, and absent from the raw stored context list rows return."
    observedValue:
      anyOf:
        - type: number
        - type: "null"
      description: The metric value that tripped the rule, or `null`.
    href:
      anyOf:
        - type: string
        - type: "null"
      description: Dashboard deep link to the alert, or `null`.
    status:
      anyOf:
        - type: string
          enum:
            - active
            - resolved
            - dismissed
        - type: "null"
      description: "Firing state of this instance, projected from the ticket's own status (`active` while it is open, i.e. while the condition holds). Absent from the raw stored context list rows return."
    activeSince:
      anyOf:
        - type: string
        - type: "null"
      description: ISO-8601 timestamp the alert became active, or `null`.
    resolvedAt:
      anyOf:
        - type: string
        - type: "null"
      description: ISO-8601 timestamp the alert cleared, or `null` while still active.
    rule:
      anyOf:
        - $ref: "#/OpsAlertRuleSummary"
        - type: "null"
      description: "The alert rule condition that tripped (metric-rule alerts only); `null` for SRM/peek/guardrail alerts with no rule."
    metric:
      anyOf:
        - $ref: "#/OpsAlertMetricSummary"
        - type: "null"
      description: "The metric the alert watches, hydrated with its backing event(s); `null` if not resolvable."
  required:
    - source
    - dedupeKey
  additionalProperties: {}
  description: "Detail for an `alert` ticket — the fired-alert INSTANCE this ticket is. List rows carry the stored capture subset (`source`, `dedupeKey`, `ruleId`, `detail`, `href`, `observedValue`); the single-item read hydrates the rest, resolving `severity`/`status` off the ticket itself and the rule → metric → event chain at request time."
OpsAlertRuleSummary:
  type: object
  properties:
    id:
      type: string
      description: Alert-rule id.
    name:
      type: string
      description: Alert-rule name.
    comparator:
      type: string
      enum:
        - gt
        - gte
        - lt
        - lte
      description: How `observedValue` is compared to `threshold`.
    threshold:
      type: number
      description: The threshold value the rule fires on.
    windowHours:
      type: number
      description: Rolling evaluation window in hours.
  required:
    - id
    - name
    - comparator
    - threshold
    - windowHours
  additionalProperties: {}
  description: "The condition of a metric-rule alert."
OpsAlertMetricSummary:
  type: object
  properties:
    id:
      type: string
      description: Metric id (fetch full detail via `related.metric`).
    name:
      type: string
      description: Metric name.
    events:
      type: array
      items:
        type: string
      description: "The event name(s) the metric aggregates over — one for count metrics, numerator + denominator for ratio metrics. Grep the codebase for `track('<event>')` on each to find the instrumentation feeding the metric."
  required:
    - id
    - name
    - events
  additionalProperties: {}
  description: "The metric an alert watches, with its backing events."
OpsMeasurePlanContext:
  type: object
  properties:
    goal:
      anyOf:
        - type: string
        - type: "null"
      description: "The customer's underlying intent in their own words — WHAT they want to learn or achieve and WHY, independent of the specific steps. The plan below is a best-effort proposal made without repo access; when the code reveals a better path, this goal is the target you optimize for, not literal step-adherence."
    created:
      type: array
      items:
        $ref: "#/MeasurePlanResource"
      description: Resources the assistant already created on approval (live now) — don't recreate them.
    pending:
      type: array
      items:
        $ref: "#/MeasurePlanResource"
      description: Resources the assistant couldn't create yet (usually a metric whose backing event isn't emitted); create these after the instrumentation lands.
    instrumentation:
      type: array
      items:
        $ref: "#/MeasurePlanStep"
      description: The code instrumentation to implement before the metrics can collect data.
  required:
    - created
    - instrumentation
  additionalProperties: {}
  description: "An assistant-proposed measurement plan: what it already built, what it still needs, and the event instrumentation you implement."
MeasurePlanResource:
  type: object
  properties:
    kind:
      type: string
      enum:
        - metric
        - experiment
        - alert_rule
        - event
      description: Resource kind.
    id:
      anyOf:
        - type: string
        - type: "null"
      description: Resource id when it was created; absent/`null` for resources still to be made.
    name:
      type: string
      description: Resource name.
  required:
    - kind
    - name
  additionalProperties: {}
  description: "A resource referenced by a measurement plan."
MeasurePlanStep:
  type: object
  properties:
    event:
      anyOf:
        - type: string
        - type: "null"
      description: The event name the instrumentation should emit, when known.
    attribute:
      anyOf:
        - type: string
        - type: "null"
      description: "A new user attribute the project must start sending on its identify/evaluate context (when a gate's targeting needs a field that doesn't exist yet)."
    label:
      type: string
      description: Short human-readable name for the moment being instrumented.
    description:
      anyOf:
        - type: string
        - type: "null"
      description: "What to track and why, described conceptually — which user moment/action to capture and what it enables. Deliberately NOT a file path (the assistant has no repo access and can't name real files); you locate the call site yourself."
    properties:
      type: array
      items:
        type: string
      description: "Event properties the downstream metric needs attached (e.g. `method`, `plan`)."
  required:
    - label
  additionalProperties: {}
  description: "One piece of code instrumentation a measurement plan still needs."
OpsItemAttachment:
  type: object
  properties:
    id:
      type: string
      description: Attachment id.
    kind:
      type: string
      description: "`screenshot` | `video` | `log`."
    filename:
      type: string
      description: Sanitized original filename.
    mimeType:
      type: string
      description: "MIME type, e.g. `image/png`."
    sizeBytes:
      type: number
      description: Upload size in bytes.
    fetchUrl:
      type: string
      description: "Admin-API path to download the file (`GET` with the admin/ops key — screenshots render inline; recordings can't be watched)."
  required:
    - id
    - kind
    - filename
    - mimeType
    - sizeBytes
    - fetchUrl
  additionalProperties: {}
  description: "A file uploaded with a bug/feature report."
OpsItemRelated:
  type: object
  properties:
    dashboard:
      type: string
      description: Dashboard-relative deep link to this item.
    error:
      type: string
      description: Admin-API path to the tracked error (error tickets only).
    alertRule:
      type: string
      description: Admin-API path to the alert rule (metric-rule alerts only).
    metric:
      type: string
      description: Admin-API path to the metric the alert watches (alert tickets only).
    githubIssue:
      type: string
      description: HTML URL of the connected GitHub issue, if any.
    githubPr:
      type: string
      description: HTML URL of the linked GitHub pull request, if any.
  additionalProperties: {}
  description: "Deep links to the resources behind this item — every value is either a dashboard-relative path or an admin-API path fetchable with the same key."
OpsItemRef:
  type: object
  properties:
    id:
      type: string
      description: Stable opaque item id.
    number:
      anyOf:
        - type: number
        - type: "null"
      description: Per-project item number (the `#7` handle), or `null` if unnumbered.
    type:
      type: string
      enum:
        - bug
        - feature_request
        - error
        - alert
        - measure_plan
      description: Queue item type.
    title:
      type: string
      description: One-line item title.
    status:
      $ref: "#/OpsItemStatus"
  required:
    - id
    - number
    - type
    - title
    - status
  additionalProperties: false
  description: A compact reference to another queue item — enough to name it and tell whether it is still open.
OpsItemLinksResponse:
  type: object
  properties:
    id:
      type: string
      description: Id of the item the links were edited on.
    blockedBy:
      type: array
      items:
        $ref: "#/OpsItemRef"
      description: Items that block this one, oldest link first. While any of them is not `resolved`/`wont_fix` the item is blocked.
    blocking:
      type: array
      items:
        $ref: "#/OpsItemRef"
      description: Items this one blocks, oldest link first.
    duplicateOf:
      anyOf:
        - $ref: "#/OpsItemRef"
        - type: "null"
      description: The canonical item this one duplicates, or `null`.
    duplicates:
      type: array
      items:
        $ref: "#/OpsItemRef"
      description: Items marked as duplicates of this one, oldest link first.
  required:
    - id
    - blockedBy
    - blocking
    - duplicateOf
    - duplicates
  additionalProperties: false
  description: "Every relation of one queue item — \"blocked by\" / \"blocking\" and \"duplicate of\" / \"duplicates\" — in both directions."
OpsItemGroup:
  type: object
  properties:
    master:
      $ref: "#/OpsItemRef"
    items:
      type: array
      items:
        $ref: "#/OpsItemRef"
      description: Every member of the group, this item included, master first. The rest follow in the order the master is picked by.
  required:
    - master
    - items
  additionalProperties: false
  description: "A link group: the items connected by blocked-by / blocking / duplicate-of links, which the dashboard shows and moves together. Its master is the one member agent runs work on — the first open member that is not a duplicate and has no open blocker, then the most urgent priority, then the oldest. Closed members only lead once every member is closed."
OpsLinkedItem:
  type: object
  properties:
    id:
      type: string
      description: Stable opaque item id.
    number:
      anyOf:
        - type: number
        - type: "null"
      description: Per-project item number (the `#7` handle), or `null` if unnumbered.
    type:
      type: string
      enum:
        - bug
        - feature_request
        - error
        - alert
        - measure_plan
      description: Queue item type.
    title:
      type: string
      description: One-line item title.
    status:
      $ref: "#/OpsItemStatus"
    priority:
      anyOf:
        - $ref: "#/OpsItemPriority"
        - type: "null"
      description: Triage priority, or `null` if not yet set.
    description:
      type: string
      description: Feature description (`feature_request`), empty string otherwise.
    stepsToReproduce:
      type: string
      description: Bug repro steps (`bug`), empty string otherwise.
    actualResult:
      type: string
      description: What happened (`bug`), empty string otherwise.
    expectedResult:
      type: string
      description: What was expected (`bug`), empty string otherwise.
    useCase:
      type: string
      description: Feature use case (`feature_request`), empty string otherwise.
    createdAt:
      type: string
      description: ISO-8601 creation timestamp.
  required:
    - id
    - number
    - type
    - title
    - status
    - priority
  additionalProperties: {}
  description: One linked item's content, inlined into `ops get` by `include=linked` so a run reads the whole group in one call. Its comments, attachments and runs are on its own `ops get`.
UpdateOpsGroupRequest:
  type: object
  properties:
    status:
      $ref: "#/OpsItemStatus"
    priority:
      $ref: "#/OpsItemPriorityOrNull"
  additionalProperties: false
  description: "Triage fields applied to EVERY member of the item's link group. Pass at least one field."
OpsItemGroupResponse:
  type: object
  properties:
    id:
      type: string
      description: Id of the item the call was made on.
    group:
      $ref: "#/OpsItemGroup"
    updated:
      type: number
      description: How many members actually changed — members already in the requested state are left alone.
  required:
    - id
    - group
    - updated
  additionalProperties: false
  description: The group after a group-wide update.
OpsItemHandle:
  type: string
  minLength: 1
  maxLength: 64
  description: A queue item's per-project number (e.g. `12`, `#12` also accepted) or its full id.
UpdateOpsLinksRequest:
  type: object
  properties:
    addBlockedBy:
      type: array
      maxItems: 50
      items:
        $ref: "#/OpsItemHandle"
      default: []
      description: Items (number or id) to record as blocking this one. Already-linked items are a no-op.
    removeBlockedBy:
      type: array
      maxItems: 50
      items:
        $ref: "#/OpsItemHandle"
      default: []
      description: Items (number or id) to stop recording as blocking this one. Unlinked items are a no-op.
    addBlocking:
      type: array
      maxItems: 50
      items:
        $ref: "#/OpsItemHandle"
      default: []
      description: Items (number or id) this one blocks. Already-linked items are a no-op.
    removeBlocking:
      type: array
      maxItems: 50
      items:
        $ref: "#/OpsItemHandle"
      default: []
      description: Items (number or id) this one should stop blocking. Unlinked items are a no-op.
    duplicateOf:
      anyOf:
        - $ref: "#/OpsItemHandle"
        - type: "null"
      description: Mark this item as a duplicate of another (number or id), replacing any earlier canonical; `null` clears it. Omit to leave it unchanged. While the canonical is still open, the item closes as `wont_fix`; a canonical that is already `resolved`/`wont_fix` leaves the item's status alone.
  additionalProperties: false
  description: "Incremental edit of an item's relations — pass any mix of fields; omitted ones are left as is. A link that would make an item block (or duplicate) itself, directly or through a chain, is rejected with `409`."
ConnectorData:
  type: object
  properties:
    github:
      $ref: "#/GithubConnectorData"
    slack:
      $ref: "#/SlackConnectorData"
  additionalProperties: {}
  description: "Connector linkage for one queue item, keyed by provider. Each provider's driver deep-merges its own trace into this blob, so any subset of providers may be present. Unknown/future providers may appear as additional keys."
GithubConnectorData:
  type: object
  properties:
    issue:
      type: object
      properties:
        number:
          type: number
          description: GitHub issue number.
        url:
          type: string
          description: HTML URL of the opened issue.
        owner:
          type: string
          description: Repository owner (org or user).
        repo:
          type: string
          description: Repository name.
        createdAt:
          type: string
          description: ISO-8601 timestamp the issue was opened.
      required:
        - number
        - url
        - owner
        - repo
      additionalProperties: {}
      description: The GitHub issue this item opened.
    pr:
      $ref: "#/GithubPrLink"
      description: >-
        The item's PRIMARY linked pull request, derived from `prs`: the newest
        still-open one, else the newest merged one, else the newest closed one.
        Kept for readers that show one PR; `prs` is the full list.
    prs:
      type: array
      items:
        $ref: "#/GithubPrLink"
      description: >-
        Every pull request linked to the item, oldest link first — an item can
        legitimately take several PRs (a fix split across repos, a follow-up).
        Absent on items linked before multi-PR support; `pr` then is the only one.
  additionalProperties: {}
  description: "GitHub connector trace — the issue it opened and, once linked, the pull requests."
GithubPrLink:
  type: object
  properties:
    number:
      type: number
      description: Pull request number.
    url:
      type: string
      description: HTML URL of the linked pull request.
    linkedAt:
      type: string
      description: ISO-8601 timestamp the PR was linked.
    connectedToIssue:
      type: boolean
      description: "Whether the PR was wired to the issue on GitHub (via a closing keyword or a comment)."
    method:
      type: string
      enum:
        - closes
        - comment
      description: How the PR was connected to the issue.
    owner:
      type: string
      description: >-
        Repository owner (org or user) the pull request lives in. Absent on
        links recorded before the field existed — `url` still carries it.
    repo:
      type: string
      description: >-
        Repository name the pull request lives in. Absent on links recorded
        before the field existed — `url` still carries it.
    state:
      type: string
      enum:
        - open
        - merged
        - closed
      description: >-
        Outcome of the pull request on GitHub, kept current by the
        `pull_request` webhook. `merged` and `closed` (closed WITHOUT merging,
        i.e. rejected) are terminal. Absent means the outcome has never been
        observed — treat it as `open`.
    mergedAt:
      type: string
      description: ISO-8601 timestamp the pull request merged, when `state` is `merged`.
    closedAt:
      type: string
      description: ISO-8601 timestamp the pull request closed unmerged, when `state` is `closed`.
  required:
    - number
    - url
  additionalProperties: {}
  description: The pull request linked to a queue item via `link-pr` (stored on `connectorData.github.pr`).
SlackConnectorData:
  type: object
  properties:
    message:
      type: object
      properties:
        channel:
          type: string
          description: Slack channel id the message was posted to.
        ts:
          type: string
          description: Slack message timestamp (`ts`) — the message handle used for in-place `chat.update`.
        postedAt:
          type: string
          description: ISO-8601 timestamp the message was posted.
      required:
        - channel
        - ts
      additionalProperties: {}
      description: The Slack message the driver posted for this item.
  additionalProperties: {}
  description: "Slack connector trace — the message the driver posted for this item. The linked pull request is recorded on `github.pr`, not here."
CreateBugRequest:
  type: object
  properties:
    type:
      type: string
      enum:
        - bug
      description: Discriminator — files a bug.
    title:
      type: string
      minLength: 1
      maxLength: 200
      pattern: '^\S(.*\S)?$'
      description: One-line bug title (no leading/trailing whitespace).
    stepsToReproduce:
      type: string
      maxLength: 8000
      default: ""
      description: How to reproduce the bug.
    actualResult:
      type: string
      maxLength: 8000
      default: ""
      description: What actually happened.
    expectedResult:
      type: string
      maxLength: 8000
      default: ""
      description: What was expected instead.
    priority:
      anyOf:
        - $ref: "#/OpsItemPriority"
        - type: "null"
      description: Initial triage priority, or `null`.
    status:
      anyOf:
        - $ref: "#/OpsItemStatus"
      description: Initial lifecycle status; defaults to `open` when omitted.
    assigneeId:
      anyOf:
        - type: string
        - type: "null"
      description: The `users.id` of the person to assign as owner at creation, or `null`.
    delegateConnectorId:
      type: string
      description: >-
        The agent connector the filer chose to delegate this item to at creation.
        When set, the server launches that one agent and skips any tag-rule
        auto-launch, so the filer's choice prevails and only one run starts.
    subscribers:
      type: array
      items:
        type: string
        format: email
      default: []
      description: Emails of teammates to subscribe to this item's Slack pings at creation.
    tags:
      type: array
      maxItems: 50
      items:
        $ref: ./tags.yaml#/TagName
      default: []
      description: >-
        Tag names to label the item with, e.g. `["ios", "checkout"]`. Each name
        is matched case-insensitively against the project's existing tags and
        reuses that tag (keeping its stored casing) when one matches; a name with
        no match creates a new project tag.
    reporterEmail:
      anyOf:
        - type: string
          format: email
        - type: "null"
      description: Email of the reporter, or `null`.
    pageUrl:
      anyOf:
        - type: string
          format: uri
        - type: "null"
      description: URL of the page the bug relates to, or `null`.
    userAgent:
      anyOf:
        - type: string
          maxLength: 500
        - type: "null"
      description: Reporter's user-agent string, or `null`.
    viewport:
      anyOf:
        - type: string
          maxLength: 40
        - type: "null"
      description: Reporter's viewport (e.g. `1280x720`), or `null`.
    context:
      anyOf:
        - type: object
          additionalProperties: {}
        - type: "null"
      description: Arbitrary capture context, or `null`.
    notify:
      anyOf:
        - $ref: ./common.yaml#/NotificationTarget
        - type: "null"
      description: Where this bug's completion notification lands.
    trail:
      type: string
      minLength: 1
      maxLength: 64
      pattern: ^(?:T-[0-9]+|[0-9a-fA-F-]{32,36})$
      description: File the bug on this trail (`T-12` or the trail's id) instead of the open queue. An agent that hits something outside its intent files it here rather than fixing it in place. The item records `discoveredSource` as `agent` (or `person` when a person files it) and the change and push the filer was on.
  required:
    - type
    - title
  additionalProperties: false
  description: "Bug-kind fields for `POST /api/admin/ops` (sent with `type: bug`)."
