        format: email
      default: []
      description: Emails of teammates to subscribe to this item's Slack pings at creation.
    tags:
      type: array
      maxItems: 50
      items:
        $ref: ./tags.yaml#/TagName
      default: []
      description: >-
        Tag names to label the item with, e.g. `["ios", "checkout"]`. Each name
        is matched case-insensitively against the project's existing tags and
        reuses that tag (keeping its stored casing) when one matches; a name with
        no match creates a new project tag. Here the tags only label the
        ticket: the project's tag rules (owner/status/agent routing) are not
        applied to a public report while it awaits approval.
    reporterEmail:
      anyOf:
        - type: string
          format: email
        - type: "null"
      description: Email of the reporter, or `null`.
    pageUrl:
      anyOf:
        - type: string
          format: uri
        - type: "null"
      description: URL of the page the request relates to, or `null`.
    userAgent:
      anyOf:
        - type: string
          maxLength: 500
        - type: "null"
      description: Reporter's user-agent string, or `null`.
    context:
      anyOf:
        - type: object
          additionalProperties: {}
        - type: "null"
      description: Arbitrary capture context, or `null`.
    dedupKey:
      type: string
      maxLength: 200
      description: >-
        Caller-chosen dedupe identity for this request, stored on the ticket.
        Behaves exactly as on `POST /ops/bug`: a repeat carrying the same key
        refreshes the open ticket already holding it (fields overwritten, a
        "re-triggered" comment appended) and returns `deduped: true` with
        `updated: true`, instead of filing a second one.
    notify:
      anyOf:
        - $ref: ./common.yaml#/NotificationTarget
        - type: "null"
      description: Where this request's completion notification lands.
  required:
    - title
  additionalProperties: false
  description: "Body for `POST /ops/feature-request`. The same feature-request fields as `CreateFeatureRequestRequest`, minus the `type` discriminator — the path already says what is being filed, plus the public intake's own `dedupKey`."
CreateOpsItemRequest:
  oneOf:
    - $ref: "#/CreateBugRequest"
    - $ref: "#/CreateFeatureRequestRequest"
  discriminator:
    propertyName: type
    mapping:
      bug: "#/CreateBugRequest"
      feature_request: "#/CreateFeatureRequestRequest"
  description: "Body for `POST /api/admin/ops`. A discriminated union on `type`: `bug` carries the bug fields, `feature_request` the feature fields. Only these two user-fileable types are accepted — `error`, `alert`, and `measure_plan` tickets are auto-filed by the platform and cannot be created over the API."
CreatePublicTicketResponse:
  type: object
  properties:
    id:
      type: string
      description: The new item's id. Absent on a deduped response — nothing was created, so there is no new id to report.
    number:
      type: integer
      description: Per-project item number. On a deduped response this is the number of the OPEN ticket already tracking the report, which is what a caller should show the user either way.
    deduped:
      type: boolean
      description: "`true` when an open ticket already tracked this report and nothing was filed (HTTP 200). Absent on a fresh file (HTTP 201)."
    updated:
      type: boolean
      description: "`true` when the deduped ticket was REFRESHED from this payload and got a \"re-triggered\" comment — only ever set alongside `deduped` on a submission that carried a `dedupKey`. Absent when the existing ticket was returned untouched."
  required:
    - number
  additionalProperties: false
  description: "Response for the public ticket intake. A fresh file returns `201` with `id` + `number`; a repeat of a report already tracked by an open ticket returns `200` with that ticket's `number` and `deduped: true` — plus `updated: true` when a `dedupKey` re-triggered it and its fields were refreshed."
CreateOpsItemResponse:
  type: object
  properties:
    id:
      type: string
      description: Newly created item id.
    number:
      description: Per-project item number assigned to the new item.
      anyOf:
        - type: number
        - type: "null"
  required:
    - id
  additionalProperties: false
  description: Response for `POST /api/admin/ops`.
OpsItemStatus:
  type: string
  enum:
    - open
    - pending_approval
    - investigating_by_ai
    - in_progress
    - blocked
    - ready_for_qa
    - resolved
    - wont_fix
  description: >-
    Lifecycle status of a queue item. The working flow is `open` →
    `in_progress` → `ready_for_qa` → `resolved` (or `wont_fix`, terminal from
    any earlier stage). `blocked` marks an item that can't progress until an
    external dependency clears — a working state a human sets and clears.
    `ready_for_qa` is what a developer sets once a fix
    lands; `resolved` is the QA sign-off, normally flipped in the dashboard
    after verification — set it directly from code only when the fix has been
    verified end-to-end. `investigating_by_ai` is a system-owned display state —
    set when the AI agent (Jarvis) picks an item up to investigate, never chosen
    by a human — so it is shown but not offered as a manual choice.
    `pending_approval` is the one human-gated holding state: it parks an item
    OUT of the work queue until a human promotes it to `open` in the dashboard,
    so `GET /api/admin/ops` excludes it under `status=all`/default and returns
    it only when requested as an exact `status`. It covers untriaged inbound
    that must never be auto-implemented — connector requests filed from a
    customer's connectors panel, and questions funnelled in from the "Stuck in
    onboarding?" assistant — where approving means flipping the status to
    `open`. Two earlier values were removed in favour of this single gate:
    `triage` (the onboarding-help bucket, now `pending_approval`) and `triaged`
    (a redundant "looked at but not started" step, now plain `open`).
OpsItemPriority:
  type: string
  enum:
    - nice_to_have
    - medium
    - high
    - critical
  description: >-
    Triage priority of a queue item. The lowest tier is `nice_to_have` (not
    `low`) — carried over from the feature-request "importance" scale this
    priority set replaced.
OpsInvestigationState:
  type: string
  enum:
    - pr_ready
    - pr_merged
    - pr_closed
    - investigated
    - detected
    - question
    - ready_for_qa
    - pending_approval
    - working
    - backlog
  description: >-
    Where automation has taken an item in the investigation lifecycle — the
    signal the ops cockpit renders as "what AI did" plus the one action expected
    of the user. It is **written as a side-effect of the actions that already
    happen**, never authored on its own: linking a PR sets `pr_ready`, moving to
    `in_progress` sets `working`, `ready_for_qa` sets `ready_for_qa`, a
    system/assistant reply sets `question`, resolving clears it, and creation
    seeds `backlog` for every untouched item (bugs, features, and auto-filed
    error/alert tickets alike — type is not a signal). `backlog` is the single
    "nothing has happened yet" state — how urgent that is reads off `priority`,
    not off a separate state, and its one action is to hand the item to an
    agent. `investigated`/`detected` are set when a completed agent run leaves
    findings to review, not at filing time. `pr_merged` and `pr_closed` are
    written by the GitHub `pull_request` webhook when the linked PR reaches a
    terminal outcome — merged (the fix shipped, resolve the item) or closed
    without merging (the fix was rejected, decide what happens next). Absent on
    rows filed before the field existed — consumers should treat a missing
    value as "derive from the other fields".
OpsItemPriorityOrNull:
  anyOf:
    - $ref: "#/OpsItemPriority"
    - type: "null"
  description: Triage priority, or `null` when not set (in an update, `null` clears it).
OpsItemNotifyOrNull:
  anyOf:
    - $ref: ./common.yaml#/NotificationTarget
    - type: "null"
  description: Where this item's completion notification lands, or `null`.
OpsRunAction:
  type: string
  enum:
    - link_pr
    - notify
    - status
    - superseded
  description: >-
    The final action that closed a run record — `link_pr`/`notify` are the
    agent's terminal ops actions, `status` a completion status flip
    (ready_for_qa/resolved), `superseded` a newer ack replacing an open run.
OpsRunActionOrNull:
  anyOf:
    - $ref: "#/OpsRunAction"
    - type: "null"
  description: Which final action closed the run, or `null` while it is open (or a non-run record).
UpdateOpsItemStatusRequest:
  type: object
  properties:
    status:
      $ref: "#/OpsItemStatus"
    priority:
      $ref: "#/OpsItemPriorityOrNull"
    notify:
      $ref: "#/OpsItemNotifyOrNull"
  additionalProperties: false
  description: "Triage-only update — the shape accepted for any item, and the ONLY shape for auto-filed `error`/`alert`/`measure_plan` tickets (their content is not user-editable)."
UpdateBugRequest:
  type: object
  properties:
    title:
      type: string
      minLength: 1
      maxLength: 200
      pattern: '^\S(.*\S)?$'
      description: New bug title (no leading/trailing whitespace).
    stepsToReproduce:
      type: string
      maxLength: 8000
      description: Updated reproduction steps.
    actualResult:
      type: string
      maxLength: 8000
      description: Updated actual result.
    expectedResult:
      type: string
      maxLength: 8000
      description: Updated expected result.
    status:
      $ref: "#/OpsItemStatus"
    priority:
      $ref: "#/OpsItemPriorityOrNull"
    githubPrNumber:
      anyOf:
        - type: integer
          minimum: 1
        - type: "null"
      description: Link (or, when `null`, unlink) a GitHub pull request to this bug.
    notify:
      $ref: "#/OpsItemNotifyOrNull"
  additionalProperties: false
  description: "Content + triage update for a `bug` item (`PATCH /api/admin/ops/{handle}` when the item is a bug)."
UpdateFeatureRequestRequest:
  type: object
  properties:
    title:
      type: string
      minLength: 1
      maxLength: 200
      pattern: '^\S(.*\S)?$'
      description: New feature-request title (no leading/trailing whitespace).
    description:
      type: string
      maxLength: 8000
      description: Updated description.
    useCase:
      type: string
      maxLength: 8000
      description: Updated use case.
    status:
      $ref: "#/OpsItemStatus"
    priority:
      $ref: "#/OpsItemPriorityOrNull"
    githubPrNumber:
      anyOf:
        - type: integer
          minimum: 1
        - type: "null"
      description: Link (or, when `null`, unlink) a GitHub pull request to this request.
    notify:
      $ref: "#/OpsItemNotifyOrNull"
  additionalProperties: false
  description: "Content + triage update for a `feature_request` item (`PATCH /api/admin/ops/{handle}` when the item is a feature request)."
UpdateOpsItemRequest:
  anyOf:
    - $ref: "#/UpdateBugRequest"
    - $ref: "#/UpdateFeatureRequestRequest"
    - $ref: "#/UpdateOpsItemStatusRequest"
  description: "Body for `PATCH /api/admin/ops/{handle}`. The body is type-less — the server validates it against the stored item's type: a `bug` accepts the bug content fields, a `feature_request` the feature fields, and `error`/`alert`/`measure_plan` only `status`/`priority`/`notify`. Pass at least one field."
UpdateOpsItemResponse:
  type: object
  properties:
    id:
      type: string
      description: Item id that was updated.
  required:
    - id
  additionalProperties: false
  description: Response for the update / link-pr endpoints.
LinkPrToOpsItemRequest:
  type: object
  properties:
    prNumber:
      anyOf:
        - type: integer
          exclusiveMinimum: 0
          maximum: 9007199254740991
        - type: "null"
      description: >-
        PR number to ADD to the item's linked PRs (re-linking one already linked
        is a no-op). `null` unlinks EVERY PR on the item.
    prUrl:
      description: Explicit PR URL. Required for error/alert tickets (no GitHub issue to derive the URL from).
      type: string
      format: uri
    unlink:
      type: boolean
      default: false
      description: Remove just this PR (`prNumber`, or `prUrl` when given) from the item instead of adding it.
  required:
    - prNumber
  additionalProperties: false
  description: Body for `POST /api/admin/ops/{handle}/link-pr`.
LinkPrToOpsItemResponse:
  type: object
  properties:
    id:
      type: string
      description: Item id that was updated.
    pr:
      anyOf:
        - $ref: "#/GithubPrLink"
        - type: "null"
      description: "The item's primary PR link after the write (`connectorData.github.pr`), or `null` when no PR is linked any more."
    prs:
      type: array
      items:
        $ref: "#/GithubPrLink"
      description: Every PR now linked to the item (`connectorData.github.prs`), oldest first.
  required:
    - id
    - pr
    - prs
  additionalProperties: false
  description: Response for `POST /api/admin/ops/{handle}/link-pr` — the item id and the resulting PR link.
AckOpsItemRequest:
  type: object
  properties:
    agent:
      type: string
      enum:
        - claude
        - cursor
        - copilot
        - jules
        - gemini
        - jarvis
      description: >-
        The AI agent type acking on the item's behalf — pass your own type when
        you are a coding agent (Claude Code passes `claude`, Cursor `cursor`,
        Copilot `copilot`, Jules `jules`, Gemini `gemini` → normalized to `jules`). Omit entirely for a human ack
        by the authenticated caller.
    sessionId:
      type: string
      maxLength: 300
      description: >-
        The agent-run session id (e.g. Claude's `session_01…`), so the dashboard
        can deep-link to the exact run page. Omit when the harness has no
        session id.
    launch:
      type: boolean
      default: true
      description: >-
        Whether an AI ack may FIRE the agent's connected trigger. Default
        `true`: an ack naming a connected agent, with no `sessionId`, starts a
        new provider run of that agent. Pass `false` to only record the ack —
        claim the item and open the run record — without starting anything,
        e.g. when you ARE that agent working the item yourself and have no
        session id to pass. Ignored on a human ack.
    runId:
      type: string
      maxLength: 100
      description: >-
        The run you were handed — the investigation id a fired run's prompt
        names, or the `runId` an earlier ack returned. Proves the open run is
        yours, so the ack adopts it instead of answering `409` `ALREADY_EXISTS`.
    takeover:
      type: boolean
      default: false
      description: >-
        Replace another session's LIVE run on the item instead of being refused
        with `409` `ALREADY_EXISTS`. Only when you were asked to replace that
        session — two sessions on one item each open their own PR.
  additionalProperties: false
  description: >-
    Body for `POST /api/admin/ops/{handle}/ack`. With `agent` set this is an AI
    ack — the named agent type must have a connected trigger connector in the
    project, or the call fails with `AGENT_NOT_CONNECTED` and instructions to
    query the available agents (`ops agents list`). `gemini` is accepted as an input value and is
    normalized to `jules`. Without `agent` it is a HUMAN ack by the authenticated
    caller.
AckOpsItemResponse:
  type: object
  properties:
    id:
      type: string
      description: Item id that was acked.
    number:
      anyOf:
        - type: number
        - type: "null"
      description: Per-project item number.
    status:
      type: string
      description: The working status the ack moved the item into (`investigating_by_ai` for an AI ack, `in_progress` for a human one).
    runId:
      type: string
      description: Id of the run record the ack opened.
    agent:
      anyOf:
        - type: string
        - type: "null"
      description: The AI agent type working the item; `null` for a human ack.
    connectorName:
      anyOf:
        - type: string
        - type: "null"
      description: Display name of the connected agent (the connector's name); `null` for a human ack.
    sessionId:
      anyOf:
        - type: string
        - type: "null"
      description: The session id recorded on the run, if one was supplied.
    startedAt:
      type: string
      description: ISO-8601 timestamp the run started (the ack time).
  required:
    - id
    - number
    - status
    - runId
    - agent
    - connectorName
    - sessionId
    - startedAt
  additionalProperties: false
  description: Response for `POST /api/admin/ops/{handle}/ack` — the opened run.
OpsAgentProfile:
  type: object
  properties:
    connectorId:
      type: string
      description: The connector row id — what an agent assignment stores.
    provider:
      type: string
      enum:
        - claude_trigger
        - cursor_trigger
        - copilot_trigger
        - jules_trigger
      description: The trigger-connector provider backing this agent.
    name:
      type: string
      description: Display name — the connector's `name`, or the provider default (e.g. "Claude").
    handle:
      type: string
      description: Mention/search handle — the kebab-cased name (e.g. `claude`).
  required:
    - connectorId
    - provider
    - name
    - handle
  additionalProperties: false
  description: One connected, assignable AI agent (an authenticated trigger connector).
ListOpsAgentsResponse:
  type: array
  items:
    $ref: "#/OpsAgentProfile"
  description: >-
    The project's connected AI agents — the agent types `POST
    /api/admin/ops/{handle}/ack` accepts. Empty when no trigger connector is
    connected yet.
OpsCommentAuthorType:
  type: string
  enum:
    - user
    - system
  description: >-
    Who wrote a comment. `user` is a teammate (their email is in `authorEmail`);
    `system` is Jarvis — the AI agent — which authors comments when an ops-notify
    escalation lands on the item and when it is `@shipeasy`-mentioned in a thread.
OpsActivityField:
  type: string
  enum:
    - status
    - priority
    - owner
    - tags
    - ack
    - pr
    - comment
    - edit
  description: >-
    Which kind of change an activity entry records. `pr` is a pull-request event
    (see `pr.event`); `comment` carries an excerpt in `to`; `edit` names the
    edited content fields in `added`.
OpsActivityPr:
  type: object
  properties:
    event:
      type: string
      enum:
        - linked
        - unlinked
        - merged
        - closed
      description: What happened to the pull request. `closed` means closed WITHOUT merging.
    number:
      type: integer
      description: PR number within its repository.
    url:
      anyOf:
        - type: string
        - type: "null"
      description: The pull request's URL, when known.
    repo:
      anyOf:
        - type: string
        - type: "null"
      description: "`owner/repo` the pull request lives in, when known."
    title:
      anyOf:
        - type: string
        - type: "null"
      description: The pull request's title, when GitHub was reachable.
    author:
      anyOf:
        - type: string
        - type: "null"
      description: The pull request's GitHub author, when known.
  required:
    - event
    - number
    - url
    - repo
    - title
    - author
  additionalProperties: false
  description: The pull request a `pr` activity entry is about.
OpsActivityEntry:
  type: object
  properties:
    id:
      type: string
      description: Activity entry id.
    at:
      type: string
      description: ISO-8601 timestamp of the change.
    itemId:
      type: string
      description: The queue item the change belongs to.
    itemNumber:
      anyOf:
        - type: integer
        - type: "null"
      description: The item's per-project number.
    itemTitle:
      type: string
      description: The item's title.
    actor:
      type: string
      description: Who made the change — a teammate email, a key's actor, or `github` for a PR outcome the webhook observed.
    actorType:
      type: string
      description: "`user`, `cli` or `system`."
    via:
      anyOf:
        - type: string
        - type: "null"
      description: The door the change came through (`dashboard`, `cli`, `mcp`, …).
    viaAgent:
      anyOf:
        - type: string
        - type: "null"
      description: The AI agent that drove the change, when one did.
    field:
      $ref: "#/OpsActivityField"
    from:
      anyOf:
        - type: string
        - type: "null"
      description: The previous value of a scalar field.
    to:
      anyOf:
        - type: string
        - type: "null"
      description: The new value of a scalar field, or a comment excerpt.
    added:
      type: array
      items:
        type: string
      description: Tags added, or the content fields edited.
    removed:
      type: array
      items:
        type: string
      description: Tags removed.
    pr:
      anyOf:
        - $ref: "#/OpsActivityPr"
        - type: "null"
      description: The pull-request event, for `pr` entries; `null` otherwise.
  required:
    - id
    - at
    - itemId
    - itemNumber
    - itemTitle
    - actor
    - actorType
    - via
    - viaAgent
    - field
    - from
    - to
    - added
    - removed
    - pr
  additionalProperties: false
  description: One change recorded against a queue item.
ListOpsActivityResponse:
  type: object
  properties:
    activity:
      type: array
      items:
        $ref: "#/OpsActivityEntry"
  required:
    - activity
  additionalProperties: false
  description: Response for `GET /api/admin/ops/activity` — newest first.
OpsComment:
  type: object
  properties:
    id:
      type: string
      description: Comment id.
    feedbackId:
      type: string
      description: The queue item this comment hangs off.
    parentId:
      anyOf:
        - type: string
        - type: "null"
      description: The top-level comment this is a reply to, or `null` for a top-level comment.
    authorType:
      $ref: "#/OpsCommentAuthorType"
    authorEmail:
      anyOf:
        - type: string
        - type: "null"
      description: The teammate who wrote it, or `null` for a `system` (Jarvis) comment.
    body:
      type: string
      description: Comment body as markdown (may contain sanitised inline image/video embeds).
    createdAt:
      type: string
      description: ISO-8601 creation timestamp.
    updatedAt:
      type: string
      description: ISO-8601 last-edit timestamp.
  required:
    - id
    - feedbackId
    - parentId
    - authorType
    - authorEmail
    - body
    - createdAt
    - updatedAt
  additionalProperties: false
  description: A single comment on a queue item.
ListOpsCommentsResponse:
  type: object
  properties:
    comments:
      type: array
      items:
        $ref: "#/OpsComment"
  required:
    - comments
  additionalProperties: false
  description: Response for `GET /api/admin/ops/{handle}/comments` — the thread, oldest first.
CreateOpsCommentRequest:
  type: object
  properties:
    body:
      type: string
      minLength: 1
      maxLength: 10000
      description: The comment body as markdown. Mentions (`@teammate`, `@shipeasy`) are parsed from it.
    parentId:
      anyOf:
        - type: string
        - type: "null"
      description: >-
        Reply under this top-level comment. Omit / `null` for a top-level
        comment. Replying to a reply attaches to the same top-level parent
        (threading is one level deep).
  required:
    - body
  additionalProperties: false
  description: Body for `POST /api/admin/ops/{handle}/comments`.
CreateOpsCommentResponse:
  type: object
  properties:
    id:
      type: string
      description: Newly created comment id.
  required:
    - id
  additionalProperties: false
  description: Response for `POST /api/admin/ops/{handle}/comments`.
CreateOpsAttachmentRequest:
  type: object
  properties:
    contentBase64:
      type: string
      description: The file bytes, base64-encoded (a bare string or a `data:<mime>;base64,` URI). Pass this or `url`, not both.
    url:
      type: string
      format: uri
      description: A public https URL for the server to fetch the file from (no IP literals or internal hosts; max 25 MiB). Pass this or `contentBase64`, not both.
    filename:
      type: string
      description: File name, e.g. `checkout-overflow.png`. Defaults to the last segment of `url`, else `file`.
    mimeType:
      type: string
      description: Media type, e.g. `image/png`. Defaults from the data URI, the fetched response, or the filename extension.
    kind:
      type: string
      enum:
        - screenshot
        - recording
        - file
      description: Attachment kind. Defaults from the media type (image → screenshot, video → recording, else file). Ignored by the comment-media upload.
  additionalProperties: false
  description: Body for `POST /api/admin/ops/{handle}/attachments` and `POST /api/admin/ops/{handle}/comment-media`. Exactly one of `contentBase64` / `url` is required.
CreateOpsAttachmentResponse:
  type: object
  properties:
    id:
      type: string
      description: Newly created attachment id.
    filename:
      type: string
    kind:
      type: string
      enum:
        - screenshot
        - recording
        - file
    mimeType:
      type: string
    sizeBytes:
      type: integer
  required:
    - id
    - filename
    - kind
    - mimeType
    - sizeBytes
  additionalProperties: false
  description: Response for `POST /api/admin/ops/{handle}/attachments`.
CreateOpsCommentMediaResponse:
  type: object
  properties:
    id:
      type: string
      description: Newly created media id.
    url:
      type: string
      description: Relative URL to embed in a comment body as a markdown image.
    mimeType:
      type: string
    sizeBytes:
      type: integer
  required:
    - id
    - url
    - mimeType
    - sizeBytes
  additionalProperties: false
  description: Response for `POST /api/admin/ops/{handle}/comment-media`.
NotifyOpsRequest:
  type: object
  properties:
    title:
      type: string
      minLength: 1
      maxLength: 200
      description: One-line headline of what's blocked.
    summary:
      type: string
      minLength: 1
      maxLength: 280
      description: "One sentence: why it can't be fixed in code. Renders markdown."
    steps:
      description: Ordered steps the human should take to unblock — self-contained (the human reads only this card, not the agent's transcript), 3–6 steps, each naming the exact file, command, env var, or dashboard page. Renders markdown.
      type: array
      items:
        type: string
    href:
      description: Dashboard-relative deep link to the related item. `null` is accepted and treated as "no link".
      anyOf:
        - type: string
        - type: "null"
    dedupeKey:
      description: Stable per-escalation key (e.g. `feedback:7`) so re-runs dedupe to one row.
      type: string
  required:
    - title
    - summary
  additionalProperties: false
  description: >-
    Body for `POST /api/admin/notifications`. In `title`, `summary`, and each
    step, reference admin entities inline with tokens — `#42` (feedback item),
    `@gate:<name>` (alias `@flag:`), `@experiment:<name>` (`@exp:`),
    `@config:<name>`, `@killswitch:<name>` (`@ks:`), `@metric:<name>`,
    `@universe:<name>`, `@alert:<name>` — where `<name>` is the entity's
    immutable name/slug (e.g. `features.checkout`). The dashboard renders each
    token as a live hover chip deep-linking to the entity; tokens degrade to
    plain text elsewhere, so they're always safe to use.
NotifyOpsResponse:
