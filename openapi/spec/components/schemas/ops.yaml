CreatePublicBugRequest:
  type: object
  properties:
    title:
      type: string
      minLength: 1
      maxLength: 200
      pattern: '^\S(.*\S)?$'
      description: One-line bug title (no leading/trailing whitespace).
    stepsToReproduce:
      type: string
      maxLength: 8000
      default: ""
      description: How to reproduce the bug.
    actualResult:
      type: string
      maxLength: 8000
      default: ""
      description: What actually happened.
    expectedResult:
      type: string
      maxLength: 8000
      default: ""
      description: What was expected instead.
    priority:
      anyOf:
        - $ref: "#/OpsItemPriority"
        - type: "null"
      description: Initial triage priority, or `null`.
    status:
      anyOf:
        - $ref: "#/OpsItemStatus"
      description: Initial lifecycle status; defaults to `open` when omitted.
    assigneeId:
      anyOf:
        - type: string
        - type: "null"
      description: The `users.id` of the person to assign as owner at creation, or `null`.
    subscribers:
      type: array
      items:
        type: string
        format: email
      default: []
      description: Emails of teammates to subscribe to this item's Slack pings at creation.
    tags:
      type: array
      maxItems: 50
      items:
        $ref: ./tags.yaml#/TagName
      default: []
      description: >-
        Tag names to label the item with, e.g. `["ios", "checkout"]`. Each name
        is matched case-insensitively against the project's existing tags and
        reuses that tag (keeping its stored casing) when one matches; a name with
        no match creates a new project tag. Here the tags only label the
        ticket: the project's tag rules (owner/status/agent routing) are not
        applied to a public report while it awaits approval.
    reporterEmail:
      anyOf:
        - type: string
          format: email
        - type: "null"
      description: Email of the reporter, or `null`.
    pageUrl:
      anyOf:
        - type: string
          format: uri
        - type: "null"
      description: URL of the page the bug relates to, or `null`.
    userAgent:
      anyOf:
        - type: string
          maxLength: 500
        - type: "null"
      description: Reporter's user-agent string, or `null`.
    viewport:
      anyOf:
        - type: string
          maxLength: 40
        - type: "null"
      description: Reporter's viewport (e.g. `1280x720`), or `null`.
    context:
      anyOf:
        - type: object
          additionalProperties: {}
        - type: "null"
      description: Arbitrary capture context, or `null`.
    dedupKey:
      type: string
      maxLength: 200
      description: >-
        Caller-chosen dedupe identity for this report, stored on the ticket. A
        repeat submission carrying the same key does NOT file a second ticket:
        the open ticket already holding that key is refreshed from this payload
        (title and the report fields overwritten, a "re-triggered" comment
        appended) and returned with `deduped: true` and `updated: true`. Triage
        state a human owns — status, priority, assignee, tags — is left
        untouched, and a `resolved`/`wont_fix` ticket no longer holds the key, so
        a failure that comes back after being closed files a fresh ticket. Omit
        it to fall back to the derived (title + `context.step`) dedupe, whose
        repeats return the existing ticket unchanged.
    notify:
      anyOf:
        - $ref: ./common.yaml#/NotificationTarget
        - type: "null"
      description: Where this bug's completion notification lands.
  required:
    - title
  additionalProperties: false
  description: "Body for `POST /ops/bug`. The same bug fields as `CreateBugRequest`, minus the `type` discriminator — the path already says what is being filed, plus the public intake's own `dedupKey`."
