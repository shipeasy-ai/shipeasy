        - copilot
        - jules
      description: The agent type asking — pass your own type when you are a coding agent. Omitted, the question is attributed to the caller's identity.
  required:
    - question
  additionalProperties: false
  description: "Body for `POST /api/admin/ops/{handle}/qa-questions`."
AnswerOpsQaQuestionRequest:
  type: object
  properties:
    answer:
      type: string
      minLength: 1
      maxLength: 10000
      description: QA's answer (markdown).
    agent:
      type: string
      enum:
        - jarvis
        - claude
        - cursor
        - copilot
        - jules
      description: The agent type answering — pass your own type when you are QA automation. Omitted, the answer is attributed to the caller's identity.
  required:
    - answer
  additionalProperties: false
  description: "Body for `POST /api/admin/ops/{handle}/qa-questions/{questionId}/answer`."
ListOpsQaQuestionsResponse:
  type: array
  items:
    $ref: "#/OpsQaQuestion"
  description: Response for `GET /api/admin/ops/{handle}/qa-questions` — the item's QA questions, newest first (max 100).
NotificationFeedItem:
  type: object
  properties:
    id:
      type: string
      description: Notification id (pass to the mark-read `POST` to mark just this one).
    event:
      type: string
      description: The notification's event key (e.g. `ops.attention`, `feedback.completed`, `comment.mention`).
    title:
      type: string
      description: One-line headline.
    body:
      type: string
      description: "Notification body. For `ops.attention` escalations: line 1 = summary, following lines = numbered unblock steps."
    href:
      anyOf:
        - type: string
        - type: "null"
      description: Dashboard-relative deep link to the related item, or `null`.
    createdAt:
      type: string
      description: ISO-8601 creation timestamp.
    read:
      type: boolean
      description: Whether the notification has been marked read.
  required:
    - id
    - event
    - title
    - body
    - href
    - createdAt
    - read
  additionalProperties: false
  description: One in-app notification as the bell feed renders it.
ListNotificationFeedResponse:
  type: object
  properties:
    notifications:
      type: array
      items:
        $ref: "#/NotificationFeedItem"
      description: The feed, newest first (max 30). Project-wide broadcasts plus notifications addressed to the caller; events muted for the in-app channel are omitted.
    unread:
      type: integer
      description: Count of the caller's unread (visible, unmuted) notifications.
  required:
    - notifications
    - unread
  additionalProperties: false
  description: Response for `GET /api/admin/notifications/feed` — the bell feed plus its unread badge count.
MarkNotificationsReadRequest:
  type: object
  properties:
    id:
      type: string
      description: Mark just this notification read. Omit to mark the caller's whole feed read.
  additionalProperties: false
  description: "Body for `POST /api/admin/notifications/feed`. An empty body (`{}`) marks ALL of the caller's notifications read."
OpsRoutingRuleType:
  type: string
  enum:
    - error
    - alert
    - bug
    - feature_request
  description: A ticket type a tag rule can also fire on. Error and alert tickets carry no tags, so a rule that should catch them matches on type.
OpsRoutingRule:
  type: object
  description: >-
    One tag automation rule. A rule fires on a newly filed queue item that
    carries ANY of its `tags` (or whose `type` is in `types`) and applies its
    actions — assign a person, hand the item to a connected coding agent
    (which launches a run), set a status or priority, and subscribe emails.
    Rules are evaluated in order; each action is optional but a rule needs at
    least one.
  properties:
    tags:
      type: array
      items:
        type: string
        minLength: 1
        maxLength: 64
      maxItems: 20
      description: Tag names the rule matches (case-insensitive). Tags are created on first use.
    types:
      type: array
      items:
        $ref: "#/OpsRoutingRuleType"
      maxItems: 4
      description: Ticket types the rule also fires on. A rule needs at least one tag or type.
    enabled:
      type: boolean
      description: Whether the rule is live. Defaults to `true` on create.
    user:
      anyOf:
        - type: string
          minLength: 1
          maxLength: 128
        - type: "null"
      description: Person to assign — a user id. `null` leaves the owner alone.
    connector:
      anyOf:
        - type: string
          minLength: 1
          maxLength: 128
        - type: "null"
      description: Connected coding agent to hand the item to — a connector id from `ops agents list`. Launches a run when the rule fires.
    agentPrompt:
      anyOf:
        - type: string
          maxLength: 4000
        - type: "null"
      description: Steering prompt for the launched agent. Only kept alongside a `connector`.
    status:
      anyOf:
        - $ref: "#/OpsItemStatus"
        - type: "null"
      description: Status to set on a matching item.
    priority:
      $ref: "#/OpsItemPriorityOrNull"
    subscribers:
      type: array
      items:
        type: string
        format: email
      maxItems: 20
      description: Emails notified about matching items.
    skipApproval:
      type: boolean
      description: A public-intake ticket this rule matches skips `pending_approval` and runs the rule on filing, instead of waiting for a human to approve it.
    triage:
      type: boolean
      description: While a matching public-intake ticket waits in `pending_approval`, the rule's agent safety-triages it and tags it from the central triage set. Needs a `connector`; always `false` alongside `skipApproval`.
    triageAgent:
      anyOf:
        - type: string
        - type: "null"
      description: Who does the triage — `null` means the rule's own `connector`, `jarvis` (Enterprise), or a connector id. Only meaningful with `triage`.
    triageAutoApprove:
      type: boolean
      description: With `triage`, approve the ticket automatically when the agent tags it safe and nothing else. Off means a human still approves.
  required:
    - tags
    - types
    - enabled
    - user
    - connector
    - agentPrompt
    - status
    - priority
    - subscribers
    - skipApproval
    - triage
    - triageAgent
    - triageAutoApprove
  additionalProperties: false
ListOpsRoutingRulesResponse:
  type: array
  items:
    $ref: "#/OpsRoutingRule"
CreateOpsRoutingRuleRequest:
  type: object
  description: >-
    Appends one tag automation rule after the existing ones; the existing rules
    are untouched. Needs at least one of `tags` / `types` and at least one
    action (`user`, `connector`, `status`, `priority` or `subscribers`).
  properties:
    tags:
      type: array
      items:
        type: string
        minLength: 1
        maxLength: 64
      maxItems: 20
      description: Tag names the rule matches (case-insensitive). Tags are created on first use.
    types:
      type: array
      items:
        $ref: "#/OpsRoutingRuleType"
      maxItems: 4
      description: Ticket types the rule also fires on.
    enabled:
      type: boolean
      description: Whether the rule is live. Defaults to `true`.
    user:
      type: string
      minLength: 1
      maxLength: 128
      description: Person to assign — a user id.
    connector:
      type: string
      minLength: 1
      maxLength: 128
      description: Connected coding agent to hand the item to — a connector id from `ops agents list`.
    agentPrompt:
      type: string
      maxLength: 4000
      description: Steering prompt for the launched agent. Only kept alongside a `connector`.
    status:
      $ref: "#/OpsItemStatus"
    priority:
      $ref: "#/OpsItemPriority"
    subscribers:
      type: array
      items:
        type: string
        format: email
      maxItems: 20
      description: Emails notified about matching items.
    skipApproval:
      type: boolean
      description: Let a matching public-intake ticket skip `pending_approval`. Defaults to `false`.
  additionalProperties: false
OpsMemoryKind:
  type: string
  enum:
    - shipped
    - declined
    - decision
    - qa
    - outcome
  description: >-
    What a project-memory entry records. `shipped` — an item that reached
    `ready_for_qa`/`resolved`: what was asked, what the run found, the files it
    touched, the PR. `declined` — an item closed `wont_fix`: the request and
    why it was turned down. `decision` — an answered structured question: what
    the team picked. `qa` — a QA note or an answered QA question: what "fixed"
    turned out to mean, or what QA found failing. `outcome` — what a trail's
    plan achieved against its goal metric: what was tried, the reading, met or
    missed. A trail's own `decision` entries are its answered questions and its
    approved plan revisions.
OpsMemoryEntry:
  type: object
  properties:
    id:
      type: string
      description: Memory entry id.
    kind:
      $ref: "#/OpsMemoryKind"
    title:
      type: string
      description: One-line headline of the fact.
    body:
      type: string
      description: Compact markdown — the fact itself, capped so a read stays token-light. `ops get` on the item has the full record.
    paths:
      type: array
      items:
        type: string
      description: Repo-relative files the item's runs inspected or changed.
    prUrl:
      anyOf:
        - type: string
        - type: "null"
      description: The pull request that shipped it, when one was linked.
    item:
      anyOf:
        - $ref: "#/OpsItemRef"
        - type: "null"
      description: The queue item the entry came from, or `null` for a trail's own entry.
    trail:
      anyOf:
        - $ref: "#/TrailSummary"
        - type: "null"
      description: The trail the entry came from (its decisions and goal outcomes), or `null` for an item's entry. Exactly one of `item` and `trail` is set.
    occurredAt:
      type: string
      description: ISO-8601 time the fact happened (shipped, answered, noted).
    score:
      type: number
      description: Relevance to the query (higher is closer). `0` when the read had no query — entries are then newest first.
  required:
    - id
    - kind
    - title
    - body
    - paths
    - prUrl
    - item
    - trail
    - occurredAt
    - score
  additionalProperties: false
  description: One fact the project learned from a shipped (or declined) ticket, or from a trail's decisions and outcome.
ListOpsMemoryResponse:
  type: object
  properties:
    entries:
      type: array
      items:
        $ref: "#/OpsMemoryEntry"
      description: Matching entries, most relevant first.
    terms:
      type: array
      items:
        type: string
      description: The search terms the query was reduced to (stop-words and short words dropped). Empty when no `q` or `item` was given.
  required:
    - entries
    - terms
  additionalProperties: false
  description: Response for `GET /api/admin/ops/memory`.
TrailAgentValueType:
  type: string
  enum:
    - score
    - boolean
  description: "How a review agent's value reads — a `score` from 0 to 100, or a `boolean` signal submitted as 1 (yes) or 0 (no)."
TrailAgentPolarity:
  type: string
  enum:
    - higher_is_better
    - lower_is_better
  description: "Which direction is good. Confidence is `higher_is_better`; risk is `lower_is_better`. For a `boolean` agent, `lower_is_better` means a 1 (yes, an issue was found) fails."
TrailAgentTrigger:
  type: string
  enum:
    - push
    - manual
  description: "When a review agent runs — on every `push` to a trail's linked pull request, or only when a review is requested (`manual`)."
TrailEvalStatus:
  type: string
  enum:
    - pending
    - complete
    - failed
  description: "Where one eval stands — `pending` (its agent was launched and has not submitted), `complete`, or `failed` (the launch did not go through)."
TrailEvalVerdict:
  type: string
  enum:
    - pass
    - warn
    - fail
  description: "An eval's value against its agent's threshold — `pass` (green), `warn` (orange: passing, but within 10 points of the threshold), `fail` (red)."
TrailFindingSeverity:
  type: string
  enum:
    - high
    - medium
    - low
  description: How much a finding matters. The Agent review gate blocks on open findings at or above its configured severity.
TrailFindingStatus:
  type: string
  enum:
    - open
    - resolved
    - dismissed
  description: "A finding stays `open` until it is `resolved` (fixed) or `dismissed` (not a problem). A finding raised on an earlier push is reported `stale` but stays open until somebody decides."
TrailPhase:
  type: string
  enum:
    - planning
    - building
    - reviewing
    - ready
    - releasing
    - shipped
    - closed
  description: "Where a trail is, derived from its changes and its release resources — `planning` (no change and no open run), `building` (no change yet, a run is working), `reviewing` (a change is open and not every open change can merge), `ready` (every open change can merge), `releasing` (merged, and a flag, experiment or other release resource has not settled), `shipped` (merged and every release resource settled), `closed` (closed with nothing merged). The detail read recomputes it live; the list reads a snapshot."
TrailGateKey:
  type: string
  enum:
    - up_to_date
    - human_review
    - agent_review
    - evals
    - checks
    - discovered
    - ships_dark
    - rollback
    - measured
    - guarded
    - copy
    - plan
  description: "A merge gate — `plan` (every release resource the approved plan lists exists on the trail), `up_to_date` (the branch is current with its base), `human_review` (enough approvals), `agent_review` (no open findings at or above the severity, and no push agent still reviewing), `evals` (every blocking review agent passes on the latest push), `checks` (CI checks pass), `discovered` (no item discovered on the trail is open at or above the configured priority), and the release gates `ships_dark` (every flag the trail ships behind is off in prod), `rollback` (a feature has a rollback kill switch), `measured` (a feature has an experiment or metric), `guarded` (every measured resource has a guard alert rule) and `copy` (every copy key exists in every published locale)."
TrailGateStatus:
  type: string
  enum:
    - pass
    - pending
    - fail
  description: How a gate reads on a change right now.
TrailGateToggle:
  type: object
  properties:
    enabled:
      type: boolean
      description: Whether the gate is evaluated at all.
    blocking:
      type: boolean
      description: Whether a failing gate blocks the merge (a non-blocking gate only reports).
  required:
    - enabled
    - blocking
  additionalProperties: false
TrailGates:
  type: object
  description: A project's merge and release gates for trails. Every project starts on the defaults shown in the example; the release gates, `discovered` and the per-repo overrides are all off until turned on. Send the whole object — fields you omit take their defaults.
  properties:
    upToDate:
      $ref: "#/TrailGateToggle"
    humanReview:
      type: object
      properties:
        enabled:
          type: boolean
        blocking:
          type: boolean
        minApprovals:
          type: integer
          minimum: 1
          maximum: 10
          description: Approvals a change needs.
        resetOnPush:
          type: boolean
          description: Whether a new push clears earlier approvals, so the latest code is what gets approved.
        authorCanApprove:
          type: boolean
          default: false
          description: Whether the trail's owner, and whoever started its runs, count as approvers. Off by default, so the author of a change is never its own reviewer.
      required:
        - enabled
        - blocking
        - minApprovals
        - resetOnPush
      additionalProperties: false
    agentReview:
      type: object
      properties:
        enabled:
          type: boolean
        blocking:
          type: boolean
        severity:
          $ref: "#/TrailFindingSeverity"
      required:
        - enabled
        - blocking
        - severity
      additionalProperties: false
    evals:
      $ref: "#/TrailGateToggle"
    checks:
      type: object
      properties:
        enabled:
          type: boolean
        blocking:
          type: boolean
        required:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 200
          maxItems: 50
          description: Check names that must pass. Empty means every reported check.
      required:
        - enabled
        - blocking
        - required
      additionalProperties: false
    discovered:
      type: object
      description: "Passes when no item discovered on the trail is open at or above `priority`. Off by default; turn it on to say \"a high bug found while building this blocks shipping it\"."
      properties:
        enabled:
          type: boolean
          default: false
        blocking:
          type: boolean
          default: false
        priority:
          $ref: "#/OpsItemPriority"
      required:
        - enabled
        - blocking
        - priority
      additionalProperties: false
    shipsDark:
      type: object
      description: Release gate. Passes when every flag the trail ships behind exists and is not at 100% in prod, so new code merges off. Off by default.
      properties:
        enabled:
          type: boolean
          default: false
          description: Whether the gate is evaluated at all.
        blocking:
          type: boolean
          default: false
          description: Whether a failing gate blocks the merge (a non-blocking gate only reports).
      required:
        - enabled
        - blocking
      additionalProperties: false
      default:
        enabled: false
        blocking: false
    rollback:
      type: object
      description: Release gate. For a `feature` trail, passes when a rollback kill switch exists. Off by default.
      properties:
        enabled:
          type: boolean
          default: false
          description: Whether the gate is evaluated at all.
        blocking:
          type: boolean
          default: false
          description: Whether a failing gate blocks the merge (a non-blocking gate only reports).
      required:
        - enabled
        - blocking
      additionalProperties: false
      default:
        enabled: false
        blocking: false
    measured:
      type: object
      description: Release gate. For a `feature` trail, passes when a measuring experiment or metric exists. Off by default.
      properties:
        enabled:
          type: boolean
          default: false
          description: Whether the gate is evaluated at all.
        blocking:
          type: boolean
          default: false
          description: Whether a failing gate blocks the merge (a non-blocking gate only reports).
      required:
        - enabled
        - blocking
      additionalProperties: false
      default:
        enabled: false
        blocking: false
    guarded:
      type: object
      description: Release gate. Passes when every measured resource has at least one guarding alert rule. Off by default.
      properties:
        enabled:
          type: boolean
          default: false
          description: Whether the gate is evaluated at all.
        blocking:
          type: boolean
          default: false
          description: Whether a failing gate blocks the merge (a non-blocking gate only reports).
      required:
        - enabled
        - blocking
      additionalProperties: false
      default:
        enabled: false
        blocking: false
    copy:
      type: object
      description: Release gate. Passes when every copy i18n key exists in every published locale of its profile. Off by default.
      properties:
        enabled:
          type: boolean
          default: false
          description: Whether the gate is evaluated at all.
        blocking:
          type: boolean
          default: false
          description: Whether a failing gate blocks the merge (a non-blocking gate only reports).
      required:
        - enabled
        - blocking
      additionalProperties: false
      default:
        enabled: false
        blocking: false
    plan:
      type: object
      description: Gate. Passes when every release resource the trail's approved plan lists exists on the trail (a flag, kill switch or experiment the person chose while the plan was made). Reads `pending` while a drafted plan waits for approval, and is left out when the trail has no plan yet. On and blocking by default, whoever approved the plan.
      properties:
        enabled:
          type: boolean
          description: Whether the gate is evaluated at all.
        blocking:
          type: boolean
          description: Whether a failing gate blocks the merge. Off, the gate only reports.
      required:
        - enabled
        - blocking
      additionalProperties: false
      default:
        enabled: true
        blocking: true
    requirePlan:
      type: boolean
      default: true
      description: Whether a person approves a trail's plan before it builds. Every trail is planned first — starting an agent on a trail with no approved plan fires a read-only plan run, and the build follows the approved plan. On, the plan run asks the person how the trail should ship and anything else that is open, and waits for their approval. Off, it asks nothing and takes its own recommendations; a plan the checks raise no warning on approves itself and the build starts, one with a warning waits for a person.
    fixRounds:
      type: integer
      minimum: 0
      maximum: 10
      default: 3
      description: How many times the server re-fires the coding agent with a fix prompt after a change's evals or findings fail. After the cap the trail reads `reviewing`, needs a person. `0` turns the loop off.
    goalWindowDays:
      type: integer
      minimum: 1
      maximum: 90
      default: 7
      description: How many days a delivered trail is watched before its goal metric is judged. A trail is delivered when its plan is approved, every code and tracking item is done and every flag it ships behind is fully rolled out (or, with none, something merged).
    maxGoalReplans:
      type: integer
      minimum: 0
      maximum: 10
      default: 3
      description: How many times shipeasy re-plans a trail on its own after its goal was missed. Each re-plan proposes new options that differ from what was tried. Past the cap the trail is off track and the owner decides; `0` never re-plans automatically.
    maxParallelRuns:
      type: integer
      minimum: 1
      maximum: 10
      default: 3
      description: How many item runs a trail's build keeps working at once. A build launches an item run for each open item of the current milestone, up to this many; the rest wait for a slot.
    attributionWindowHours:
      type: integer
      minimum: 1
      maximum: 720
      default: 72
      description: How long after a trail merged an error or alert ticket may be attributed to it. Trails merged inside the window are offered to the investigating agent as candidates.
    rollout:
      $ref: "#/TrailRollout"
    autopilot:
      $ref: "#/TrailAutopilotLimits"
    intakeMatching:
      type: boolean
      default: true
      description: Whether new and still-open errors, alerts, bugs and feature requests are compared with the project's open trails. A confident match attaches the item to the trail with the evidence; a weak one lands under the trail's possibly related list for its owner to confirm or reject. Matching never creates a trail.
    repos:
      type: object
      maxProperties: 100
      additionalProperties:
        $ref: "#/TrailRepoOverride"
      description: Per-repo overrides keyed by `owner/repo`. An override replaces the project's `checks.required` for changes in that repo; every other gate stays project-wide.
  required:
    - upToDate
    - humanReview
    - agentReview
    - evals
    - checks
  additionalProperties: false
TrailRepoOverride:
  type: object
  description: A repo's partial override of the project's trail gates.
  properties:
    checks:
      type: object
      properties:
        required:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 200
          maxItems: 50
          description: Check names that must pass in this repo. Empty means every reported check.
      required:
        - required
      additionalProperties: false
  additionalProperties: false
TrailAgent:
  type: object
  description: A review agent — an eval that scores every push to a trail's changes, run by one of the project's coding-agent triggers.
  properties:
    id:
      type: string
      description: Agent id.
    key:
      type: string
      description: The slug its evals are submitted under (`risk`, `security`, …).
    name:
      type: string
    description:
      anyOf:
        - type: string
        - type: "null"
    instructions:
      type: string
      description: What the agent reviews and how it scores — the prompt its review run receives.
    valueType:
      $ref: "#/TrailAgentValueType"
    polarity:
      $ref: "#/TrailAgentPolarity"
    threshold:
      type: integer
      description: The passing bound — a `higher_is_better` score passes at or above it, a `lower_is_better` one at or below it. Ignored for `boolean` agents.
    blocking:
      type: boolean
      description: Whether a failing eval blocks the merge (through the Evals gate).
    trigger:
      $ref: "#/TrailAgentTrigger"
    connectorId:
      anyOf:
        - type: string
        - type: "null"
      description: The coding-agent trigger that runs it, or `null` for the project's first connected trigger.
    preset:
      anyOf:
        - type: string
        - type: "null"
      description: The preset it was added from.
    enabled:
      type: boolean
    createdAt:
      type: string
    updatedAt:
      type: string
  required:
    - id
    - key
    - name
    - description
    - instructions
    - valueType
    - polarity
    - threshold
    - blocking
    - trigger
    - connectorId
    - preset
    - enabled
    - createdAt
    - updatedAt
TrailAgentPreset:
  type: object
  description: A ready-made review agent a project can add in one call.
  properties:
    preset:
      type: string
    key:
      type: string
    name:
      type: string
    description:
      type: string
    valueType:
      $ref: "#/TrailAgentValueType"
    polarity:
      $ref: "#/TrailAgentPolarity"
    threshold:
      type: integer
    blocking:
      type: boolean
  required:
    - preset
    - key
    - name
    - description
    - valueType
    - polarity
    - threshold
    - blocking
ListTrailAgentsResponse:
  type: object
  properties:
    agents:
      type: array
      items:
        $ref: "#/TrailAgent"
      description: The project's review agents (archived ones excluded).
    presets:
      type: array
      items:
        $ref: "#/TrailAgentPreset"
      description: Presets that can be added with `create --preset <preset>`.
  required:
    - agents
    - presets
CreateTrailAgentRequest:
  type: object
  description: "Add a review agent. Pass `preset` to add a ready-made one (every other field then overrides the preset), or `key`, `name` and `instructions` for a custom agent."
  properties:
    preset:
      type: string
      maxLength: 64
      description: A preset id from `ops review-agents list` (e.g. `code-review`, `security`, `risk`, `confidence`, `slop`).
    key:
      type: string
      pattern: "^[a-z0-9][a-z0-9-]{0,47}$"
      description: Slug the agent's evals are submitted under — lowercase letters, digits and dashes.
    name:
      type: string
      minLength: 1
      maxLength: 80
    description:
      type: string
      maxLength: 500
    instructions:
      type: string
      minLength: 1
      maxLength: 8000
      description: What to review and how to score it.
    valueType:
      $ref: "#/TrailAgentValueType"
    polarity:
      $ref: "#/TrailAgentPolarity"
    threshold:
      type: integer
      minimum: 0
      maximum: 100
    blocking:
      type: boolean
    trigger:
      $ref: "#/TrailAgentTrigger"
    connectorId:
      type: string
      minLength: 1
      maxLength: 128
      description: The coding-agent trigger that runs it — a connector id from `ops agents list`. Omitted, the project's first connected trigger runs it.
    enabled:
      type: boolean
  additionalProperties: false
UpdateTrailAgentRequest:
  type: object
  description: Change a review agent. Only the fields sent change; its `key` is fixed.
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 80
    description:
      anyOf:
        - type: string
          maxLength: 500
        - type: "null"
    instructions:
      type: string
      minLength: 1
      maxLength: 8000
    valueType:
      $ref: "#/TrailAgentValueType"
    polarity:
      $ref: "#/TrailAgentPolarity"
    threshold:
      type: integer
      minimum: 0
      maximum: 100
    blocking:
      type: boolean
    trigger:
      $ref: "#/TrailAgentTrigger"
    connectorId:
      anyOf:
        - type: string
          minLength: 1
          maxLength: 128
        - type: "null"
    enabled:
      type: boolean
  additionalProperties: false
TrailEval:
  type: object
  description: One review agent's result on one push.
  properties:
    id:
      type: string
    agentKey:
      type: string
    headSha:
      type: string
      description: The push it scored.
    status:
      $ref: "#/TrailEvalStatus"
    value:
      anyOf:
        - type: number
        - type: "null"
      description: 0–100 for a score, 1/0 for a boolean; `null` until submitted.
    verdict:
      anyOf:
        - $ref: "#/TrailEvalVerdict"
        - type: "null"
    rationale:
      anyOf:
        - type: string
        - type: "null"
    reviewer:
      anyOf:
        - type: string
        - type: "null"
      description: The agent type that submitted it, or the submitting person's email.
    sessionUrl:
      anyOf:
        - type: string
        - type: "null"
      description: Deep link to the review session, when the provider gave one.
    error:
      anyOf:
        - type: string
        - type: "null"
      description: Why the launch failed (`failed` only).
    createdAt:
      type: string
    completedAt:
      anyOf:
        - type: string
        - type: "null"
  required:
    - id
    - agentKey
    - headSha
    - status
    - value
    - verdict
    - rationale
    - reviewer
    - sessionUrl
    - error
    - createdAt
    - completedAt
TrailEvalSeries:
  type: object
  description: One review agent on one change — its result on the latest push next to its last five earlier ones, so you can see whether the loop has stabilised.
  properties:
    agentKey:
      type: string
    name:
      type: string
    valueType:
      $ref: "#/TrailAgentValueType"
    polarity:
      $ref: "#/TrailAgentPolarity"
    threshold:
      type: integer
    blocking:
      type: boolean
    current:
      anyOf:
        - $ref: "#/TrailEval"
        - type: "null"
      description: Its eval on the latest push, or `null` when it has not run there.
    history:
      type: array
      items:
        $ref: "#/TrailEval"
      description: Its evals on earlier pushes, newest first (at most 5).
  required:
    - agentKey
    - name
    - valueType
    - polarity
    - threshold
    - blocking
    - current
    - history
TrailFinding:
  type: object
  description: One issue flagged on a change.
  properties:
    id:
      type: string
    agentKey:
      anyOf:
        - type: string
        - type: "null"
      description: The review agent that raised it.
    headSha:
      type: string
      description: The push it was raised on.
    severity:
      $ref: "#/TrailFindingSeverity"
    title:
      type: string
    body:
      anyOf:
        - type: string
        - type: "null"
    path:
      anyOf:
        - type: string
        - type: "null"
    line:
      anyOf:
        - type: integer
        - type: "null"
    suggestion:
      anyOf:
        - type: string
        - type: "null"
      description: Suggested replacement for the flagged lines.
    status:
      $ref: "#/TrailFindingStatus"
    stale:
      type: boolean
      description: True when the change has been pushed to since the finding was raised. Stale findings stay open until resolved or dismissed.
    statusReason:
      anyOf:
        - type: string
        - type: "null"
    statusBy:
      anyOf:
        - type: string
        - type: "null"
    promotedItem:
      anyOf:
        - $ref: "#/OpsItemRef"
        - type: "null"
      description: The queue item this finding was promoted into (the finding is then dismissed as `moved to #N`), or `null`.
    createdAt:
      type: string
    updatedAt:
      type: string
  required:
    - id
    - agentKey
    - headSha
    - severity
    - title
    - body
    - path
    - line
    - suggestion
    - status
    - stale
    - statusReason
    - statusBy
    - promotedItem
    - createdAt
    - updatedAt
TrailPush:
  type: object
  properties:
    id:
      type: string
    headSha:
      type: string
    baseSha:
      anyOf:
        - type: string
        - type: "null"
    headRef:
      anyOf:
        - type: string
        - type: "null"
    baseRef:
      anyOf:
        - type: string
        - type: "null"
    actor:
      anyOf:
        - type: string
        - type: "null"
      description: GitHub login that pushed.
    source:
      type: string
      enum:
        - webhook
        - link
        - observed
      description: How the push was learned about — the GitHub webhook, linking the PR, or reading the PR's head.
    createdAt:
      type: string
  required:
    - id
    - headSha
    - baseSha
    - headRef
    - baseRef
    - actor
    - source
    - createdAt
TrailApproval:
  type: object
  properties:
    id:
      type: string
    actorEmail:
      type: string
    body:
      anyOf:
        - type: string
        - type: "null"
    headSha:
      type: string
      description: The push that was approved.
    current:
      type: boolean
      description: True when it approved the latest push.
    actorKind:
      $ref: "#/TrailApprovalActorKind"
    authorizedBy:
      anyOf:
        - type: string
        - type: "null"
      description: For an autopilot approval, the person who authorized autopilot (`approved by autopilot, authorized by <email>`); `null` for a person's approval.
    createdAt:
      type: string
  required:
    - id
    - actorEmail
    - body
    - headSha
    - current
    - actorKind
    - authorizedBy
    - createdAt
TrailCheckRun:
  type: object
  properties:
    name:
      type: string
    status:
      type: string
      enum:
        - success
        - pending
        - failure
        - neutral
    url:
      anyOf:
        - type: string
        - type: "null"
  required:
    - name
    - status
    - url
TrailGate:
  type: object
  properties:
    key:
      $ref: "#/TrailGateKey"
    label:
      type: string
    status:
      $ref: "#/TrailGateStatus"
    blocking:
      type: boolean
    detail:
      type: string
      description: One line on what the gate saw, e.g. `1 of 1 approvals`.
  required:
    - key
    - label
    - status
    - blocking
    - detail
TrailChange:
  type: object
  description: One pull request worked under a trail, with everything needed to decide whether it can merge.
  properties:
    id:
      type: string
      description: The change's id.
    item:
      anyOf:
        - $ref: "#/OpsItemRef"
        - type: "null"
      description: The queue item whose run opened this change, or `null` when a trail run (or a person) did.
    mergedAt:
      anyOf:
        - type: string
        - type: "null"
      description: ISO-8601 time the pull request merged, or `null` while it has not.
    mergeSha:
      anyOf:
        - type: string
        - type: "null"
      description: The merge commit, or `null` while the change has not merged.
    changedFiles:
      anyOf:
        - type: array
          items:
            type: string
        - type: "null"
      description: Paths the change touched, captured at merge for post-merge attribution. `null` unless the change has merged and the read asked for `files`.
    prUrl:
      type: string
    prNumber:
      type: integer
    repo:
      anyOf:
        - type: string
        - type: "null"
      description: "`owner/repo`."
    title:
      anyOf:
        - type: string
        - type: "null"
    state:
      type: string
      enum:
        - open
        - draft
        - merged
        - closed
        - unknown
      description: The PR's state; `unknown` when GitHub could not be read.
    headRef:
      anyOf:
        - type: string
        - type: "null"
    baseRef:
      anyOf:
        - type: string
        - type: "null"
    headSha:
      anyOf:
        - type: string
        - type: "null"
      description: The latest push — what evals, findings and approvals are measured against.
    mergeable:
      type: boolean
      description: True when every blocking gate passes and the PR is open.
    gates:
      type: array
      items:
        $ref: "#/TrailGate"
    checks:
      type: array
      items:
        $ref: "#/TrailCheckRun"
    evals:
      type: array
      items:
        $ref: "#/TrailEvalSeries"
    findings:
      type: array
      items:
        $ref: "#/TrailFinding"
      description: Every finding on the change — open ones first, worst first.
    approvals:
      type: array
      items:
        $ref: "#/TrailApproval"
    pushes:
      type: array
      items:
        $ref: "#/TrailPush"
      description: Pushes, newest first.
  required:
    - id
    - item
    - mergedAt
    - mergeSha
    - changedFiles
    - prUrl
    - prNumber
    - repo
    - title
    - state
    - headRef
    - baseRef
    - headSha
    - mergeable
    - gates
    - checks
    - evals
    - findings
    - approvals
    - pushes
NewTrailFinding:
  type: object
  properties:
    severity:
      $ref: "#/TrailFindingSeverity"
    title:
      type: string
      minLength: 1
      maxLength: 200
    body:
      type: string
      maxLength: 4000
    path:
      type: string
      maxLength: 500
    line:
      type: integer
      minimum: 1
    suggestion:
      type: string
      maxLength: 4000
  required:
    - severity
    - title
  additionalProperties: false
SubmitOpsTrailEvalRequest:
  type: object
  description: "One review agent's result on one push. Re-submitting for the same push replaces the earlier result and its findings."
  properties:
    agentKey:
      type: string
      minLength: 1
      maxLength: 48
      description: The review agent's key (from `ops review-agents list`).
    value:
      type: number
      minimum: 0
      maximum: 100
      description: 0–100 for a score agent; 1 (yes) or 0 (no) for a boolean one.
    rationale:
      type: string
      minLength: 1
      maxLength: 4000
      description: One or two sentences on the evidence behind the value.
    findings:
      type: array
      items:
        $ref: "#/NewTrailFinding"
      maxItems: 50
      description: Issues to fix, each with a severity, and a file and line when there is one.
    prUrl:
      type: string
      maxLength: 500
      description: The change reviewed. Omitted, the trail's primary change.
    headSha:
      type: string
      minLength: 7
      maxLength: 64
      description: The commit reviewed. Omitted, the change's latest push. A sha that is not the latest push is recorded against that push, as history.
    agent:
      type: string
      enum:
        - jarvis
        - claude
        - cursor
        - copilot
        - jules
      description: Your agent type, when you are the review agent.
    sessionId:
      type: string
      maxLength: 300
      description: Your session id, so the eval can deep-link to the review run.
    resources:
      type: array
      maxItems: 50
      items:
        $ref: "#/NewTrailResource"
      description: Product resources the reviewed diff uses (`getFlag("x")`, `getExperiment("y")`, `t("key")`). They are linked to the trail as detected. A key that does not exist yet becomes a finding.
  required:
    - agentKey
    - value
    - rationale
  additionalProperties: false
SubmitOpsTrailEvalResponse:
  type: object
  properties:
    eval:
      $ref: "#/TrailEval"
    findings:
      type: array
      items:
        $ref: "#/TrailFinding"
  required:
    - eval
    - findings
UpdateOpsTrailFindingRequest:
  type: object
  properties:
    status:
      $ref: "#/TrailFindingStatus"
    reason:
      type: string
      maxLength: 2000
      description: Why — the fixing commit, or why it is not a problem.
    agent:
      type: string
      enum:
        - jarvis
        - claude
        - cursor
        - copilot
        - jules
      description: Your agent type, when an agent is resolving the finding.
  required:
    - status
  additionalProperties: false
ApproveOpsTrailRequest:
  type: object
  properties:
    prUrl:
      type: string
      maxLength: 500
      description: The change to approve. Omitted, the trail's primary change.
    body:
      type: string
      maxLength: 4000
      description: An optional review note.
  additionalProperties: false
RequestOpsTrailReviewRequest:
  type: object
  properties:
    prUrl:
      type: string
      maxLength: 500
      description: The change to review. Omitted, the trail's primary change.
    agentKeys:
      type: array
      items:
        type: string
        minLength: 1
        maxLength: 48
      maxItems: 20
      description: Which review agents to run. Omitted, every enabled one.
  additionalProperties: false
RequestOpsTrailReviewResponse:
  type: object
  properties:
    prUrl:
      type: string
    headSha:
      type: string
    launched:
      type: array
      items:
        type: object
        properties:
          agentKey:
            type: string
          status:
            $ref: "#/TrailEvalStatus"
          error:
            anyOf:
              - type: string
              - type: "null"
        required:
          - agentKey
          - status
          - error
  required:
    - prUrl
    - headSha
    - launched
MergeOpsTrailRequest:
  type: object
  properties:
    prUrl:
      type: string
      maxLength: 500
      description: The change to merge. Omitted, the trail's primary change.
    method:
      type: string
      enum:
        - squash
        - merge
        - rebase
      description: GitHub merge method. Defaults to `squash`.
    bypass:
      type: boolean
      description: Merge although a blocking gate has not passed. Needs the bypass capability, and is recorded on the trail with `reason`.
    reason:
      type: string
      maxLength: 2000
      description: Why the gates were bypassed. Required with `bypass`.
  additionalProperties: false
MergeOpsTrailResponse:
  type: object
  properties:
    prUrl:
      type: string
    merged:
      type: boolean
    sha:
      anyOf:
        - type: string
        - type: "null"
      description: The merge commit.
    bypassed:
      type: array
      items:
        $ref: "#/TrailGateKey"
      description: Blocking gates that were not passing when it merged.
  required:
    - prUrl
    - merged
    - sha
    - bypassed
TrailStatus:
  type: string
  enum:
    - open
    - closed
  description: Whether a trail is still being worked. A trail closes by hand, or on its own once it is `shipped` with no high-priority discovered item open. `phase` carries the detail; `status` is the stored open/closed switch.
TrailType:
  type: string
  enum:
    - feature
    - bug
    - task
  description: What a trail is shipping. A `feature` trail is held to the rollback and measured release gates.
TrailDiscoveredSource:
  type: string
  enum:
    - origin
    - finding
    - agent
    - person
    - post_merge
    - cleanup
    - attached
    - plan
  description: How an item came to be on a trail — `origin` (the item the trail was created from), `finding` (a review finding promoted out of scope), `agent` (the coding agent filed it instead of fixing it in place), `person` (a reviewer filed it from the trail), `post_merge` (an error, alert or bug attributed to the trail after it merged), `cleanup` (follow-up the release created, e.g. remove a flag from code), `attached` (an existing item moved onto the trail), `plan` (filed from the breakdown of the approved plan).
TrailResourceKind:
  type: string
  enum:
    - gate
    - config
    - killswitch
    - experiment
    - metric
    - alert_rule
    - event
    - i18n_key
  description: The product entities a trail can ship or depend on. `gate` is a feature flag.
TrailResourceRole:
  type: string
  enum:
    - ships_behind
    - rollback
    - measures
    - guards
    - copy
    - touched
  description: What a resource is for on the trail — `ships_behind` (the flag the code ships behind), `rollback` (the kill switch that undoes it), `measures` (the experiment or metric that judges it), `guards` (an alert rule that watches it), `copy` (an i18n key it adds) or `touched` (anything else). The release gates and the release phase read these.
TrailResourceSource:
  type: string
  enum:
    - agent
    - detected
    - person
  description: How a resource got linked — `agent` (a write made in the trail's run context), `detected` (a review run saw the diff use it) or `person`.
TrailRunKind:
  type: string
  enum:
    - build
    - fix
    - plan
    - replan
  description: "What a trail run was fired to do — `plan` (read-only: ask the person how the trail should ship and anything else that is open, then submit a plan), `build` (carry the approved plan to pull requests), `fix` (act on failing evals and findings) or `replan` (read-only, once a plan is approved: re-read the goal metric, the items' outcomes and project memory, and submit the plan's next revision)."
TrailRunState:
  type: string
  enum:
    - launching
    - running
    - completed
    - failed
    - cancelled
  description: A trail run's lifecycle.
TrailAttributionConfidence:
  type: string
  enum:
    - high
    - medium
    - low
  description: How sure an attribution is. `high` and `medium` attach the item to the trail; `low` records a suspect for a person to confirm or reject.
TrailSuspectStatus:
  type: string
  enum:
    - pending
    - confirmed
    - rejected
  description: Where a suspected regression stands. Only `pending` suspects are listed on the trail.
TrailHealth:
  type: string
  enum:
    - on_track
    - at_risk
    - off_track
  description: "A trail's effective health — the one a person set, or else the derived one. Derived, first match wins: `off_track` when the target date has passed and the trail has not shipped, or a rollout is `fixing` after a pull-back; `at_risk` when the target is at most 7 days away and progress is under 75 %, or a high finding or a high or critical item on the trail is open; otherwise `on_track`. A list row carries the snapshot; the detail read recomputes it."
TrailHealthSource:
  type: string
  enum:
    - person
    - derived
  description: Where a trail's `health` comes from — `person` (someone set it, and it holds until they clear it) or `derived` (computed from the target date, progress, rollouts, findings and items).
TrailWorkKind:
  type: string
  enum:
    - code
    - tracking
    - marketing
    - research
    - ops
  description: What kind of work an item on a trail is — `code` (a change to the product), `tracking` (events, metrics and alert rules to measure it), `marketing`, `research` or `ops`. Code and tracking items go to coding agents; marketing and research items are typically delegated to an assistant such as Muse or Grok, which picks them up over MCP (`ops list --owner muse`).
TrailGoal:
  type: object
  description: The metric a trail is meant to move, and how far. Progress toward the target is charted on the trail page.
  properties:
    metric:
      anyOf:
        - type: object
          description: The metric.
          properties:
            id:
              type: string
              description: The metric's id.
            key:
              type: string
              description: The metric's key, kept for display after it is archived.
          required:
            - id
            - key
          additionalProperties: false
        - type: "null"
      description: The metric the goal is measured on, or `null` for a goal stated in words only.
    direction:
      type: string
      enum:
        - increase
        - decrease
      description: Which way the metric should move.
    baseline:
      anyOf:
        - type: number
        - type: "null"
      description: The metric's value when the trail started, or `null` when not recorded.
    target:
      anyOf:
        - type: number
        - type: "null"
      description: The value the trail aims for, or `null` for "move it in `direction`".
    unit:
      anyOf:
        - type: string
        - type: "null"
      description: The unit the values are in, e.g. `%` or `ms`, or `null`.
  required:
    - metric
    - direction
    - baseline
    - target
    - unit
  additionalProperties: false
TrailGoalSpec:
  type: object
  description: A trail's goal as sent on create or update. `metric` names the metric by id or key.
  properties:
    metric:
      anyOf:
        - type: string
          minLength: 1
          maxLength: 256
        - type: "null"
      description: The metric's id or key, or `null` for a goal stated in words only.
    direction:
      type: string
      enum:
        - increase
        - decrease
      description: Which way the metric should move.
    baseline:
      anyOf:
        - type: number
        - type: "null"
      description: The metric's value when the trail started, or `null`.
    target:
      anyOf:
        - type: number
        - type: "null"
      description: The value the trail aims for, or `null`.
    unit:
      anyOf:
        - type: string
          maxLength: 32
        - type: "null"
      description: The unit the values are in, e.g. `%` or `ms`, or `null`.
  required:
    - direction
  additionalProperties: false
TrailResourceRef:
  type: object
  description: A compact reference to one of a trail's resources — here, the flag a rollout drives.
  properties:
    id:
      type: string
      description: The trail's link to the resource (`TrailResource.id`), not the entity's own id.
    key:
      type: string
      description: The flag's key.
  required:
    - id
    - key
  additionalProperties: false
TrailMilestone:
  type: object
  description: A named, ordered stage inside a trail. An item is in at most one milestone; progress is counted per milestone and for the trail.
  properties:
    id:
      type: string
      description: The milestone's id (a uuid).
    name:
      type: string
      description: The milestone's name.
    description:
      anyOf:
        - type: string
        - type: "null"
      description: What the milestone delivers, or `null`.
    targetDate:
      anyOf:
        - type: string
          format: date
        - type: "null"
      description: The calendar day the milestone is meant to be done by (`YYYY-MM-DD`), or `null`.
    position:
      type: integer
      minimum: 0
      description: Where the milestone sits in the trail's order, from `0`.
    itemsTotal:
      type: integer
      minimum: 0
      description: Items in the milestone.
    itemsDone:
      type: integer
      minimum: 0
      description: Of those, the items at `resolved`, `wont_fix` or `ready_for_qa`.
    late:
      type: boolean
      description: True when the target date has passed with items still open.
  required:
    - id
    - name
    - description
    - targetDate
    - position
    - itemsTotal
    - itemsDone
    - late
  additionalProperties: false
TrailSummary:
  type: object
  description: A compact reference to a trail, as it appears on a queue item.
  properties:
    id:
      type: string
      description: The trail's id.
    number:
      type: integer
      description: Per-project trail number (the `12` in `T-12`).
    handle:
      type: string
      description: The trail's handle, `T-<number>`.
    title:
      type: string
    phase:
      $ref: "#/TrailPhase"
  required:
    - id
    - number
    - handle
    - title
    - phase
  additionalProperties: false
Trail:
  type: object
  description: "A trail — the unit of shipping: an intent, the changes worked under it, the items discovered on it and the product resources it ships. The phase and counts are a snapshot (see `snapshotAt`); the detail read recomputes them live."
  properties:
    id:
      type: string
      description: Stable opaque trail id (a uuid).
    number:
      type: integer
      description: Per-project trail number (the `12` in `T-12`).
    handle:
      type: string
      description: The trail's handle, `T-<number>`. Every trail endpoint accepts it or the id.
    title:
      type: string
      description: One-line statement of the intent.
    body:
      type: string
      description: The intent in markdown — the outcome and the acceptance criteria.
    type:
      $ref: "#/TrailType"
    priority:
      anyOf:
        - $ref: "#/OpsItemPriority"
        - type: "null"
      description: Triage priority, or `null` when not set.
    owner:
      $ref: "#/OpsItemOwner"
    status:
      $ref: "#/TrailStatus"
    closedReason:
      anyOf:
        - type: string
        - type: "null"
      description: Why the trail was closed, or `null` while it is open.
    phase:
      $ref: "#/TrailPhase"
    phaseReason:
      anyOf:
        - type: string
        - type: "null"
      description: One line on why the trail is in this phase, e.g. `2 of 3 changes can merge`, or `null`.
    origin:
      anyOf:
        - $ref: "#/OpsItemRef"
        - type: "null"
      description: The queue item Ship this was pressed on, or `null` for a trail created from scratch.
    repos:
      type: array
      items:
        type: string
      description: Repos (`owner/repo`) the trail may open changes in. Empty means no scope.
    changesOpen:
      type: integer
      description: Changes still open. Part of the snapshot.
    changesMergeable:
      type: integer
      description: Open changes whose merge gates all pass. Part of the snapshot.
    findingsOpenHigh:
      type: integer
      description: Open findings at `high` severity across the trail's changes. Part of the snapshot.
    itemsOpen:
      type: integer
      description: Discovered items still open. Part of the snapshot.
    resourcesCount:
      type: integer
      description: Product resources linked to the trail. Part of the snapshot.
    startDate:
      anyOf:
        - type: string
          format: date
        - type: "null"
      description: The calendar day work on the trail starts (`YYYY-MM-DD`), or `null` when not set.
    targetDate:
      anyOf:
        - type: string
          format: date
        - type: "null"
      description: The calendar day the trail is meant to ship by (`YYYY-MM-DD`), or `null` when not set. A trail past its target that has not shipped is late.
    health:
      $ref: "#/TrailHealth"
    healthSource:
      $ref: "#/TrailHealthSource"
    itemsTotal:
      type: integer
      minimum: 0
      description: Items on the trail.
    itemsDone:
      type: integer
      minimum: 0
      description: Of the items on the trail, those at `resolved`, `wont_fix` or `ready_for_qa`. Progress is `itemsDone` over `itemsTotal`.
    goal:
      anyOf:
        - $ref: "#/TrailGoal"
        - type: "null"
      description: The metric the trail is meant to move, or `null` for a trail with no goal.
    releasedPct:
      anyOf:
        - type: number
          minimum: 0
          maximum: 100
        - type: "null"
      description: The lowest prod rollout across the flags the trail ships behind, as a percent, or `null` when it ships behind none.
    mergedAt:
      anyOf:
        - type: string
        - type: "null"
      description: ISO-8601 time the first change merged, or `null`.
    shippedAt:
      anyOf:
        - type: string
        - type: "null"
      description: ISO-8601 time the trail reached `shipped`, or `null`.
    closedAt:
      anyOf:
        - type: string
        - type: "null"
      description: ISO-8601 time the trail was closed, or `null`.
    snapshotAt:
      anyOf:
        - type: string
        - type: "null"
      description: ISO-8601 time the snapshot columns (`phase`, the counts, `releasedPct`) were last rewritten. The list can lag the detail by one event; the detail read recomputes them live.
    createdAt:
      type: string
      description: ISO-8601 creation time.
    updatedAt:
      type: string
      description: ISO-8601 last-update time.
  required:
    - id
    - number
    - handle
    - title
    - body
    - type
    - priority
    - owner
    - status
    - closedReason
    - phase
    - phaseReason
    - origin
    - repos
    - changesOpen
    - changesMergeable
    - findingsOpenHigh
    - itemsOpen
    - resourcesCount
    - startDate
    - targetDate
    - health
    - healthSource
    - itemsTotal
    - itemsDone
    - goal
    - releasedPct
    - mergedAt
    - shippedAt
    - closedAt
    - snapshotAt
    - createdAt
    - updatedAt
  additionalProperties: false
TrailChangeRef:
  type: object
  description: A compact reference to one of a trail's changes.
  properties:
    id:
      type: string
      description: The change's id.
    prUrl:
      type: string
    prNumber:
      type: integer
    repo:
      anyOf:
        - type: string
        - type: "null"
      description: "`owner/repo`."
  required:
    - id
    - prUrl
    - prNumber
    - repo
  additionalProperties: false
TrailItem:
  type: object
  description: A queue item on a trail, with where it surfaced.
  properties:
    item:
      $ref: "#/OpsItemRef"
    priority:
      anyOf:
        - $ref: "#/OpsItemPriority"
        - type: "null"
      description: The item's triage priority, or `null`.
    discoveredSource:
      $ref: "#/TrailDiscoveredSource"
    discoveredSha:
      anyOf:
        - type: string
        - type: "null"
      description: The push the item surfaced on, or `null` when it did not surface on one.
    change:
      anyOf:
        - $ref: "#/TrailChangeRef"
        - type: "null"
      description: The change the item surfaced on, or `null`.
    milestoneId:
      anyOf:
        - type: string
        - type: "null"
      description: The milestone the item is in (`TrailMilestone.id`), or `null` when it is in none.
    workKind:
      anyOf:
        - $ref: "#/TrailWorkKind"
        - type: "null"
      description: What kind of work the item is, as the plan's breakdown filed it, or `null` for an item that did not come from a plan.
  required:
    - item
    - priority
    - discoveredSource
    - discoveredSha
    - change
    - milestoneId
    - workKind
  additionalProperties: false
TrailResourceState:
  type: object
  description: The resource's live state, read from the product when the trail is read. Only the fields that apply to the kind are set.
  properties:
    exists:
      type: boolean
      description: False when the entity could not be found (it was archived or never created).
    archived:
      type: boolean
      description: True when the entity is archived.
    settled:
      type: boolean
      description: Whether the resource no longer holds the trail in `releasing`. A flag settles at 100% in prod or when archived; a measuring experiment once it is stopped with a decision; every other role at merge.
    summary:
      anyOf:
        - type: string
        - type: "null"
      description: One line, e.g. `prod 25%`, `on`, `running`, `firing`.
    prodRolloutPct:
      anyOf:
        - type: number
          minimum: 0
          maximum: 100
        - type: "null"
      description: A flag's prod rollout, as a percent.
    status:
      anyOf:
        - type: string
        - type: "null"
      description: The entity's own status (an experiment's `running` or `stopped`, a kill switch's `on` or `off`, an alert's `firing` or `ok`).
    decision:
      anyOf:
        - type: string
        - type: "null"
      description: An experiment's decision once it has one.
  additionalProperties: {}
TrailResource:
  type: object
  description: A flag, config, kill switch, experiment, metric, alert rule, event or i18n key the trail ships or depends on. `state` is present on reads that load live state.
  properties:
    id:
      type: string
      description: The trail's link to the resource — what `trails resources remove` takes. Not the entity's own id.
    kind:
      $ref: "#/TrailResourceKind"
    resourceId:
      type: string
      description: The entity's own id.
    resourceKey:
      type: string
      description: The entity's key, kept for display after it is archived.
    role:
      $ref: "#/TrailResourceRole"
    source:
      $ref: "#/TrailResourceSource"
    state:
      $ref: "#/TrailResourceState"
    createdAt:
      type: string
      description: ISO-8601 time it was linked.
  required:
    - id
    - kind
    - resourceId
    - resourceKey
    - role
    - source
    - createdAt
  additionalProperties: false
NewTrailResource:
  type: object
  description: "A resource to link to a trail. When `role` is omitted it is guessed from the kind: a gate ships behind, a kill switch is the rollback, an experiment measures, an alert rule guards, an i18n key is copy, anything else is touched."
  properties:
    kind:
      $ref: "#/TrailResourceKind"
    resourceKey:
      type: string
      description: The entity's key (a gate or metric name, an experiment name, an i18n key). Resolved to the entity when it exists.
      minLength: 1
      maxLength: 256
    role:
      $ref: "#/TrailResourceRole"
  required:
    - kind
    - resourceKey
  additionalProperties: false
TrailRun:
  type: object
  description: A coding-agent session working the trail itself.
  properties:
    id:
      type: string
      description: The run's id.
    kind:
      $ref: "#/TrailRunKind"
    state:
      $ref: "#/TrailRunState"
    agent:
      anyOf:
        - type: string
        - type: "null"
      description: The coding agent that ran it (`claude`, `cursor`, `copilot`, `jules`, `jarvis`), or `null`.
    sessionUrl:
      anyOf:
        - type: string
        - type: "null"
      description: Link to the agent's session, or `null` when the provider has none.
    change:
      anyOf:
        - $ref: "#/TrailChangeRef"
        - type: "null"
      description: The change a `fix` run was fired for, or `null`.
    headSha:
      anyOf:
        - type: string
        - type: "null"
      description: The push a `fix` run was fired for, or `null`.
    summary:
      anyOf:
        - type: string
        - type: "null"
      description: What the run reported when it finished, or `null`.
    startedAt:
      type: string
      description: ISO-8601 start time.
    completedAt:
      anyOf:
        - type: string
        - type: "null"
      description: ISO-8601 finish time, or `null` while it runs.
    error:
      anyOf:
        - type: string
        - type: "null"
      description: Why the launch or the run failed, or `null`.
  required:
    - id
    - kind
    - state
    - agent
    - sessionUrl
    - change
    - headSha
    - summary
    - startedAt
    - completedAt
    - error
  additionalProperties: false
TrailSuspect:
  type: object
  description: "A low-confidence post-merge attribution: an error, alert or bug that may have been caused by the trail. A person confirms it onto the trail or rejects it."
  properties:
    id:
      type: string
      description: The suspect's id.
    item:
      $ref: "#/OpsItemRef"
    confidence:
      $ref: "#/TrailAttributionConfidence"
    evidence:
      type: string
      description: What the attributing agent saw — the frame, the resource or the metric that points at this trail.
    status:
      $ref: "#/TrailSuspectStatus"
    attributedBy:
      anyOf:
        - type: string
        - type: "null"
      description: The agent or person that recorded it, or `null`.
    source:
      $ref: "#/TrailSuspectSource"
    createdAt:
      type: string
      description: ISO-8601 time it was recorded.
  required:
    - id
    - item
    - confidence
    - evidence
    - status
    - attributedBy
    - source
    - createdAt
  additionalProperties: false
TrailRolloutOnBreach:
  type: string
  enum:
    - pull_back
    - ask_first
    - ask_then_pull_back
  description: What to do when a guard trips during a step — `pull_back` (pull the flag back, investigate and suggest a fix, tell the owner; the default), `ask_first` (ask the owner, only notify), or `ask_then_pull_back` (ask, and pull back after `breachTimeoutMinutes` with no answer).
TrailRolloutAdvance:
  type: string
  enum:
    - auto
    - ask
  description: Whether a healthy step advances by itself (`auto`) or waits for the owner to say so (`ask`).
TrailRolloutAfterFix:
  type: string
  enum:
    - resume
    - ask
    - restart
  description: What happens when the fix merges — `resume` from the last healthy step, `ask` the owner first, or `restart` from the first step.
TrailRollout:
  type: object
  description: How the flag a trail ships behind is ramped after merge — the release controller's plan (see the design doc, the release controller). Part of the plan's release block; the project's defaults live in `trail-gates` `rollout`. The controller runs on the alerts cron, so a hold shorter than the cron interval rounds up to the next tick.
  properties:
    steps:
      type: array
      minItems: 1
      maxItems: 10
      items:
        type: number
        exclusiveMinimum: 0
        maximum: 100
      description: Percent steps, each above the one before, the last 100.
      example: [1, 5, 25, 50, 100]
    holdMinutes:
      type: integer
      minimum: 0
      maximum: 10080
      description: Minutes a step must stay healthy before the next one.
    minExposure:
      type: integer
      minimum: 0
      description: Evaluations a step must have served before it counts as healthy, so a quiet hour never passes as a green one. `0` = no floor.
    internal:
      anyOf:
        - type: object
          properties:
            holdMinutes:
              type: integer
              minimum: 0
              maximum: 10080
              description: Minutes the team stage holds healthy before the first public step.
          required:
            - holdMinutes
          additionalProperties: false
        - type: "null"
      description: The team stage before any public percent — the project's members are allowlisted on the flag (by email) and the step holds like any other. `null` or absent = no team stage.
    guards:
      type: object
      description: What is watched while a step holds. The trail's `guards` alert-rule resources are watched too.
      properties:
        alertRuleIds:
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 100
          description: Alert rules (ids) whose firing during a step is a breach.
        experimentGuardrails:
          type: boolean
          description: Whether a breached guardrail of the trail's measuring experiment is a breach.
        attributedErrors:
          type: boolean
          description: Whether a new error attributed to the trail at high confidence is a breach.
      required:
        - alertRuleIds
        - experimentGuardrails
        - attributedErrors
      additionalProperties: false
    policies:
      type: object
      description: The three decisions the plan asks the owner, each with the project default pre-selected.
      properties:
        onBreach:
          $ref: "#/TrailRolloutOnBreach"
        breachTimeoutMinutes:
          type: integer
          minimum: 1
          maximum: 1440
          description: With `ask_then_pull_back`, minutes the owner has before the controller pulls back.
        advance:
          $ref: "#/TrailRolloutAdvance"
        afterFix:
          $ref: "#/TrailRolloutAfterFix"
      required:
        - onBreach
        - breachTimeoutMinutes
        - advance
        - afterFix
      additionalProperties: false
  required:
    - steps
    - holdMinutes
    - minExposure
    - guards
    - policies
  additionalProperties: false
TrailRolloutState:
  type: string
  enum:
    - idle
    - running
    - paused
    - fixing
    - completed
    - waiting_tracking
  description: Where a trail's rollout is — `idle` (the controller has not taken it over), `waiting_tracking` (released, but the guard and goal metrics have no data yet, so nothing is ramped), `running` (stepping the flag along the plan), `paused` (a person paused it, or it stepped aside or handed off), `fixing` (pulled back; waiting for the fix to merge) or `completed`.
TrailRolloutPending:
  type: object
  description: A question the controller asked the owner and is waiting on. Answer it with `ops questions answer`.
  properties:
    kind:
      type: string
      enum:
        - breach
        - advance
        - resume
        - tracking
      description: What it asks — what to do about a breach, whether to advance a healthy step, how to resume after the fix, or whether to start without tracking data.
    questionId:
      type: string
      description: The structured question's id.
    askedAt:
      type: string
      description: ISO-8601 time it was asked.
  required:
    - kind
    - questionId
    - askedAt
  additionalProperties: false
TrailRolloutView:
  type: object
  description: One flag's rollout as it stands — the plan's configuration for it and the controller's live state.
  properties:
    resource:
      anyOf:
        - $ref: "#/TrailResourceRef"
        - type: "null"
      description: The `ships_behind` flag this rollout drives, or `null` when the trail ships behind no flag.
    state:
      $ref: "#/TrailRolloutState"
    config:
      anyOf:
        - $ref: "#/TrailRollout"
        - type: "null"
      description: The rollout the plan carries, or `null` when the trail ships no flag or has no plan.
    step:
      type: integer
      description: Index into `config.steps` the flag is at; `-1` before the first step.
    stepPct:
      anyOf:
        - type: number
        - type: "null"
      description: The percent the current step puts the flag at, or `null` with no rollout.
    stepStartedAt:
      anyOf:
        - type: string
        - type: "null"
      description: ISO-8601 time the current step began.
    pausedReason:
      anyOf:
        - type: string
        - type: "null"
      description: Why the rollout is paused, or `null`.
    pending:
      anyOf:
        - $ref: "#/TrailRolloutPending"
        - type: "null"
      description: The question the controller is waiting on, or `null`.
  required:
    - resource
    - state
    - config
    - step
    - stepPct
    - stepStartedAt
    - pausedReason
    - pending
  additionalProperties: false
TrailReleaseEventKind:
  type: string
  enum:
    - started
    - advanced
    - breach
    - pulled_back
    - asked
    - answered
    - investigating
    - fix_merged
    - resumed
    - restarted
    - paused
    - completed
    - autopilot_on
    - autopilot_off
    - autopilot_acted
    - autopilot_paused
    - autopilot_resumed
    - goal_watching
    - goal_met
    - goal_missed
    - goal_replan_failed
    - guard_armed
    - guard_arm_failed
    - waiting_tracking
    - tracking_live
    - team_stage
  description: What happened on the release timeline. `waiting_tracking` is a release held because its guard or goal metrics had no data, `tracking_live` the data arriving (or the owner starting without it), `team_stage` the project's members allowlisted before the first public step. `guard_armed` is an alert rule shipeasy set up (or picked up) to watch a guarded metric before the ramp began, `guard_arm_failed` one it could not set up. `goal_*` is the goal loop — the trail was delivered and its goal metric is being watched, then the reading met or missed the target; `goal_replan_failed` is a re-plan after a miss that did not start (it is retried, then handed to the owner). The `autopilot_*` kinds are autopilot's own — turned on or off, an answer, an approval or a merge it made (`autopilot_acted`, the reason says which), a pause at a limit, a resume.
TrailReleaseEvent:
  type: object
  description: One row of a trail's release timeline — something the controller, autopilot or a person did to its rollout.
  properties:
    id:
      type: string
      description: Event id (a uuid).
    kind:
      $ref: "#/TrailReleaseEventKind"
    resource:
      anyOf:
        - $ref: "#/TrailResourceRef"
        - type: "null"
      description: The flag the event is about, or `null` for an event about the whole trail (autopilot's own events, or one recorded before a trail could ship behind several flags).
    step:
      type: integer
      description: The step the event is about; `-1` for none.
    fromPct:
      anyOf:
        - type: number
        - type: "null"
    toPct:
      anyOf:
        - type: number
        - type: "null"
    reason:
      anyOf:
        - type: string
        - type: "null"
      description: One line on why.
    evidence:
      anyOf:
        - type: object
          additionalProperties: true
        - type: "null"
      description: What the decision rested on — the guards that tripped, the question, the run.
    actor:
      type: string
      description: "`controller`, `autopilot`, or a person's email."
    createdAt:
      type: string
      description: ISO-8601 time.
  required:
    - id
    - kind
    - resource
    - step
    - fromPct
    - toPct
    - reason
    - evidence
    - actor
    - createdAt
  additionalProperties: false
PauseTrailRolloutRequest:
  type: object
  description: Body for `POST /api/admin/trails/{handle}/rollout/pause`.
  properties:
    reason:
      type: string
      maxLength: 500
      description: Why — shown on the release timeline.
    resource:
      type: string
      minLength: 1
      maxLength: 256
      description: The flag to pause — its trail-resource id (`TrailResource.id`) or its key. Omitted, every flag on the trail is paused.
  additionalProperties: false
ResumeTrailRolloutRequest:
  type: object
  description: Body for `POST /api/admin/trails/{handle}/rollout/resume`. Resuming reconciles the rollout with the flag, wherever a person left it, and restarts the hold.
  properties:
    reason:
      type: string
      maxLength: 500
      description: Why — shown on the release timeline.
    resource:
      type: string
      minLength: 1
      maxLength: 256
      description: The flag to resume — its trail-resource id (`TrailResource.id`) or its key. Omitted, every paused flag on the trail is resumed.
  additionalProperties: false
TrailRolloutResult:
  type: object
  description: The rollouts after a pause or a resume.
  properties:
    rollout:
      $ref: "#/TrailRolloutView"
    rollouts:
      type: array
      items:
        $ref: "#/TrailRolloutView"
      description: Every `ships_behind` flag's rollout after the call, in the order the flags were linked. `rollout` is the first of these, kept for older clients.
  required:
    - rollout
    - rollouts
  additionalProperties: false
TrailAutopilotState:
  type: string
  enum:
    - "off"
    - "on"
    - paused
  description: Where a trail's autopilot is — `off` (never turned on, or turned off), `on`, or `paused` (at a limit, or by a person; it keeps its authorizer and limits and acts on nothing).
TrailAutopilotLimits:
  type: object
  description: What autopilot may do and spend on one trail. Crossing any one pauses it at a safe point and hands the trail to its owner. The project's defaults live in `trail-gates` `autopilot`.
  properties:
    maxRisk:
      anyOf:
        - type: integer
          minimum: 0
          maximum: 100
        - type: "null"
      description: The highest Risk agent score (0-100) autopilot may merge at. `null` = no risk limit. With a limit set, a change the Risk agent has not scored (or no Risk agent at all) is a limit hit, never a pass.
    repos:
      type: array
      maxItems: 50
      items:
        type: string
        minLength: 3
        maxLength: 200
      description: Repos (`owner/repo`) autopilot may act in. Empty = any repo the trail may touch.
    types:
      type: array
      maxItems: 3
      items:
        $ref: "#/TrailType"
      description: Trail types autopilot may act on. Empty = any.
    maxFixRounds:
      type: integer
      minimum: 0
      maximum: 10
      description: Fix rounds per change before autopilot hands the trail over.
    maxPullBacks:
      type: integer
      minimum: 0
      maximum: 10
      description: Pull-backs of the rollout before autopilot hands the trail over.
    maxRuns:
      type: integer
      minimum: 0
      maximum: 100
      description: Agent runs autopilot may start in all (build, fix and investigation runs).
  required:
    - maxRisk
    - repos
    - types
    - maxFixRounds
    - maxPullBacks
    - maxRuns
  additionalProperties: false
TrailAutopilotSettings:
  type: object
  description: Turn a trail's autopilot on or off, and set the limits it acts inside. Turning it ON needs the `autopilot` capability (admins have it) and a person's identity — a dashboard session or a signed-in CLI, never an ops key, an admin key or MCP — and makes that person the accountable approver. Turning it off is open to the trail's owner, whoever authorized it, and admins.
  properties:
    enabled:
      type: boolean
      description: Whether autopilot is on.
    limits:
      type: object
      description: Limits to set; each one omitted keeps the trail's current value (the project's default for a new trail).
      properties:
        maxRisk:
          anyOf:
            - type: integer
              minimum: 0
              maximum: 100
            - type: "null"
        repos:
          type: array
          maxItems: 50
          items:
            type: string
            minLength: 3
            maxLength: 200
        types:
          type: array
          maxItems: 3
          items:
            $ref: "#/TrailType"
        maxFixRounds:
          type: integer
          minimum: 0
          maximum: 10
        maxPullBacks:
          type: integer
          minimum: 0
          maximum: 10
        maxRuns:
          type: integer
          minimum: 0
          maximum: 100
      additionalProperties: false
  required:
    - enabled
  additionalProperties: false
TrailAutopilot:
  type: object
  description: A trail's autopilot as it stands.
  properties:
    state:
      $ref: "#/TrailAutopilotState"
    authorizedBy:
      anyOf:
        - type: string
        - type: "null"
      description: The person who turned it on — the accountable approver of everything it approves and merges. `null` while it has never been on.
    authorizedAt:
      anyOf:
        - type: string
        - type: "null"
      description: ISO-8601 time it was turned on.
    pausedReason:
      anyOf:
        - type: string
        - type: "null"
      description: Why it is paused (the limit it hit, or who paused it), or `null`.
    limits:
      $ref: "#/TrailAutopilotLimits"
    runsUsed:
      type: integer
      description: Agent runs autopilot has started so far, against `limits.maxRuns`.
  required:
    - state
    - authorizedBy
    - authorizedAt
    - pausedReason
    - limits
    - runsUsed
  additionalProperties: false
PauseTrailAutopilotRequest:
  type: object
  description: Body for `POST /api/admin/trails/{handle}/autopilot/pause`.
  properties:
    reason:
      type: string
      maxLength: 500
      description: Why — shown on the timeline and to the owner.
  additionalProperties: false
ResumeTrailAutopilotRequest:
  type: object
  description: Body for `POST /api/admin/trails/{handle}/autopilot/resume`. The caller becomes the trail's accountable approver.
  properties:
    reason:
      type: string
      maxLength: 500
      description: Why — shown on the timeline.
  additionalProperties: false
TrailAutopilotResult:
  type: object
  description: The autopilot after a pause or a resume.
  properties:
    autopilot:
      $ref: "#/TrailAutopilot"
  required:
    - autopilot
  additionalProperties: false
TrailApprovalActorKind:
  type: string
  enum:
    - person
    - autopilot
  description: Who recorded an approval — a person, or autopilot on behalf of the person who authorized it.
TrailSuspectSource:
  type: string
  enum:
    - post_merge
    - intake
  description: How a suspect reached the trail — the investigating agent attributed it after a merge, or the intake matcher scored it against the trail when it was filed.
TrailPlanIntake:
  type: object
  description: What the creation dialog already decided — each field is a plan question answered in advance. The plan run asks only what is left out. Omitted entirely, the plan asks everything ("let the plan ask me").
  properties:
    requirePlan:
      type: boolean
      description: A person approves the plan before it builds, for this trail. Omitted, the project's setting (`trail-gates` `requirePlan`).
    strategy:
      $ref: "#/TrailReleaseStrategy"
    flagKey:
      type: string
      minLength: 1
      maxLength: 200
      description: The flag's key, when the person named one.
    rollout:
      $ref: "#/TrailRollout"
  additionalProperties: false
TrailPlanStatus:
  type: string
  enum:
    - none
    - drafted
    - approved
  description: Where a trail's plan stands — `none` (no plan yet), `drafted` (an agent submitted it, or a person edited it, and it waits for approval) or `approved` (a person signed it off; the build run follows it).
TrailReleaseStrategy:
  type: string
  enum:
    - straight_to_main
    - flag
    - flag_experiment
    - kill_switch
    - flag_kill_switch
    - other
  description: "How the trail ships, as the person chose it while the plan was made — `straight_to_main` (no flag), `flag`, `flag_experiment` (a flag measured by an experiment), `kill_switch` (a kill switch only), `flag_kill_switch`, or `other` (a free-text answer that fits none of those)."
TrailPlanResourceKind:
  type: string
  enum:
    - gate
    - killswitch
    - experiment
    - metric
    - event
    - alert_rule
  description: The resources a plan may list for the build to create — the release tools (a feature flag (`gate`), a kill switch, an experiment) and the tracking (an `event` to emit, a `metric` to define, an `alert_rule` to guard with).
TrailPlanResource:
  type: object
  description: One resource the build run creates and links to the trail — a release tool or a piece of tracking.
  properties:
    kind:
      $ref: "#/TrailPlanResourceKind"
    key:
      type: string
      minLength: 1
      maxLength: 200
      description: The key or name the build run creates it under, e.g. `checkout.v2`.
    role:
      $ref: "#/TrailResourceRole"
    rollout:
      $ref: "#/TrailRollout"
  required:
    - kind
    - key
  additionalProperties: false
TrailPlanRelease:
  type: object
  description: How the trail ships. The person answers this while the plan is made; the build run creates exactly the resources listed (none for `straight_to_main`), and the Plan gate checks they exist.
  properties:
    strategy:
      $ref: "#/TrailReleaseStrategy"
    reason:
      type: string
      maxLength: 2000
      description: One line on why this approach — risk, blast radius, reversibility.
    resources:
      type: array
      maxItems: 20
      items:
        $ref: "#/TrailPlanResource"
      description: The flags, kill switches, experiments and tracking (events, metrics, alert rules) to create. No release tool for `straight_to_main`; the strategy fixes which release kinds must be present (a flag for `flag`, a flag and an experiment for `flag_experiment`, and so on). A trail may ship behind several flags; each `ships_behind` flag gets its own rollout, its resource's `rollout` or else this block's.
    rollout:
      $ref: "#/TrailRollout"
    flags:
      type: array
      maxItems: 20
      items:
        $ref: "#/TrailPlanFlag"
      description: How each `gate` in `resources` is rolled out beyond its ramp — what it buckets on, the team stage, the item that removes it. One entry per gate.
    risks:
      type: array
      maxItems: 30
      items:
        $ref: "#/TrailPlanRisk"
      description: What could go wrong, how it would be seen and how it is undone. Required once the plan ships behind a release tool or has more than two items.
  required:
    - strategy
    - reason
    - resources
  additionalProperties: false
TrailBucketUnit:
  type: string
  enum:
    - user
    - org
    - device
  description: What a flag hashes on — `user`, `org` (a B2B feature never shows half a team the new behaviour) or `device` (logged-out surfaces).
TrailPlanFlag:
  type: object
  description: One flag's rollout shape.
  properties:
    key:
      type: string
      minLength: 1
      maxLength: 200
      description: The `gate` resource's key.
    bucketBy:
      $ref: "#/TrailBucketUnit"
    internalFirst:
      type: boolean
      description: Whether the project's members get it before any public percent (the team stage). On by default.
    internalSkipReason:
      anyOf:
        - type: string
          maxLength: 500
        - type: "null"
      description: Why the team stage is skipped — required when `internalFirst` is false.
    cleanup:
      type: string
      minLength: 1
      maxLength: 200
      description: The title of the breakdown item (`workKind` `code`) that removes the flag and its dead branch once it is at 100%.
  required:
    - key
    - bucketBy
    - internalFirst
    - cleanup
  additionalProperties: false
TrailRiskClass:
  type: string
  enum:
    - load
    - data
    - auth
    - third_party
    - cost
    - client_compat
    - ux
    - security
    - other
  description: The failure class a risk belongs to — the checklist the plan run walks.
TrailRiskImpact:
  type: string
  enum:
    - low
    - medium
    - high
  description: How bad it is if it happens.
TrailRollback:
  type: string
  enum:
    - flag
    - killswitch
    - revert
    - forward_fix
    - migration_down
  description: How the risk is undone once it happens. The plan must carry the tool it names.
TrailPlanRisk:
  type: object
  description: One thing that could go wrong.
  properties:
    risk:
      type: string
      minLength: 1
      maxLength: 300
      description: What could go wrong, in a line.
    class:
      $ref: "#/TrailRiskClass"
    impact:
      $ref: "#/TrailRiskImpact"
    detect:
      anyOf:
        - type: string
          pattern: "^(alert_rule|metric|experiment):.+$"
          maxLength: 220
        - type: "null"
      description: The guard that would catch it, as `kind:key` (`alert_rule:…`, `metric:…`, `experiment:…`), listed in the plan or already existing. Required for a `high` risk.
    rollback:
      $ref: "#/TrailRollback"
    mitigation:
      anyOf:
        - type: string
          maxLength: 500
        - type: "null"
      description: What the plan does to make it less likely, or `null`.
  required:
    - risk
    - class
    - impact
    - detect
    - rollback
  additionalProperties: false
TrailPlanMilestone:
  type: object
  description: A milestone the plan proposes. Created when the plan is approved.
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 120
      description: The milestone's name. Breakdown items name it in their `milestone`.
    targetDate:
      anyOf:
        - type: string
          format: date
        - type: "null"
      description: The calendar day the milestone is meant to be done by (`YYYY-MM-DD`), or `null`.
  required:
    - name
  additionalProperties: false
TrailPlanItem:
  type: object
  description: An item the plan proposes. Filed on the trail with source `plan` when the plan is approved.
  properties:
    title:
      type: string
      minLength: 1
      maxLength: 200
      description: The item's title. A replan's approval matches items already on the trail by title and files only the new ones.
    type:
      type: string
      enum:
        - bug
        - feature_request
      description: What to file the item as.
    priority:
      anyOf:
        - $ref: "#/OpsItemPriority"
        - type: "null"
      description: The item's triage priority, or `null`.
    body:
      type: string
      maxLength: 8000
      description: The item's description in markdown — what to do and how to tell it is done.
    milestone:
      anyOf:
        - type: string
          minLength: 1
          maxLength: 120
        - type: "null"
      description: The name of the breakdown milestone the item belongs to, or `null` for none.
    assignee:
      anyOf:
        - type: string
          minLength: 1
          maxLength: 200
        - type: "null"
      description: Who works the item — an agent handle (`claude`, `cursor`, `copilot`, `jules`, `muse`, `grok`) or a person's email. `null`, the project's coding agent.
    workKind:
      $ref: "#/TrailWorkKind"
    creates:
      type: array
      maxItems: 20
      items:
        type: string
        pattern: "^(event|metric|alert_rule):.+$"
        maxLength: 220
      description: On a `tracking` item, the tracking resources it creates, as `kind:key`. Every event, metric and alert rule the release lists that does not exist yet must be created by one.
    shipsDark:
      type: boolean
      description: Work that cannot sit behind a flag — a schema migration, an API contract change, a backfill. It lands first, backward compatible.
  required:
    - title
    - type
  additionalProperties: false
TrailPlanBreakdown:
  type: object
  description: The milestones and items a plan breaks the trail into. Nothing is filed while the plan is a draft; approving creates the milestones and files the items. `workKind` defaults to `code`.
  properties:
    milestones:
      type: array
      maxItems: 12
      items:
        $ref: "#/TrailPlanMilestone"
      description: The milestones, in order.
    items:
      type: array
      maxItems: 60
      items:
        $ref: "#/TrailPlanItem"
      description: The items, each in at most one milestone.
  required:
    - milestones
    - items
  additionalProperties: false
TrailPlanSource:
  type: object
  description: One thing the plan rests on — a memory entry, an earlier item or trail, or a document — and what it settled.
  properties:
    kind:
      type: string
      enum:
        - memory
        - item
        - trail
        - doc
      description: What was read — a project memory entry, a queue item, a trail, or a document.
    ref:
      type: string
      minLength: 1
      maxLength: 500
      description: A memory entry id, an item handle like `#123`, a trail handle like `T-4`, or a URL.
    note:
      type: string
      minLength: 1
      maxLength: 300
      description: What it settled for the plan.
  required:
    - kind
    - ref
    - note
  additionalProperties: false
TrailMarketingChannel:
  type: string
  enum:
    - blog
    - email
    - social
    - ads
    - landing
    - community
    - press
    - in_app
    - other
  description: Where a marketing action on a trail's plan happens.
TrailPlanMarketing:
  type: object
  description: The plan's marketing strategy — tracked, never executed. Every channel is also a breakdown item of the same title with `workKind` `marketing`, so it has an owner, a status and a place on the timeline.
  properties:
    summary:
      type: string
      maxLength: 2000
      description: Positioning and audience in a paragraph — who it is for and what it says.
    channels:
      type: array
      maxItems: 12
      items:
        type: object
        properties:
          channel:
            $ref: "#/TrailMarketingChannel"
          title:
            type: string
            minLength: 1
            maxLength: 200
            description: The breakdown item that tracks it (same title).
          timing:
            type: string
            minLength: 1
            maxLength: 120
            description: "When it lands: `before_release`, `at_release`, `at_full_rollout`, `after_goal`, or a milestone's name."
          brief:
            anyOf:
              - type: string
                maxLength: 1000
              - type: "null"
            description: One or two lines on what it is.
        required:
          - channel
          - title
          - timing
        additionalProperties: false
  required:
    - summary
    - channels
  additionalProperties: false
TrailPlanRevision:
  type: object
  description: One approved revision of a trail's plan.
  properties:
    revision:
      type: integer
      minimum: 1
      description: The revision number, from `1`.
    plan:
      type: string
      description: The plan in markdown as it was approved.
    approvedBy:
      anyOf:
        - type: string
        - type: "null"
      description: Email of the person who approved it, or `null` when autopilot approved it.
    approvedAt:
      type: string
      description: ISO-8601 time it was approved.
    summary:
      anyOf:
        - type: string
        - type: "null"
      description: What changed since the previous revision, or `null` for the first.
  required:
    - revision
    - plan
    - approvedBy
    - approvedAt
    - summary
  additionalProperties: false
ListTrailPlanRevisionsResponse:
  type: object
  description: A trail's approved plan revisions, newest first.
  properties:
    data:
      type: array
      items:
        $ref: "#/TrailPlanRevision"
  required:
    - data
  additionalProperties: false
TrailPlan:
  type: object
  description: A trail's plan — what the build run follows. Made by a read-only plan run that asks the person how to ship, then approved by a person.
  properties:
    status:
      $ref: "#/TrailPlanStatus"
    plan:
      anyOf:
        - type: string
        - type: "null"
      description: The plan in markdown, or `null` before one exists.
    release:
      anyOf:
        - $ref: "#/TrailPlanRelease"
        - type: "null"
      description: How the trail ships and the resources to create, or `null` before a plan exists.
    breakdown:
      anyOf:
        - $ref: "#/TrailPlanBreakdown"
        - type: "null"
      description: The milestones and items the plan breaks the trail into, or `null` for a plan built by one trail-level build run.
    marketing:
      anyOf:
        - $ref: "#/TrailPlanMarketing"
        - type: "null"
      description: The launch's marketing strategy, or `null` when the plan has none. Tracked only.
    sources:
      type: array
      maxItems: 30
      items:
        $ref: "#/TrailPlanSource"
      description: What the plan run read in project memory and earlier tickets that the plan rests on. Empty when it cited nothing.
    revision:
      type: integer
      minimum: 0
      description: How many times the plan has been approved — `0` while it never has, one more per approval. A drafted replan carries the revision it will replace.
    approvedBy:
      anyOf:
        - type: string
        - type: "null"
      description: Email of the person who approved it, or `null`.
    approvedAt:
      anyOf:
        - type: string
        - type: "null"
      description: ISO-8601 time it was approved, or `null`.
    requirePlan:
      type: boolean
      description: Whether a person approves this trail's plan before it builds — the trail's own choice, else the project's (`trail-gates` `requirePlan`). Off, a plan with no warnings approves itself.
    nextRun:
      type: string
      enum:
        - plan
        - build
      description: The run `trails start` fires now — `plan` while the project requires a plan and none is approved, else `build`.
    openQuestions:
      type: integer
      minimum: 0
      description: Questions the plan run asked that still wait for an answer. Read them with `ops questions list <handle>`.
    checks:
      anyOf:
        - $ref: "#/TrailPlanChecks"
        - type: "null"
      description: What the server found when the plan was submitted — the release facts it was checked against and the warnings for the approver. `null` for a plan submitted before the checks existed.
  required:
    - status
    - plan
    - release
    - breakdown
    - marketing
    - sources
    - revision
    - approvedBy
    - approvedAt
    - requirePlan
    - nextRun
    - openQuestions
    - checks
  additionalProperties: false
TrailPlanChecks:
  type: object
  description: The plan checked against the numbers. Problems reject the submit; warnings are kept here for the person who approves it, who has the final say. On an autopilot trail any warning pauses autopilot.
  properties:
    warnings:
      type: array
      items:
        type: string
      description: What the approver should know — an experiment the traffic cannot power, a first step too thin to prove anything, an operational risk with no kill switch.
    facts:
      anyOf:
        - $ref: "#/TrailReleaseFacts"
        - type: "null"
      description: The release facts the plan was checked against, or `null` when they could not be read.
    checkedAt:
      type: string
      description: ISO-8601 time the plan was checked.
  required:
    - warnings
    - facts
    - checkedAt
  additionalProperties: false
TrailReleaseFacts:
  type: object
  description: What the traffic reaching a trail's surface says about how it can ship — a traffic tier, whether an experiment could reach a result in time, and a ramp sized to it.
  properties:
    proxy:
      anyOf:
        - type: object
          properties:
            kind:
              type: string
              enum:
                - metric
                - event
                - flag
            key:
              type: string
          required:
            - kind
            - key
          additionalProperties: false
        - type: "null"
      description: What the traffic was read from — the goal metric, an event on the surface, or a flag already on it. `null` when there was nothing to read.
    tier:
      type: string
      enum:
        - none
        - low
        - medium
        - high
      description: How much traffic reaches the surface — `none` (nothing measured), `low` (under 500 units a day), `medium` (under 20 000), `high`.
    unitsPerDay:
      anyOf:
        - type: number
        - type: "null"
      description: Distinct units the proxy saw over the window, divided by its days — the rate an experiment collects units at.
    experiment:
      type: object
      properties:
        verdict:
          type: string
          enum:
            - viable
            - underpowered
            - no_data
          description: Whether a 50/50 experiment on all the traffic reaches significance within `maxDays`.
        lift:
          type: number
          description: The relative lift sized for (the goal's target over its baseline, or 5%).
        samplePerArm:
          anyOf:
            - type: integer
            - type: "null"
        daysToSignificance:
          anyOf:
            - type: integer
            - type: "null"
        mdeAtMaxDays:
          anyOf:
            - type: number
            - type: "null"
          description: The smallest relative lift `maxDays` of traffic could detect.
        maxDays:
          type: integer
      required:
        - verdict
        - lift
        - samplePerArm
        - daysToSignificance
        - mdeAtMaxDays
        - maxDays
      additionalProperties: false
    rollout:
      type: object
      description: The ramp the traffic supports — a team stage, then steps coarse where 1% is a handful of people.
      properties:
        internal:
          type: object
          properties:
            holdMinutes:
              type: integer
          required:
            - holdMinutes
          additionalProperties: false
        steps:
          type: array
          items:
            type: number
        holdMinutes:
          type: integer
        minExposure:
          type: integer
      required:
        - internal
        - steps
        - holdMinutes
        - minExposure
      additionalProperties: false
    notes:
      type: array
      items:
        type: string
      description: One line per conclusion, as the plan run and the approval panel read them.
  required:
    - proxy
    - tier
    - unitsPerDay
    - experiment
    - rollout
    - notes
  additionalProperties: false
SubmitTrailPlanRequest:
  type: object
  description: Body for `POST /api/admin/trails/{handle}/plan` — a plan run submits what it worked out, after the person answered how the trail should ship.
  properties:
    plan:
      type: string
      minLength: 1
      maxLength: 20000
      description: The plan in markdown — the approach, the files and repos it touches, the order of the work, how each acceptance criterion is met, and the risks.
    release:
      $ref: "#/TrailPlanRelease"
    breakdown:
      $ref: "#/TrailPlanBreakdown"
    marketing:
      $ref: "#/TrailPlanMarketing"
    sources:
      type: array
      maxItems: 30
      items:
        $ref: "#/TrailPlanSource"
      description: What the plan rests on in project memory (`ops memory search`) and earlier tickets and trails, each with what it settled.
    summary:
      type: string
      maxLength: 500
      description: For a replan, what changed since the last approved revision. Recorded on the revision.
  required:
    - plan
    - release
  additionalProperties: false
UpdateTrailPlanRequest:
  type: object
  description: Body for `PATCH /api/admin/trails/{handle}/plan` — a person edits the plan. Pass at least one field. Any edit puts the plan back to `drafted`, so it needs approving again.
  properties:
    plan:
      type: string
      minLength: 1
      maxLength: 20000
      description: The plan in markdown.
    release:
      $ref: "#/TrailPlanRelease"
    breakdown:
      $ref: "#/TrailPlanBreakdown"
    marketing:
      $ref: "#/TrailPlanMarketing"
  minProperties: 1
  additionalProperties: false
ApproveTrailPlanRequest:
  type: object
  description: Body for `POST /api/admin/trails/{handle}/plan/approve`.
  properties:
    startBuild:
      type: boolean
      default: false
      description: Also fire the build run once the plan is approved. Without it, approving only records the sign-off. When no coding agent is connected the request is refused with `409` before anything is approved.
    agent:
      type: string
      enum:
        - claude
        - cursor
        - copilot
        - jules
      description: Which coding agent builds, with `startBuild`. Omitted, the project's coding-agent trigger.
    connectorId:
      type: string
      description: A specific trigger connector to build with, with `startBuild`. Overrides `agent`.
  additionalProperties: false
ApproveTrailPlanResult:
  type: object
  description: The approved plan, and the build run when `startBuild` was set.
  properties:
    plan:
      $ref: "#/TrailPlan"
    run:
      anyOf:
        - $ref: "#/TrailRun"
        - type: "null"
      description: The trail-level build run that was started, or `null` when `startBuild` was not set or the build launched item runs instead.
    itemRuns:
      type: array
      items:
        $ref: "#/TrailItemRunLaunch"
      description: With `startBuild` on a plan that filed items, one entry per open item of the milestone the build started on, launched or not. Empty otherwise.
    itemsFiled:
      type: integer
      minimum: 0
      description: Items the approval filed on the trail from the plan's breakdown, with source `plan`. `0` for a plan without items, and for a replan whose items are all on the trail already.
  required:
    - plan
    - run
    - itemRuns
    - itemsFiled
  additionalProperties: false
TrailPlanResult:
  type: object
  description: The plan as recorded.
  properties:
    plan:
      $ref: "#/TrailPlan"
  required:
    - plan
  additionalProperties: false
TrailDetail:
  type: object
  description: "A trail followed from intent to release: the trail itself plus its changes, discovered items, resources, runs, suspected regressions and the project's gates. Phase and counts are recomputed live on this read."
  properties:
    id:
      type: string
      description: Stable opaque trail id (a uuid).
    number:
      type: integer
      description: Per-project trail number (the `12` in `T-12`).
    handle:
      type: string
      description: The trail's handle, `T-<number>`. Every trail endpoint accepts it or the id.
    title:
      type: string
      description: One-line statement of the intent.
    body:
      type: string
      description: The intent in markdown — the outcome and the acceptance criteria.
    type:
      $ref: "#/TrailType"
    priority:
      anyOf:
        - $ref: "#/OpsItemPriority"
        - type: "null"
      description: Triage priority, or `null` when not set.
    owner:
      $ref: "#/OpsItemOwner"
    status:
      $ref: "#/TrailStatus"
    closedReason:
      anyOf:
        - type: string
        - type: "null"
      description: Why the trail was closed, or `null` while it is open.
    phase:
      $ref: "#/TrailPhase"
    phaseReason:
      anyOf:
        - type: string
        - type: "null"
      description: One line on why the trail is in this phase, e.g. `2 of 3 changes can merge`, or `null`.
    origin:
      anyOf:
        - $ref: "#/OpsItemRef"
        - type: "null"
      description: The queue item Ship this was pressed on, or `null` for a trail created from scratch.
    repos:
      type: array
      items:
        type: string
      description: Repos (`owner/repo`) the trail may open changes in. Empty means no scope.
    changesOpen:
      type: integer
      description: Changes still open. Part of the snapshot.
    changesMergeable:
      type: integer
      description: Open changes whose merge gates all pass. Part of the snapshot.
    findingsOpenHigh:
      type: integer
      description: Open findings at `high` severity across the trail's changes. Part of the snapshot.
    itemsOpen:
      type: integer
      description: Discovered items still open. Part of the snapshot.
    resourcesCount:
      type: integer
      description: Product resources linked to the trail. Part of the snapshot.
    startDate:
      anyOf:
        - type: string
          format: date
        - type: "null"
      description: The calendar day work on the trail starts (`YYYY-MM-DD`), or `null` when not set.
    targetDate:
      anyOf:
        - type: string
          format: date
        - type: "null"
      description: The calendar day the trail is meant to ship by (`YYYY-MM-DD`), or `null` when not set. A trail past its target that has not shipped is late.
    health:
      $ref: "#/TrailHealth"
    healthSource:
      $ref: "#/TrailHealthSource"
    itemsTotal:
      type: integer
      minimum: 0
      description: Items on the trail.
    itemsDone:
      type: integer
      minimum: 0
      description: Of the items on the trail, those at `resolved`, `wont_fix` or `ready_for_qa`. Progress is `itemsDone` over `itemsTotal`.
    goal:
      anyOf:
        - $ref: "#/TrailGoal"
        - type: "null"
      description: The metric the trail is meant to move, or `null` for a trail with no goal.
    releasedPct:
      anyOf:
        - type: number
          minimum: 0
          maximum: 100
        - type: "null"
      description: The lowest prod rollout across the flags the trail ships behind, as a percent, or `null` when it ships behind none.
    mergedAt:
      anyOf:
        - type: string
        - type: "null"
      description: ISO-8601 time the first change merged, or `null`.
    shippedAt:
      anyOf:
        - type: string
        - type: "null"
      description: ISO-8601 time the trail reached `shipped`, or `null`.
    closedAt:
      anyOf:
        - type: string
        - type: "null"
      description: ISO-8601 time the trail was closed, or `null`.
    snapshotAt:
      anyOf:
        - type: string
        - type: "null"
      description: ISO-8601 time the snapshot columns (`phase`, the counts, `releasedPct`) were last rewritten. The list can lag the detail by one event; the detail read recomputes them live.
    createdAt:
      type: string
      description: ISO-8601 creation time.
    updatedAt:
      type: string
      description: ISO-8601 last-update time.
    changes:
      type: array
      items:
        $ref: "#/TrailChange"
      description: Every change worked under the trail, with its gates, evals, findings, approvals and pushes. Gates are read live from GitHub, so a `state` of `unknown` means GitHub could not be read and the PR-backed gates read `pending`.
    items:
      type: array
      items:
        $ref: "#/TrailItem"
      description: Queue items on the trail, with where each surfaced and the milestone it is in.
    milestones:
      type: array
      items:
        $ref: "#/TrailMilestone"
      description: The trail's milestones, ordered by `position`.
    resources:
      type: array
      items:
        $ref: "#/TrailResource"
      description: Product resources the trail ships or depends on, with their live state.
    runs:
      type: array
      items:
        $ref: "#/TrailRun"
      description: Runs working the trail itself, newest first.
    suspects:
      type: array
      items:
        $ref: "#/TrailSuspect"
      description: Pending suspects awaiting a person (the trail's possibly related list) — low-confidence post-merge attributions, and weak intake matches.
    gates:
      $ref: "#/TrailGates"
    plan:
      $ref: "#/TrailPlan"
    rollout:
      $ref: "#/TrailRolloutView"
    rollouts:
      type: array
      items:
        $ref: "#/TrailRolloutView"
      description: One rollout per `ships_behind` flag, in the order the flags were linked. `rollout` is the first of these, kept for older clients.
    autopilot:
      $ref: "#/TrailAutopilot"
    releaseEvents:
      type: array
      items:
        $ref: "#/TrailReleaseEvent"
      description: The release timeline, newest first (the latest 100).
    goalStatus:
      anyOf:
        - $ref: "#/TrailGoalStatus"
        - type: "null"
      description: The goal loop, or `null` when the trail has no goal metric with a target.
  required:
    - id
    - number
    - handle
    - title
    - body
    - type
    - priority
    - owner
    - status
    - closedReason
    - phase
    - phaseReason
    - origin
    - repos
    - changesOpen
    - changesMergeable
    - findingsOpenHigh
    - itemsOpen
    - resourcesCount
    - startDate
    - targetDate
    - health
    - healthSource
    - itemsTotal
    - itemsDone
    - goal
    - releasedPct
    - mergedAt
    - shippedAt
    - closedAt
    - snapshotAt
    - createdAt
    - updatedAt
    - changes
    - items
    - milestones
    - resources
    - runs
    - suspects
    - gates
    - plan
    - rollout
    - rollouts
    - autopilot
    - releaseEvents
    - goalStatus
  additionalProperties: false
TrailGoalState:
  type: string
  enum:
    - none
    - watching
    - met
    - missed
  description: Where a trail's goal stands — `none` until the trail is delivered, `watching` through the watch window, then `met` or `missed`. A new plan revision puts it back to `none`.
TrailGoalStatus:
  type: object
  description: The goal loop on a trail with a goal metric and a target.
  properties:
    state:
      $ref: "#/TrailGoalState"
    watchFrom:
      anyOf:
        - type: string
        - type: "null"
      description: ISO-8601 time the watch window started, or `null`.
    judgeAt:
      anyOf:
        - type: string
        - type: "null"
      description: ISO-8601 time the goal metric is read, or `null` while not watched.
    value:
      anyOf:
        - type: number
        - type: "null"
      description: The reading the verdict rests on — the goal metric averaged over the window — or `null`.
    replans:
      type: integer
      minimum: 0
      description: Re-plans shipeasy started on its own after a miss.
    maxReplans:
      type: integer
      minimum: 0
      description: The cap on those (`trail-gates` `maxGoalReplans`).
  required:
    - state
    - watchFrom
    - judgeAt
    - value
    - replans
    - maxReplans
  additionalProperties: false
TrailTimelineEventKind:
  type: string
  enum:
    - created
    - closed
    - plan_approved
    - question_asked
    - question_answered
    - run_started
    - run_finished
    - item_filed
    - item_done
    - item_reopened
    - change_opened
    - change_merged
    - change_closed
    - change_approved
    - release
    - attributed
  description: What a timeline event is. `release` carries the release timeline's own kind (a rollout step, a breach, a pull-back, autopilot, the goal loop) in `release.kind`.
TrailTimelineOption:
  type: object
  description: One option of a decided question — the fork it offered.
  properties:
    label:
      type: string
    description:
      anyOf:
        - type: string
        - type: "null"
    picked:
      type: boolean
      description: Whether this is the way the trail went.
  required:
    - label
    - description
    - picked
  additionalProperties: false
TrailTimelineEvent:
  type: object
  description: One thing that happened on a trail. Exactly the reference fields its kind is about are set; the rest are `null`.
  properties:
    id:
      type: string
      description: Stable id of the event, unique within the trail's timeline.
    at:
      type: string
      description: ISO-8601 time it happened.
    kind:
      $ref: "#/TrailTimelineEventKind"
    actor:
      anyOf:
        - type: string
        - type: "null"
      description: Who did it — a person's email, `controller`, `autopilot`, or a coding agent's name — or `null` when unknown.
    decision:
      type: boolean
      description: Whether this is a decision a person (or autopilot on a person's authority) made — an answered question, an approved plan revision, a rollout call, an approved change, a decided suspect.
    detail:
      anyOf:
        - type: string
        - type: "null"
      description: A short note — a reason, a summary, a run's outcome, a bypass reason — or `null`.
    item:
      anyOf:
        - type: object
          properties:
            id:
              type: string
            number:
              type: integer
            title:
              type: string
            status:
              $ref: "#/OpsItemStatus"
            workKind:
              anyOf:
                - $ref: "#/TrailWorkKind"
                - type: "null"
            source:
              anyOf:
                - $ref: "#/TrailDiscoveredSource"
                - type: "null"
            milestone:
              anyOf:
                - type: string
                - type: "null"
              description: The milestone the item is in, by name.
            closesMilestone:
              type: boolean
              description: On `item_done`, whether it was the last open item of its milestone.
          required:
            - id
            - number
            - title
            - status
            - workKind
            - source
            - milestone
            - closesMilestone
          additionalProperties: false
        - type: "null"
    change:
      anyOf:
        - $ref: "#/TrailChangeRef"
        - type: "null"
    question:
      anyOf:
        - type: object
          properties:
            id:
              type: string
            header:
              type: string
            question:
              type: string
            on:
              type: string
              enum:
                - trail
                - item
              description: Asked on the trail itself, or on one of its items (then `item` is set too).
            options:
              type: array
              items:
                $ref: "#/TrailTimelineOption"
            other:
              anyOf:
                - type: string
                - type: "null"
              description: A free-text answer, when one was given.
          required:
            - id
            - header
            - question
            - on
            - options
            - other
          additionalProperties: false
        - type: "null"
    revision:
      anyOf:
        - type: object
          properties:
            revision:
              type: integer
            summary:
              anyOf:
                - type: string
                - type: "null"
            strategy:
              anyOf:
                - $ref: "#/TrailReleaseStrategy"
                - type: "null"
            items:
              type: integer
              description: Items in the revision's breakdown.
          required:
            - revision
            - summary
            - strategy
            - items
          additionalProperties: false
        - type: "null"
    run:
      anyOf:
        - type: object
          properties:
            id:
              type: string
            kind:
              $ref: "#/TrailRunKind"
            state:
              $ref: "#/TrailRunState"
            agent:
              anyOf:
                - type: string
                - type: "null"
            sessionUrl:
              anyOf:
                - type: string
                - type: "null"
              description: The agent's session, where its provider has one to open.
            error:
              anyOf:
                - type: string
                - type: "null"
              description: Why a failed run failed.
          required:
            - id
            - kind
            - state
            - agent
            - sessionUrl
            - error
          additionalProperties: false
        - type: "null"
    release:
      anyOf:
        - type: object
          properties:
            kind:
              $ref: "#/TrailReleaseEventKind"
            resourceKey:
              anyOf:
                - type: string
                - type: "null"
              description: The flag the event is about, or `null` for the whole trail.
            resourceKind:
              anyOf:
                - $ref: "#/TrailResourceKind"
                - type: "null"
              description: The kind of entity `resourceKey` names.
            resourceId:
              anyOf:
                - type: string
                - type: "null"
              description: The entity's id, to open its detail.
            metric:
              anyOf:
                - type: object
                  description: The metric the event reacted to — a guard's metric when a guard tripped, the goal metric when the goal was watched, met or missed — with the level that mattered (the guard's limit, the goal's target).
                  properties:
                    id:
                      type: string
                    key:
                      type: string
                    threshold:
                      anyOf:
                        - type: number
                        - type: "null"
                  required:
                    - id
                    - key
                    - threshold
                  additionalProperties: false
                - type: "null"
            alert:
              anyOf:
                - type: object
                  description: The alert behind the event — the guard rule that fired and the alert ticket it raised when a guard tripped, or the rule that was armed.
                  properties:
                    ruleId:
                      type: string
                    ruleName:
                      type: string
                    ticket:
                      anyOf:
                        - type: object
                          properties:
                            id:
                              type: string
                              description: The alert ticket's id (a uuid).
                            number:
                              type: integer
                              description: Its number, to open its detail.
                          required:
                            - id
                            - number
                          additionalProperties: false
                        - type: "null"
                      description: The alert ticket the rule raised; `null` when the rule has not fired.
                  required:
                    - ruleId
                    - ruleName
                    - ticket
                  additionalProperties: false
                - type: "null"
            fromPct:
              anyOf:
                - type: number
                - type: "null"
            toPct:
              anyOf:
                - type: number
                - type: "null"
          required:
            - kind
            - resourceKey
            - resourceKind
            - resourceId
            - metric
            - alert
            - fromPct
            - toPct
          additionalProperties: false
        - type: "null"
  required:
    - id
    - at
    - kind
    - actor
    - decision
    - detail
    - item
    - change
    - question
    - revision
    - run
    - release
  additionalProperties: false
TrailTimelineResponse:
  type: object
  properties:
    events:
      type: array
      items:
        $ref: "#/TrailTimelineEvent"
      description: Newest first.
    next:
      anyOf:
        - type: string
        - type: "null"
      description: Pass as `before` to read the page after this one; `null` at the trailhead.
  required:
    - events
    - next
  additionalProperties: false
ListTrailsResponse:
  type: object
  description: A page of trails, in the standard `{ data, next_cursor }` envelope.
  properties:
    data:
      type: array
      items:
        $ref: "#/Trail"
    next_cursor:
      anyOf:
        - type: string
        - type: "null"
      description: Opaque cursor for the next page, or `null` on the last.
    section_counts:
      type: object
      additionalProperties:
        type: integer
      description: Rows per section across the whole filtered result, when the sort groups rows (e.g. by phase). Only on `view=table`.
    grouped:
      type: boolean
      description: Whether the page is section-ordered, so the sections earn their headers. Only on `view=table`.
  required:
    - data
    - next_cursor
  additionalProperties: false
CreateTrailRequest:
  type: object
  description: Body for `POST /api/admin/trails`. A trail is created on purpose — from scratch, or from an item with `originItem`. Omitted, `type` follows the origin item (a bug is a `bug`, a feature request a `feature`) and is otherwise `task`.
  properties:
    title:
      type: string
      description: One-line statement of the intent.
      minLength: 1
      maxLength: 200
      pattern: ^\S(.*\S)?$
    body:
      type: string
      description: The intent in markdown — the outcome and the acceptance criteria.
      maxLength: 20000
      default: ""
    type:
      $ref: "#/TrailType"
    priority:
      anyOf:
        - $ref: "#/OpsItemPriority"
        - type: "null"
      description: Initial triage priority, or `null`.
    ownerId:
      anyOf:
        - type: string
        - type: "null"
      description: The `users.id` of the person to own the trail, or `null`.
    ownerConnectorId:
      anyOf:
        - type: string
        - type: "null"
      description: The agent connector to own the trail, or `null`.
    repos:
      type: array
      items:
        type: string
        minLength: 3
        maxLength: 200
      description: Repos (`owner/repo`) the trail may open changes in.
      maxItems: 20
      default: []
    originItem:
      type: string
      description: "Ship this: a queue item (number or id) to create the trail from. Its description seeds `body` when that is omitted, and it becomes the trail's first item with source `origin`."
      minLength: 1
      maxLength: 64
    startDate:
      anyOf:
        - type: string
          format: date
        - type: "null"
      description: The calendar day work starts (`YYYY-MM-DD`), or `null`.
    targetDate:
      anyOf:
        - type: string
          format: date
        - type: "null"
      description: The calendar day the trail is meant to ship by (`YYYY-MM-DD`), or `null`.
    health:
      anyOf:
        - $ref: "#/TrailHealth"
        - type: "null"
      description: A health a person sets, or `null` (the default) to have it derived.
    goal:
      anyOf:
        - $ref: "#/TrailGoalSpec"
        - type: "null"
      description: The metric the trail is meant to move, or `null` for none.
    intake:
      $ref: "#/TrailPlanIntake"
    autopilot:
      $ref: "#/TrailAutopilotSettings"
  required:
    - title
  additionalProperties: false
UpdateTrailRequest:
  type: object
  description: Body for `PATCH /api/admin/trails/{handle}`. Pass at least one field; omitted ones are left as they are.
  properties:
    title:
      type: string
      minLength: 1
      maxLength: 200
      pattern: ^\S(.*\S)?$
    body:
      type: string
      maxLength: 20000
    type:
      $ref: "#/TrailType"
    priority:
      anyOf:
        - $ref: "#/OpsItemPriority"
        - type: "null"
      description: Triage priority; `null` clears it.
    ownerId:
      anyOf:
        - type: string
        - type: "null"
      description: The `users.id` of the person owner; `null` unassigns.
    ownerConnectorId:
      anyOf:
        - type: string
        - type: "null"
      description: The agent connector owner; `null` unassigns.
    repos:
      type: array
      items:
        type: string
        minLength: 3
        maxLength: 200
      description: Replaces the trail's repo scope.
      maxItems: 20
    startDate:
      anyOf:
        - type: string
          format: date
        - type: "null"
      description: The calendar day work starts (`YYYY-MM-DD`); `null` clears it.
    targetDate:
      anyOf:
        - type: string
          format: date
        - type: "null"
      description: The calendar day the trail is meant to ship by (`YYYY-MM-DD`); `null` clears it.
    health:
      anyOf:
        - $ref: "#/TrailHealth"
        - type: "null"
      description: Set the health by hand; `null` goes back to the derived health.
    goal:
      anyOf:
        - $ref: "#/TrailGoalSpec"
        - type: "null"
      description: Replaces the trail's goal; `null` clears it.
    autopilot:
      $ref: "#/TrailAutopilotSettings"
  additionalProperties: false
CloseTrailRequest:
  type: object
  description: Body for `POST /api/admin/trails/{handle}/close`.
  properties:
    reason:
      type: string
      description: Why the trail is being closed, e.g. `abandoned` or `superseded by T-14`.
      maxLength: 2000
  additionalProperties: false
LinkTrailPrRequest:
  type: object
  description: Body for `POST /api/admin/trails/{handle}/changes`.
  properties:
    prUrl:
      type: string
      description: The pull request's URL.
      minLength: 1
      maxLength: 500
    item:
      type: string
      description: The queue item whose run opened the PR (number or id), when there is one. Omitted, the change belongs to the trail itself.
      minLength: 1
      maxLength: 64
  required:
    - prUrl
  additionalProperties: false
StartTrailRunRequest:
  type: object
  description: "Body for `POST /api/admin/trails/{handle}/runs`. Fires the project's coding-agent trigger with a trail prompt: the intent, the acceptance criteria, the linked resources and the open discovered items."
  properties:
    agent:
      type: string
      description: Which coding agent to fire — `claude`, `cursor`, `copilot` or `jules`. Omitted, the project's coding-agent trigger.
      enum:
        - claude
        - cursor
        - copilot
        - jules
    connectorId:
      type: string
      description: A specific trigger connector to fire. Overrides `agent`.
    kind:
      type: string
      enum:
        - plan
        - build
        - replan
      description: "Which run to fire. Omitted, the server picks — `plan` while the trail has no approved plan, else `build`. Asking for `build` before the plan is approved is refused with `409`, and so is asking for `plan` once one is approved: edit the plan, or fire `replan`. `replan` is allowed only once a plan is approved: a read-only run that re-reads the goal metric, the items' outcomes and project memory and submits the next revision, which waits as `drafted` for approval."
    prompt:
      type: string
      description: Extra instructions appended to the trail prompt.
      maxLength: 8000
  additionalProperties: false
PromoteTrailFindingRequest:
  type: object
  description: Body for `POST /api/admin/trails/{handle}/findings/{findingId}/promote`.
  properties:
    type:
      type: string
      enum:
        - bug
        - feature_request
      description: What to file the finding as. Defaults to `bug`.
    reason:
      type: string
      description: Why the finding is out of scope for this trail. Recorded on the finding.
      minLength: 1
      maxLength: 2000
    title:
      type: string
      description: A title for the new item. Defaults to the finding's title.
      minLength: 1
      maxLength: 200
  required:
    - reason
  additionalProperties: false
PromoteTrailFindingResponse:
  type: object
  description: "The item created from the finding (on the trail, source `finding`) and the finding, now dismissed as `moved to #N`."
  properties:
    item:
      $ref: "#/TrailItem"
    finding:
      $ref: "#/TrailFinding"
  required:
    - item
    - finding
  additionalProperties: false
ListTrailResourcesResponse:
  type: object
  description: The trail's resources, with their live state.
  properties:
    data:
      type: array
      items:
        $ref: "#/TrailResource"
  required:
    - data
  additionalProperties: false
AddTrailResourceRequest:
  type: object
  description: Body for `POST /api/admin/trails/{handle}/resources`. When `role` is omitted it is guessed from the kind. Linking the same entity again changes its role.
  properties:
    kind:
      $ref: "#/TrailResourceKind"
    resourceKey:
      type: string
      description: The entity's key (a gate or metric name, an experiment name, an i18n key). It must exist.
      minLength: 1
      maxLength: 256
    role:
      $ref: "#/TrailResourceRole"
  required:
    - kind
    - resourceKey
  additionalProperties: false
AddTrailItemRequest:
  type: object
  description: Body for `POST /api/admin/trails/{handle}/items`. The item is recorded with source `attached`.
  properties:
    item:
      type: string
      description: The queue item to put on the trail (number or id). An item is on at most one trail.
      minLength: 1
      maxLength: 64
    milestoneId:
      type: string
      minLength: 1
      maxLength: 64
      description: The milestone to put the item in (`TrailMilestone.id`). Omitted, the item is in no milestone.
  required:
    - item
  additionalProperties: false
AttributeTrailRequest:
  type: object
  description: Body for `POST /api/admin/trails/{handle}/attributions`.
  properties:
    item:
      type: string
      description: The error, alert or bug to attribute (number or id).
      minLength: 1
      maxLength: 64
    confidence:
      $ref: "#/TrailAttributionConfidence"
    evidence:
      type: string
      description: "Concrete evidence: a stack frame in a changed file, the failing call touching a resource of the trail, or a guard metric of the trail."
      minLength: 1
      maxLength: 4000
  required:
    - item
    - confidence
    - evidence
  additionalProperties: false
AttributeTrailResponse:
  type: object
  description: What an attribution did.
  properties:
    attached:
      type: boolean
      description: True when the item was put on the trail (`high` or `medium` confidence). False when only a suspect was recorded.
    item:
      anyOf:
        - $ref: "#/TrailItem"
        - type: "null"
      description: The item as it now sits on the trail, or `null` for a suspect.
    suspect:
      anyOf:
        - $ref: "#/TrailSuspect"
        - type: "null"
      description: The suspect recorded for a `low` confidence attribution, or `null`.
  required:
    - attached
    - item
    - suspect
  additionalProperties: false
TrailOkResponse:
  type: object
  description: Response for the trail detach endpoints.
  properties:
    ok:
      type: boolean
      const: true
      description: Always `true` — the link was removed.
  required:
    - ok
  additionalProperties: false
CreateTrailMilestoneRequest:
  type: object
  description: Body for `POST /api/admin/trails/{handle}/milestones`.
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 120
      pattern: ^\S(.*\S)?$
      description: The milestone's name.
    description:
      anyOf:
        - type: string
          maxLength: 2000
        - type: "null"
      description: What the milestone delivers, or `null`.
    targetDate:
      anyOf:
        - type: string
          format: date
        - type: "null"
      description: The calendar day it is meant to be done by (`YYYY-MM-DD`), or `null`.
    position:
      type: integer
      minimum: 0
      description: Where to put it in the trail's order, from `0`; the milestones at and after it move down one. Omitted, it goes last.
  required:
    - name
  additionalProperties: false
UpdateTrailMilestoneRequest:
  type: object
  description: Body for `PATCH /api/admin/trails/{handle}/milestones/{milestoneId}`. Pass at least one field; omitted ones are left as they are.
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 120
      pattern: ^\S(.*\S)?$
      description: The milestone's name.
    description:
      anyOf:
        - type: string
          maxLength: 2000
        - type: "null"
      description: What the milestone delivers; `null` clears it.
    targetDate:
      anyOf:
        - type: string
          format: date
        - type: "null"
      description: The calendar day it is meant to be done by (`YYYY-MM-DD`); `null` clears it.
    position:
      type: integer
      minimum: 0
      description: Move it to this place in the trail's order, from `0`; the others shift to make room.
  minProperties: 1
  additionalProperties: false
MoveTrailItemRequest:
  type: object
  description: Body for `PATCH /api/admin/trails/{handle}/items/{itemHandle}`.
  properties:
    milestoneId:
      anyOf:
        - type: string
          minLength: 1
          maxLength: 64
        - type: "null"
      description: The milestone to move the item into (`TrailMilestone.id`), or `null` to take it out of every milestone.
  required:
    - milestoneId
  additionalProperties: false
TrailItemRunLaunch:
  type: object
  description: What a build did for one item of the milestone it worked on.
  properties:
    item:
      $ref: "#/OpsItemRef"
    launched:
      type: boolean
      description: True when an item run was launched for it.
    reason:
      anyOf:
        - type: string
        - type: "null"
      description: Why no run was launched (a run already works it, every slot is taken, the launch failed), or `null` when one was.
  required:
    - item
    - launched
    - reason
  additionalProperties: false
StartTrailRunResult:
  type: object
  description: What starting an agent on a trail launched — one trail-level run, or item runs for the current milestone.
  properties:
    run:
      anyOf:
        - $ref: "#/TrailRun"
        - type: "null"
      description: The trail-level run that was started (a plan, replan or build run), or `null` when the build launched item runs instead.
    itemRuns:
      type: array
      items:
        $ref: "#/TrailItemRunLaunch"
      description: For a build whose approved plan filed items, one entry per open item of the milestone it built, launched or not. Empty for a trail-level run.
  required:
    - run
    - itemRuns
  additionalProperties: false
