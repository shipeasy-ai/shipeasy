    tags:
      type: array
      maxItems: 50
      items:
        $ref: ./tags.yaml#/TagName
      default: []
      description: >-
        Tag names to label the item with, e.g. `["ios", "checkout"]`. Each name
        is matched case-insensitively against the project's existing tags and
        reuses that tag (keeping its stored casing) when one matches; a name with
        no match creates a new project tag.
    reporterEmail:
      anyOf:
        - type: string
