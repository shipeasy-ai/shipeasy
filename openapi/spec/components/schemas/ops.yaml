    - model
    - connectorId
    - prNumber
    - prUrl
    - sources
    - confidence
    - tokensUsed
    - durationMs
    - visibility
    - startedAt
    - completedAt
    - sessionId
    - sessionUrl
    - ackedBy
    - completedAction
    - createdAt
    - updatedAt
