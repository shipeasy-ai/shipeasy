AlertApiRow:
  type: object
  description: |-
    One FIRED alert — an INSTANCE of a condition the platform observed, not the rule that defines it (alert *rules* are the `/api/admin/alert-rules` resource). Instances are never filed by hand: the UI (killswitch flips) and the worker (analysis consumer + alerts cron) open them, keyed by `(source, dedupeKey)`, and at most one instance per condition is open at a time — re-raising refreshes the open one, and the condition clearing closes it.

    An instance IS an ops queue item (`/api/admin/ops` with `type: "alert"`) seen through the alert lens: same `id`, `severity` is that item's `priority`, and `status` is its work status projected onto three states. Resolving the queue item and clearing the alert are therefore the same act.

    Every field is always present on the wire; nullable fields are `null`, never absent.
  properties:
    id:
      type: string
      description: Stable opaque instance id — also the id of the ops queue item this instance is.
    source:
      type: string
      enum:
        - metric_rule
        - killswitch_armed
        - experiment_srm
        - experiment_peek
        - guardrail
      description: Which platform subsystem raised the alert — a metric-threshold rule crossing (`metric_rule`), an armed kill switch (`killswitch_armed`), a sample-ratio mismatch or peeking guard on an experiment (`experiment_srm` / `experiment_peek`), or a guardrail-metric breach (`guardrail`).
    ruleId:
      description: >-
        Id of the alert rule that raised it (`ar_…`), for `source: metric_rule`.
        `null` for alerts raised outside the rules engine.
      anyOf:
        - type: string
        - type: "null"
    severity:
      type: string
      enum:
        - danger
        - warn
        - info
      description: How loud the alert is — `danger` pages, `warn` is the default, `info` is FYI-only. Severity belongs to the RULE and seeds the instance's queue `priority` (`danger`→`critical`, `warn`→`high`, `info`→`medium`); it is read back from there, so re-prioritising the queue item changes what this reports.
    dedupeKey:
      type: string
      description: Idempotency + reconcile key within `(project, source)` — re-raising the same condition refreshes the open instance instead of stacking duplicates, and the condition clearing closes it. A later firing of the same condition opens a NEW instance with its own `id`.
    title:
      type: string
      description: Short human-readable headline (what fired).
    detail:
      type: string
      description: Longer human-readable explanation — the observed condition, thresholds, and context.
    href:
      description: Dashboard-relative link to the surface that explains the alert (e.g. the experiment or kill switch page), or `null` if there is no single destination.
      anyOf:
        - type: string
        - type: "null"
    observedValue:
      description: The numeric value that tripped the condition (e.g. the metric aggregate a rule compared against its threshold), or `null` when the source has no scalar observation.
      anyOf:
        - type: number
        - type: "null"
    status:
      type: string
      enum:
        - active
        - resolved
        - dismissed
      description: 'Lifecycle state, projected from the queue item''s work status. `active` means the item is still open, i.e. the condition holds (shown as "Firing" in the UI); `resolved` means it cleared (auto, when the raiser reconciles, or by hand); `dismissed` means a human waved it off (the item is closed `wont_fix`).'
    createdAt:
      type: string
      description: ISO-8601 timestamp this instance opened — when the condition started firing.
    resolvedAt:
      description: ISO-8601 timestamp the alert flipped to `resolved`, or `null` while it hasn't.
      anyOf:
        - type: string
        - type: "null"
    dismissedAt:
      description: ISO-8601 timestamp the alert was dismissed, or `null` while it hasn't been.
      anyOf:
        - type: string
        - type: "null"
    assigneeId:
      description: PERSON owner of the triage — a `users.id` (soft reference, same value space as a feedback item's `assigneeId`), or `null` if unassigned. Set from the ops cockpit's Owner column; independent of the agent half.
      anyOf:
        - type: string
        - type: "null"
    assigneeConnectorId:
      description: AGENT owner — the id of a connected trigger connector (`connectors.id`), or `null`. Mutually exclusive with `assigneeAgent`.
      anyOf:
        - type: string
        - type: "null"
    assigneeAgent:
      description: AGENT owner — a built-in hosted Shipeasy agent (`"jarvis"`, Enterprise-gated), or `null`. Mutually exclusive with `assigneeConnectorId`.
      anyOf:
        - type: string
        - type: "null"
  required:
    - id
    - source
    - ruleId
    - severity
    - dedupeKey
    - title
    - detail
    - href
    - observedValue
    - status
    - createdAt
    - resolvedAt
    - dismissedAt
    - assigneeId
    - assigneeConnectorId
    - assigneeAgent
  additionalProperties: false
ListAlertsResponse:
  type: array
  description: A bare JSON array of fired alerts, ordered by `createdAt` descending. There is no pagination envelope.
  items:
    $ref: "#/AlertApiRow"
UpdateAlertRequest:
  type: object
  description: |-
    Body for `PATCH /api/admin/alerts/{id}` — the triage writes the ops cockpit needs on a fired alert. All fields optional, at least one required; only the fields present are changed.

    Flipping `status` stamps the matching timestamp (`resolvedAt` on `resolved`, `dismissedAt` on `dismissed`; both cleared on `active`). The person owner (`assigneeId`) and the agent owner (`agent`) are independent halves — setting one never touches the other.
  properties:
    status:
      type: string
      enum:
        - active
        - resolved
        - dismissed
      description: New lifecycle state, written through to the queue item (`resolved` / `wont_fix` / `open`). `resolved` / `dismissed` stamp their timestamp; `active` re-opens and clears both.
    assigneeId:
      description: PERSON owner — a `users.id`, or `null` to clear the assignment.
      anyOf:
        - type: string
        - type: "null"
    agent:
      description: AGENT owner — a connected trigger connector's id (`connectors.id`), the built-in `"jarvis"` (Enterprise plan only — rejected with `403` otherwise), or `null` to clear. Stored in `assigneeConnectorId` or `assigneeAgent` depending on the value; the two are mutually exclusive.
      anyOf:
        - type: string
        - type: "null"
  minProperties: 1
  additionalProperties: false
UpdateAlertResponse:
  $ref: "#/AlertApiRow"
AlertRelaxField:
  type: string
  enum:
    - threshold
    - rangeMin
    - rangeMax
    - sigma
    - requiredBuckets
    - windowHours
    - noDataMinutes
  description: An alert-rule field a noise relaxation changes — `threshold` / `rangeMin` / `rangeMax` / `sigma` (the value), `requiredBuckets` (the buckets), `windowHours` / `noDataMinutes` (the time).
AlertRelaxDimension:
  type: string
  enum:
    - value
    - buckets
    - time
  description: Which way a relaxation makes the rule harder to trip — a looser bound (`value`), more breaching buckets (`buckets`), or a longer window (`time`).
AlertRelaxPatch:
  type: object
  description: The alert-rule fields the relaxation changes, in `PATCH /api/admin/alert-rules/{id}` body shape. Only changed fields are present — a warning / recovery level that moves with the bound, and `bucketMinutes` when a longer window pins the bucket width, appear beside the named field.
  properties:
    threshold:
      type: number
    rangeMin:
      type: number
    rangeMax:
      type: number
    sigma:
      type: number
    warnThreshold:
      type: number
    recoveryThreshold:
      type: number
    requiredBuckets:
      type: integer
    windowHours:
      type: integer
    bucketMinutes:
      type: integer
    noDataMinutes:
      type: integer
  additionalProperties: false
AlertRelaxOption:
  type: object
  description: One suggested relaxation — the smallest change on one field whose backtest would have kept this alert quiet.
  properties:
    field:
      $ref: "#/AlertRelaxField"
    dimension:
      $ref: "#/AlertRelaxDimension"
    from:
      description: The field's current value, or `null` when it is unset.
      anyOf:
        - type: number
        - type: "null"
    to:
      type: number
      description: The suggested value.
    patch:
      $ref: "#/AlertRelaxPatch"
    firesBefore:
      type: integer
      description: How many times the rule as it is fired over the replayed span.
    firesAfter:
      type: integer
      description: How many times it would have fired with this change.
    recommended:
      type: boolean
      description: True on exactly one option — the one that gives up the fewest other firings.
    summary:
      type: string
      description: The change as one plain sentence.
  required:
    - field
    - dimension
    - from
    - to
    - patch
    - firesBefore
    - firesAfter
    - recommended
    - summary
  additionalProperties: false
AlertRelaxUnavailable:
  type: object
  description: A field the rule could in principle be relaxed on, with why the backtest has no suggestion for it.
  properties:
    field:
      $ref: "#/AlertRelaxField"
    dimension:
      $ref: "#/AlertRelaxDimension"
    reason:
      type: string
  required:
    - field
    - dimension
    - reason
  additionalProperties: false
AlertRelaxPlan:
  type: object
  description: Every relaxation worth offering for one noisy firing, from a backtest of its rule.
  properties:
    alertId:
      type: string
    ruleId:
      description: The rule that raised the alert, or `null` for an alert no metric rule raised.
      anyOf:
        - type: string
        - type: "null"
    reproduced:
      type: boolean
      description: Whether the replay reproduced this firing. When it does not (the data or the rule changed since), no option is offered.
    firesBefore:
      type: integer
      description: Firings of the rule as it is over the replayed span.
    span:
      description: The replayed span, or `null` when nothing was replayed.
      anyOf:
        - type: object
          properties:
            from:
              type: string
              description: ISO-8601 start of the replayed span.
            to:
              type: string
              description: ISO-8601 end of the replayed span.
            bucketMinutes:
              type: number
              description: The bucket width the rule was replayed at.
          required:
            - from
            - to
            - bucketMinutes
          additionalProperties: false
        - type: "null"
    options:
      type: array
      items:
        $ref: "#/AlertRelaxOption"
    unavailable:
      type: array
      items:
        $ref: "#/AlertRelaxUnavailable"
  required:
    - alertId
    - ruleId
    - reproduced
    - firesBefore
    - span
    - options
    - unavailable
  additionalProperties: false
MarkAlertNoiseRequest:
  type: object
  description: Body for `POST /api/admin/alerts/{id}/noise`. Empty marks the alert as noise without touching its rule.
  properties:
    relax:
      description: '`recommended` applies the recommended suggestion; a field name applies that field''s suggestion, or exactly `value` when given. Omit to leave the rule alone.'
      anyOf:
        - type: string
          enum:
            - recommended
        - $ref: "#/AlertRelaxField"
    value:
      type: number
      description: Exact value for the `relax` field. Must loosen the rule. Requires `relax` to name a field.
  additionalProperties: false
MarkAlertNoiseResponse:
  type: object
  properties:
    alert:
      $ref: "#/AlertApiRow"
    relaxed:
      description: The relaxation applied to the rule, or `null` when the rule was left alone.
      anyOf:
        - type: object
          properties:
            field:
              $ref: "#/AlertRelaxField"
            from:
              anyOf:
                - type: number
                - type: "null"
            to:
              type: number
            patch:
              $ref: "#/AlertRelaxPatch"
          required:
            - field
            - from
            - to
            - patch
          additionalProperties: false
        - type: "null"
  required:
    - alert
    - relaxed
  additionalProperties: false
