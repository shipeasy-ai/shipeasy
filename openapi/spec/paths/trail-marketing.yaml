    - Marketing lists
    parameters:
    - $ref: ../components/parameters.yaml#/ProjectId
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/trail-marketing.yaml#/CreateMarketingListRequest
          example:
            name: Beta waitlist
            csv: 'email,name

              jane@example.com,Jane Doe'
            attestation:
              statement: Everyone on this list opted in to product emails from us
              accepted: true
    responses:
