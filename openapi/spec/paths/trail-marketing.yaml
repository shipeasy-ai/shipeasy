/api/admin/trails/{handle}/marketing:
  get:
    operationId: listTrailMarketingAssets
    summary: List a trail's marketing assets
    description: 'Every email, post and ad drafted on the trail, oldest first, with its state, its approval, its delivery evidence (sent / suppressed / failed counts, or the post or campaign URL) and whether
      its timing would let it go out now.


      Served only while the `trail_marketing` flag is on for the project; otherwise `404`.


      Safe for the restricted ops key.


      **Use case:** Before the release, check which announcements are still waiting on a person''s approval.'
    tags:
    - Marketing
    parameters:
    - $ref: ../components/parameters.yaml#/ProjectId
    - $ref: ../components/parameters.yaml#/TrailHandle
    responses:
      '200':
        description: The trail's assets
        content:
          application/json:
            schema:
              $ref: ../components/schemas/trail-marketing.yaml#/ListTrailMarketingAssetsResponse
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
    x-error-codes:
    - UNAUTHORIZED
    - FORBIDDEN
    - NOT_FOUND
    x-cli:
      name: list
      positional:
      - handle
  post:
    operationId: createTrailMarketingAsset
    summary: Draft a marketing asset
    description: 'Draft an email, post or ad for one of the trail''s marketing channels. The channel decides the kind: `email` makes an email, `ads` an ad, every other channel a post. The draft goes nowhere
      until it is submitted and a person approves it.


      Served only while the `trail_marketing` flag is on for the project; otherwise `404`.


      Safe for the restricted ops key.


      **Use case:** An agent drafts the launch email for the trail''s members from the plan''s marketing block.'
    tags:
    - Marketing
    parameters:
    - $ref: ../components/parameters.yaml#/ProjectId
    - $ref: ../components/parameters.yaml#/TrailHandle
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/trail-marketing.yaml#/CreateTrailMarketingAssetRequest
          example:
            channel: email
            timing: at_full_rollout
            content:
              subject: Trails now deliver your launch
              text: Read more at https://shipeasy.ai/changelog
            audience:
              members: all
    responses:
      '200':
        description: The new draft
        content:
          application/json:
            schema:
              $ref: ../components/schemas/trail-marketing.yaml#/TrailMarketingAsset
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '422':
        $ref: ../components/responses.yaml#/UnprocessableEntity
    x-error-codes:
    - BAD_REQUEST
    - UNAUTHORIZED
    - FORBIDDEN
    - NOT_FOUND
    - VALIDATION
    - REFERENCED_NOT_FOUND
    x-cli:
      name: create
      positional:
      - handle
/api/admin/trails/{handle}/marketing/{assetId}:
  get:
    operationId: getTrailMarketingAsset
    summary: Show a marketing asset
    description: 'One asset with its content, state, approval and delivery evidence.


      Served only while the `trail_marketing` flag is on for the project; otherwise `404`.


      Safe for the restricted ops key.


      **Use case:** Read the post a person handed off, with the URL they recorded.'
    tags:
    - Marketing
    parameters:
    - $ref: ../components/parameters.yaml#/ProjectId
    - $ref: ../components/parameters.yaml#/TrailHandle
    - $ref: ../components/parameters.yaml#/MarketingAssetId
