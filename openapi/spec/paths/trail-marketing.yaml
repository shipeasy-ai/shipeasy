/api/admin/trails/{handle}/marketing/{assetId}/deliver:
  post:
    operationId: deliverTrailMarketingAsset
    summary: Deliver a marketing asset now
    description: 'Send an approved asset now — if its timing allows. When the timing has arrived it moves to `delivering`: an email goes to the mail queue, a post or ad waits for a person to post it and
      mark it delivered. When it has not, the asset moves to `scheduled` and goes out on its own once it does. Refused with `409` while the `marketing/pause_sends` kill switch is armed.


      Served only while the `trail_marketing` flag is on for the project; otherwise `404`.


      Not open to the restricted ops key.


      **Use case:** The flag reached 100 % an hour ago; send the announcement now rather than waiting for the next tick.'
    tags:
    - Marketing
    parameters:
    - $ref: ../components/parameters.yaml#/ProjectId
    - $ref: ../components/parameters.yaml#/TrailHandle
    - $ref: ../components/parameters.yaml#/MarketingAssetId
    responses:
      '200':
        description: The asset
        content:
          application/json:
            schema:
              $ref: ../components/schemas/trail-marketing.yaml#/TrailMarketingAsset
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        $ref: ../components/responses.yaml#/Conflict
    x-error-codes:
    - UNAUTHORIZED
    - FORBIDDEN
    - NOT_FOUND
    - INVALID_TRANSITION
    x-cli:
      name: deliver
      positional:
      - handle
      - assetId
/api/admin/trails/{handle}/marketing/{assetId}/delivered:
  post:
    operationId: markTrailMarketingDelivered
    summary: Mark a marketing asset delivered
    description: 'Record that a handed-off post or ad went out (*Mark as posted* / *Mark as launched*): `postUrl` for a post; `campaignUrl` and the `budgetSet` actually set on the ad platform for an ad. The asset must be ready to post — `delivering`, i.e. approved and its timing arrived. Emails are marked delivered by the send itself.


      Recording a hand-off is a person''s call — only a dashboard session or a device-auth CLI session can do it.


      Served only while the `trail_marketing` flag is on for the project; otherwise `404`.


      Not open to the restricted ops key.


      **Use case:** The lead posted the announcement on LinkedIn; record the post''s URL.'
    tags:
