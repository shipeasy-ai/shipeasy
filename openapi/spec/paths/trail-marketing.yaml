/api/admin/trails/{handle}/marketing/{assetId}/approve:
  post:
    operationId: approveTrailMarketingAsset
    summary: Approve a marketing asset
    description: 'Approve an asset in review. Every link in its body is tagged with `utm_source`, `utm_medium`, `utm_campaign=trail-<n>` and `utm_content=<asset id>`, so signups are credited to it. An email
      whose audience does not fit what is left of today''s cap is refused (`409`).


      Approving is a person''s call. Only a dashboard session or a device-auth CLI session can approve — ops keys, project admin keys, agents and autopilot are refused with `403`. This operation is not
      exposed as an MCP tool.


      Served only while the `trail_marketing` flag is on for the project; otherwise `404`.


      Not open to the restricted ops key.


      **Use case:** The trail''s lead read the preview and approves the launch email.'
    tags:
    - Marketing
    parameters:
    - $ref: ../components/parameters.yaml#/ProjectId
    - $ref: ../components/parameters.yaml#/TrailHandle
    - $ref: ../components/parameters.yaml#/MarketingAssetId
    responses:
      '200':
        description: The asset
        content:
          application/json:
            schema:
              $ref: ../components/schemas/trail-marketing.yaml#/TrailMarketingAsset
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        $ref: ../components/responses.yaml#/Conflict
    x-error-codes:
    - UNAUTHORIZED
    - FORBIDDEN
    - NOT_FOUND
    - INVALID_TRANSITION
    - PLAN_LIMIT
    x-cli:
      name: approve
      positional:
      - handle
      - assetId
    x-mcp:
      hidden: true
/api/admin/trails/{handle}/marketing/{assetId}/cancel:
