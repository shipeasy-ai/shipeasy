    x-error-codes:
    - UNAUTHORIZED
    - FORBIDDEN
    - NOT_FOUND
    x-cli:
      name: list
      positional: []
  post:
    operationId: createMarketingList
    summary: Upload a contact list
    description: 'Upload a CSV or paste addresses as a new contact list. The upload must carry the uploader''s attestation that every address consented to marketing email from this project; it is stored
      on the list with who attested it and when. Invalid lines are reported back, not stored. A list holds at most 10,000 addresses (`400` beyond).


      Uploading is a person''s call — only a dashboard session or a device-auth CLI session can attest consent.


      Served only while the `trail_marketing` flag is on for the project; otherwise `404`.


      Not open to the restricted ops key.


      **Use case:** Upload the beta waitlist exported from the signup form.'
