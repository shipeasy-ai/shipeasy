    operationId: cancelTrailMarketingAsset
    summary: Cancel a marketing asset
    description: 'Cancel an asset that has not started going out. A send in flight is stopped by the `marketing/pause_sends` kill switch, not by cancelling.


      Served only while the `trail_marketing` flag is on for the project; otherwise `404`.


      Not open to the restricted ops key.


