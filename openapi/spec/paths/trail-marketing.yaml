/api/admin/marketing-lists:
  get:
    operationId: listMarketingLists
    summary: List contact lists
    description: 'The project''s uploaded contact lists, newest first, with their size and consent attestation. Archived lists are included with `archivedAt` set.


      Served only while the `trail_marketing` flag is on for the project; otherwise `404`.


      Safe for the restricted ops key.


      **Use case:** Pick the attested list to send the launch email to.'
    tags:
    - Marketing lists
    parameters:
    - $ref: ../components/parameters.yaml#/ProjectId
    responses:
      '200':
        description: The project's lists
        content:
          application/json:
            schema:
              $ref: ../components/schemas/trail-marketing.yaml#/ListMarketingListsResponse
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
