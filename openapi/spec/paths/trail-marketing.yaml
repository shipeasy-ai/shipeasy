  patch:
    operationId: updateTrailMarketingAsset
    summary: Edit a marketing asset
    description: 'Change an asset''s content, timing or audience. Editing an approved or scheduled asset drops its approval and sends it back to review; editing one with changes requested makes it a draft
      again. A delivering, delivered, failed or cancelled asset cannot be edited (`409`).


      Served only while the `trail_marketing` flag is on for the project; otherwise `404`.


      Safe for the restricted ops key.


      **Use case:** Fix a typo in the subject line after review asked for changes.'
    tags:
    - Marketing
    parameters:
    - $ref: ../components/parameters.yaml#/ProjectId
    - $ref: ../components/parameters.yaml#/TrailHandle
    - $ref: ../components/parameters.yaml#/MarketingAssetId
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/trail-marketing.yaml#/UpdateTrailMarketingAssetRequest
          example:
            content:
              subject: Trails now deliver your launch email
    responses:
      '200':
        description: The edited asset
        content:
          application/json:
            schema:
              $ref: ../components/schemas/trail-marketing.yaml#/TrailMarketingAsset
      '400':
        $ref: ../components/responses.yaml#/BadRequest
      '401':
        $ref: ../components/responses.yaml#/Unauthorized
      '403':
        $ref: ../components/responses.yaml#/Forbidden
      '404':
        $ref: ../components/responses.yaml#/NotFound
      '409':
        $ref: ../components/responses.yaml#/Conflict
      '422':
        $ref: ../components/responses.yaml#/UnprocessableEntity
    x-error-codes:
    - BAD_REQUEST
    - UNAUTHORIZED
    - FORBIDDEN
    - NOT_FOUND
    - INVALID_TRANSITION
    - VALIDATION
    - REFERENCED_NOT_FOUND
    x-cli:
      name: update
      positional:
      - handle
      - assetId
