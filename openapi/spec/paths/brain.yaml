/api/admin/brain/status:
  get:
    operationId: getBrainStatus
    summary: Brain status and seeding guide
    description: |-
      What the project brain holds — notes per type, links, candidates, held
      claims, orphans, the intake queue — and `guide`, the playbook for seeding
      or extending it. Call it first when asked to set up, seed or grow the
      brain, and again when done to report what changed.

      **Use case:** "Set up our brain" — read the status, follow `guide`
      (read the repo's own knowledge, write notes with `ops brain ingest`), then
      read the status again.
    tags:
      - Brain
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
    responses:
      "200":
        description: Brain status
        content:
          application/json:
            schema:
              $ref: ../components/schemas/brain.yaml#/BrainStatus
      "401":
        $ref: ../components/responses.yaml#/Unauthorized
      "403":
        $ref: ../components/responses.yaml#/Forbidden
    x-error-codes:
      - UNAUTHORIZED
      - FORBIDDEN
    x-cli:
      name: status
/api/admin/brain/notes:
  get:
    operationId: searchBrainNotes
    summary: Search the project brain
    description: |-
      Search the project's knowledge graph — conventions, pitfalls, decisions,
      concepts and facts, plus a note for every item, trail, flag, metric, PR
      and file they link. Title and slug hits rank over body hits, and a
      well-linked note over a lonely one. No `q` returns the most recently
      updated notes. Read one in full with `ops brain get <slug>`.

      **Use case:** Before designing a change to checkout, an agent asks what
      the team knows: `ops brain search "checkout retry"`.
    tags:
      - Brain
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - name: q
        in: query
        required: false
        description: Free-text query, e.g. `checkout retry`.
        schema:
          type: string
          minLength: 1
          maxLength: 500
      - name: type
        in: query
        required: false
        description: Only notes of this type.
        schema:
          $ref: ../components/schemas/brain.yaml#/BrainNoteType
      - name: limit
        in: query
        required: false
        description: Maximum notes to return (1-100). Defaults to 20.
        schema:
          type: integer
          minimum: 1
          maximum: 100
    responses:
      "200":
        description: Matching notes
        content:
          application/json:
            schema:
              $ref: ../components/schemas/brain.yaml#/SearchBrainNotesResponse
      "400":
        $ref: ../components/responses.yaml#/BadRequest
      "401":
        $ref: ../components/responses.yaml#/Unauthorized
      "403":
        $ref: ../components/responses.yaml#/Forbidden
    x-error-codes:
      - BAD_REQUEST
      - UNAUTHORIZED
      - FORBIDDEN
    x-cli:
      name: search
      positional:
        - q
/api/admin/brain/note:
  get:
    operationId: getBrainNote
    summary: Read one brain note
    description: |-
      One note in full: body, current facts and their history, held claims,
      every source that asserted it, and every link in and out (a backlink
      reads by its inverse relation — `touched_by`, `superseded_by`).

      **Use case:** `ops brain get flag/checkout` shows every item, trail,
      decision and pitfall that mentions the flag.
    tags:
      - Brain
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - name: slug
        in: query
        required: true
        description: "The note's slug: `flag/checkout`, `item/42`, `file/apps/web/src/a.ts`, `checkout-retry-policy`."
        schema:
          type: string
          minLength: 1
          maxLength: 300
        x-mcp:
          required: true
    responses:
      "200":
        description: The note
        content:
          application/json:
            schema:
              $ref: ../components/schemas/brain.yaml#/BrainNote
      "401":
        $ref: ../components/responses.yaml#/Unauthorized
      "403":
        $ref: ../components/responses.yaml#/Forbidden
      "404":
        $ref: ../components/responses.yaml#/NotFound
    x-error-codes:
      - UNAUTHORIZED
      - FORBIDDEN
      - NOT_FOUND
    x-cli:
      name: get
      positional:
        - slug
/api/admin/brain/coverage:
  get:
    operationId: getBrainCoverage
    summary: Check how complete the brain is on a topic
    description: |-
      What the brain knows about a topic, and what it is missing, as a ranked
      worklist. It takes the notes matching `topic` (or `slug` and its
      neighbours), then checks them for gaps: subjects other notes link to that
      nobody wrote, thin notes, notes with no summary, notes that name code but
      are not grounded in it, anchors whose code changed, held claims, live
      contradictions, notes untouched for six months, and the kinds of
      knowledge still missing (no pitfall, no decision…). `score` is 0-100.
      `next` is what to write, worst first.

      **Use case:** a system keeps the brain complete on what matters. It reads
      `ops brain coverage --topic checkout`, ingests notes that answer `next`,
      and reads coverage again until the score stops moving.
    tags:
      - Brain
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - name: topic
        in: query
        required: false
        description: The subject to check, e.g. `checkout retries`. Pass this or `slug`; with neither, the whole brain is checked (its newest 300 notes).
        schema:
          type: string
          minLength: 1
          maxLength: 500
      - name: slug
        in: query
        required: false
        description: Check a note and its neighbourhood instead of a search.
        schema:
          type: string
          minLength: 1
          maxLength: 300
      - name: depth
        in: query
        required: false
        description: Hops around the matches to include (0-2). Defaults to 1.
        schema:
          type: integer
          minimum: 0
          maximum: 2
    responses:
      "200":
        description: Coverage and gaps
        content:
          application/json:
            schema:
              $ref: ../components/schemas/brain.yaml#/BrainCoverage
      "401":
        $ref: ../components/responses.yaml#/Unauthorized
      "403":
        $ref: ../components/responses.yaml#/Forbidden
      "404":
        $ref: ../components/responses.yaml#/NotFound
      "422":
        $ref: ../components/responses.yaml#/UnprocessableEntity
    x-error-codes:
      - UNAUTHORIZED
      - FORBIDDEN
      - NOT_FOUND
      - VALIDATION
    x-cli:
      name: coverage
/api/admin/brain/graph:
  get:
    operationId: getBrainGraph
    summary: Read a neighbourhood of the brain
    description: |-
      The notes within `depth` hops of `slug` (links followed both ways) and the
      edges between them — or, without a slug, the most recently updated notes
      and their edges.

      **Use case:** Everything two hops from `item/42`: its files, the flags it
      mentions, and the pitfalls other work left on them.
    tags:
      - Brain
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - name: slug
        in: query
        required: false
        description: The note to start from.
        schema:
          type: string
          minLength: 1
          maxLength: 300
      - name: depth
        in: query
        required: false
        description: Hops to follow (1-4). Defaults to 2.
        schema:
          type: integer
          minimum: 1
          maximum: 4
      - name: limit
        in: query
        required: false
        description: Maximum notes (1-300). Defaults to 100.
        schema:
          type: integer
          minimum: 1
          maximum: 300
    responses:
      "200":
        description: Nodes and edges
        content:
          application/json:
            schema:
              $ref: ../components/schemas/brain.yaml#/BrainGraph
      "401":
        $ref: ../components/responses.yaml#/Unauthorized
      "403":
        $ref: ../components/responses.yaml#/Forbidden
      "404":
        $ref: ../components/responses.yaml#/NotFound
    x-error-codes:
      - UNAUTHORIZED
      - FORBIDDEN
      - NOT_FOUND
    x-cli:
      name: graph
/api/admin/brain/sources:
  get:
    operationId: listBrainSources
    summary: List what the brain read
    description: |-
      The brain's intake: every input it read (text sent in, shipped items,
      answered questions, trails), newest first, with its extraction state,
      the notes it produced and the model tokens it cost.
    tags:
      - Brain
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - name: limit
