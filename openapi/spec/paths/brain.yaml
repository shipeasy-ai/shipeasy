        description: Maximum sources (1-200). Defaults to 50.
        schema:
          type: integer
          minimum: 1
          maximum: 200
    responses:
      "200":
        description: Sources
        content:
          application/json:
            schema:
              $ref: ../components/schemas/brain.yaml#/ListBrainSourcesResponse
      "401":
        $ref: ../components/responses.yaml#/Unauthorized
      "403":
        $ref: ../components/responses.yaml#/Forbidden
    x-error-codes:
      - UNAUTHORIZED
      - FORBIDDEN
    x-cli:
      name: sources
/api/admin/brain/ingest:
  post:
    operationId: ingestBrain
    summary: Teach the brain
    description: |-
      Send knowledge in — one to twenty notes. Each is reconciled into the note
      its title lands on rather than added beside it: the later claim wins
      within the same source strength, a weaker source never overwrites a
      stronger one (a person > verified code > a merged PR > a ticket > text
      sent in), every rewrite keeps a revision, and the same text twice changes
      nothing.

      By default shipeasy's model extracts and verifies the text (billed to the
      project's Jarvis credits). When you already wrote each note in its final
      form — seeding from the repo — pass `extract: false` and use the markup:
      `type:: convention`, `summary:: one line`, `key:: value` facts, typed
      links (`depends_on:: [[Billing]]`), `[[Other note]]`, `@gate:<key>`, `#42`,
      backticked repo paths. Ground each note with `evidence` — a repo path and
      a snippet copied verbatim from it; verified evidence makes the note
      outrank anything said about that code, and it is re-checked when the file
      changes. Lessons, not logs: one subject per note.

      **Use case:** Seeding: read README / CLAUDE.md / design docs, then send
      `{notes: [{text: "# Retries are capped\ntype:: convention\n…", extract: false, source: "seed:claude", evidence: [{path: "src/retry.ts", snippet: "export const MAX_RETRIES = 3;"}]}]}`.
    tags:
      - Brain
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/brain.yaml#/IngestBrainRequest
          examples:
            seed:
              summary: A seeded convention, grounded in the code
              value:
                notes:
                  - text: "# Checkout retries are capped\ntype:: convention\nsummary:: Capture retries stop at 3 with backoff\nretry_limit:: 3\n\nRetries live in `apps/web/src/checkout/retry.ts` and always carry an idempotency key."
                    extract: false
                    source: seed:claude
                    evidence:
                      - path: apps/web/src/checkout/retry.ts
                        snippet: "export const MAX_RETRIES = 3;"
            postmortem:
              summary: Prose for the model to extract
              value:
                notes:
                  - text: "Postmortem: double charges on 2026-10-02 came from retries without an idempotency key."
                    source: postmortem 2026-10-02
    responses:
      "200":
        description: What happened to each note
        content:
          application/json:
            schema:
              $ref: ../components/schemas/brain.yaml#/IngestBrainResponse
      "400":
        $ref: ../components/responses.yaml#/BadRequest
      "401":
        $ref: ../components/responses.yaml#/Unauthorized
      "403":
        $ref: ../components/responses.yaml#/Forbidden
      "422":
        $ref: ../components/responses.yaml#/UnprocessableEntity
    x-error-codes:
      - BAD_REQUEST
      - UNAUTHORIZED
      - FORBIDDEN
      - VALIDATION
    x-cli:
      name: ingest
