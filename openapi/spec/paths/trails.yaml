/api/admin/trails/{handle}/changes:
  post:
    operationId: linkTrailPr
    summary: Link a pull request to a trail
    description: |-
      Link a pull request to the trail as one of its *changes*. From then on the GitHub webhook records its pushes, the project's review agents score each push, and the merge gates read it. Linking a pull request the trail already has is a no-op; a pull request that belongs to a different trail is refused with `409`. Pass `item` when an item's run opened the PR, so the change shows under that item.

      Safe for the restricted ops key.

      **Use case:** A coding agent working a trail opens a PR and links it with `trails link-pr T-12 <url>`.
    tags:
      - Trails
    parameters:
      - *a1
      - *a2
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ops.yaml#/LinkTrailPrRequest
          example:
            prUrl: https://github.com/acme/api/pull/41
    responses:
      "200":
        description: The change
        content:
          application/json:
            schema:
              $ref: ../components/schemas/ops.yaml#/TrailChange
      "400":
        $ref: ../components/responses.yaml#/BadRequest
      "401":
        $ref: ../components/responses.yaml#/Unauthorized
      "403":
        $ref: ../components/responses.yaml#/Forbidden
      "404":
        $ref: ../components/responses.yaml#/NotFound
      "409":
        $ref: ../components/responses.yaml#/Conflict
      "422":
        $ref: ../components/responses.yaml#/UnprocessableEntity
    x-error-codes:
      - BAD_REQUEST
      - UNAUTHORIZED
      - FORBIDDEN
      - NOT_FOUND
      - ALREADY_EXISTS
      - INVALID_TRANSITION
      - REFERENCED_NOT_FOUND
      - VALIDATION
    x-cli:
      name: link-pr
      positional:
        - handle
        - prUrl
  delete:
    operationId: unlinkTrailPr
    summary: Unlink a pull request from a trail
    description: Detach a pull request from the trail. Its recorded pushes, evals, findings and approvals stay in history but no longer count toward the trail's gates. A merged change cannot be unlinked.
    tags:
      - Trails
    parameters:
      - *a1
      - *a2
      - name: prUrl
        in: query
        required: true
        description: The pull request's URL.
        schema:
          type: string
          minLength: 1
          maxLength: 500
    responses:
      "200":
        description: The change was unlinked
        content:
          application/json:
            schema:
              $ref: ../components/schemas/ops.yaml#/TrailOkResponse
            example:
              ok: true
      "400":
        $ref: ../components/responses.yaml#/BadRequest
      "401":
        $ref: ../components/responses.yaml#/Unauthorized
      "403":
        $ref: ../components/responses.yaml#/Forbidden
      "404":
        $ref: ../components/responses.yaml#/NotFound
      "409":
        $ref: ../components/responses.yaml#/Conflict
    x-error-codes:
      - BAD_REQUEST
      - UNAUTHORIZED
      - FORBIDDEN
      - NOT_FOUND
      - INVALID_TRANSITION
    x-cli:
      name: unlink-pr
      positional:
        - handle
/api/admin/trails/{handle}/runs:
  post:
    operationId: startTrailRun
    summary: Start an agent on a trail
    description: |-
      Fire the project's coding-agent trigger on the trail. While the project requires a plan (`trail-gates` `requirePlan`, on by default) and the trail has no approved one, this fires a read-only **plan** run: it reads the trail, asks the person how it should ship (straight to main, behind a flag, flag and experiment, kill switch, flag and kill switch) and anything else that is open through `ops questions ask`, then submits a plan with `trails submit-plan`. Once a person approves the plan (`trails approve-plan`), starting an agent **builds** it.

      **Build.** When the approved plan filed items, `build` launches an item run for every open item of the first milestone that still has open items and no run working it (items without a milestone count as the first), at most `trail-gates` `maxParallelRuns` (default 3) at once, and no trail-level build run: `run` is `null` and `itemRuns` says what happened to each item. Each item run opens its own pull request, which becomes a change of the trail. Otherwise one trail-level build run carries the plan to pull requests, creates exactly the resources the plan lists and links them, as before, and `itemRuns` is empty.

      **Replan.** Once a plan is approved, `kind: replan` fires a read-only run that re-reads the goal metric, the items' outcomes and project memory and submits the plan's next revision, which waits as `drafted` for approval.

      `fix` runs are fired by the server when a change's evals or findings fail. Pass `kind` to ask for one explicitly. Runs spend your own agent quota, not Shipeasy credits.

      **Use case:** A trail is created from a feature request; start an agent on it to plan it, approve the plan, then start it again to build.
    tags:
      - Trails
    parameters:
      - *a1
      - *a2
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ops.yaml#/StartTrailRunRequest
          example:
            agent: claude
    responses:
      "200":
        description: The trail-level run that was started, or the item runs a build launched
        content:
          application/json:
            schema:
              $ref: ../components/schemas/ops.yaml#/StartTrailRunResult
      "400":
        $ref: ../components/responses.yaml#/BadRequest
      "401":
        $ref: ../components/responses.yaml#/Unauthorized
      "403":
        $ref: ../components/responses.yaml#/Forbidden
      "404":
        $ref: ../components/responses.yaml#/NotFound
      "409":
        $ref: ../components/responses.yaml#/Conflict
      "422":
        $ref: ../components/responses.yaml#/UnprocessableEntity
    x-error-codes:
      - AGENT_NOT_CONNECTED
      - BAD_REQUEST
      - UNAUTHORIZED
      - FORBIDDEN
      - NOT_FOUND
      - INVALID_TRANSITION
      - VALIDATION
    x-cli:
      name: start
      positional:
        - handle
/api/admin/trails/{handle}/plan:
  post:
    operationId: submitTrailPlan
    summary: Submit a trail's plan
    description: |-
      A plan run submits what it worked out: the plan in markdown, the `release` block (how the trail ships, why, and the exact flags, kill switches, experiments and tracking — events, metrics, alert rules — the build will create; no release tool for `straight_to_main`), the `breakdown` (the milestones and the items, each with its work kind and assignee) and the `sources` it rests on (what it read in project memory and earlier tickets, and what each settled). Submit it only after the person has answered the release question you asked with `ops questions ask`. The plan is recorded as `drafted` and waits for a person to approve it; nothing in the breakdown is filed until then. Submitting again replaces a drafted plan; an approved plan is refused with `409` (a person edits it to reopen it), except from a `replan` run, whose submission drafts the next revision with a `summary` of what changed. The open plan or replan run on the trail is closed.

      Safe for the restricted ops key.

      **Use case:** The person picked "behind a flag"; the plan run submits the plan listing the flag `checkout.v2`.
    tags:
      - Trails
    parameters:
      - $ref: ../components/parameters.yaml#/ProjectId
      - $ref: ../components/parameters.yaml#/TrailHandle
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ops.yaml#/SubmitTrailPlanRequest
          example:
            plan: "## Approach\nAdd the retry queue behind `checkout.v2` and read it in the checkout handler"
            release:
              strategy: flag
              reason: The checkout path is high traffic and the change is easy to switch off
              resources:
                - kind: gate
                  key: checkout.v2
                  role: ships_behind
    responses:
      "200":
        description: The plan as recorded
        content:
          application/json:
            schema:
              $ref: ../components/schemas/ops.yaml#/TrailPlanResult
      "400":
        $ref: ../components/responses.yaml#/BadRequest
      "401":
        $ref: ../components/responses.yaml#/Unauthorized
      "403":
        $ref: ../components/responses.yaml#/Forbidden
      "404":
        $ref: ../components/responses.yaml#/NotFound
      "409":
        $ref: ../components/responses.yaml#/Conflict
      "422":
        $ref: ../components/responses.yaml#/UnprocessableEntity
    x-error-codes:
      - BAD_REQUEST
      - UNAUTHORIZED
      - FORBIDDEN
      - NOT_FOUND
      - INVALID_TRANSITION
      - VALIDATION
    x-cli:
      name: submit-plan
      positional:
        - handle
  patch:
    operationId: updateTrailPlan
    summary: Edit a trail's plan
    description: |-
